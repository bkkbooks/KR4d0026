body:
  text: 太常博士尹君墓志銘君諱源字子漸姓尹氏與其弟洙師魯俱有名於當世其論議文章博學強記皆有以過人而師魯好辨果於有為子漸為人剛簡不矜飾能自晦藏與人居久而莫知至其一有所發則人必驚伏其視世事若不干其意已而榷其情僞計其成敗後多如其言其性不能容常人而善與人交久而益篤自天聖明道之間豫與其兄弟交其得於子漸者如此其曾祖諱誼贈光祿少卿祖諱文化官至都官郎中贈刑部侍郎父諱仲宣官至虞部員外郎贈工部郎中子漸初以祖廕補三班借職稍遷左班殿直天聖八年舉進士及第為奉禮郎纍遷太常博士歷知芮城河陽二縣僉署孟州判官事又知新鄭縣通判涇州慶州知懷州以慶曆五年三月十四日卒于官趙元昊冦邉圍定州堡大將葛懷敏發涇原兵救之君遺懷敏書曰賊舉其國而來其利不在城堡而兵法有不得而救者且吾軍畏法見敵必赴而不計利害此其所以數敗也宜駐兵瓦亭見利而後動懷敏不能用其言遂以敗死劉渙知滄州杖一卒不服渙命斬之以聞坐專殺降知密州君上書為渙論得復知滄州范文正公常薦君材可以居館閣召試不用遂知懷州至期月大治是時天子用范文正公與今觀文殿學士富公武康軍節度使韓公欲更置天下事而權幸小人不便三公皆罷去而師魯與時賢士多被誣枉得罪君歎息憂悲發憤以謂生可厭而死可樂也往往被酒哀歌泣下朋友皆竊怪之已而以疾卒享年五十至和元年十有二月十三日其子材葬君于河南府壽安縣甘泉鄉龍洲里其平時所為文章六十篇皆行于世男四人曰材植機杼嗚呼師魯常勞其智於事物而卒蹈憂患以窮死若子漸者曠然不有纍其心而無所屈其志然其壽考近以不長豈其所謂短長得失者皆非此之謂歟其所以然者不可得而知歟銘曰有韞于中不以施一憤樂死其如歸豈其志之將衰不然世果可嫉其如斯故河南尹君墓志銘並序韓琦河南尹君名朴字處厚師魯之長子也幼博學能文通春秋知古今議論根蒂經史明白是非雖先達父友皆竦然屈服不敢以齒少遇之師魯高文大節當世師仰居家未嘗不以古聖賢之道誨其子弟故處厚不獨天性超絶以承父之教薰炙漸漬而至于大成焉嘗一舉進士誤為有司所絀反笑曰是豈足以䀆吾才邪師魯勉以應制舉於是所記益廣所學益深師魯每歎曰吾道之克傳吾門之所寄在此兒也慶曆中余與今樞密副使田公元均奉詔宣撫陜西時縉紳草澤上書以方略言者數百人余請田公第其高下而獨取布衣趙仁濟者為第一然怪其所論特奇疑非仁濟言既而知處厚代為之田公驚而謂余曰尹氏有子矣尹氏有子矣自是余嘗稱於公卿間謂其學必能繼師魯其才必為朝廷所用不幸年二十五而亡良可哀已師魯諱洙官至起居舍人直龍圖閣以讒貶崇信軍節度副使未起而卒處厚娶王氏再娶宗氏一男曰煥一女尚幼處厚將從師魯之喪葬于緱氏也其從弟材來告曰伯父以公之知處厚也嘗屬材曰異日當請銘於公今葬矣敢以伯父之言告乃為銘曰惟壽惟夭達者一焉愚壽而滅賢夭而傳嗚呼處厚孰短孰延吾疑禍福不主于天惡兮不折善兮不年天果主邪胡為而然尹判官墓志范純仁君姓尹氏諱高廟諱字嗣復師魯第三子也師魯諱洙師魯其字也以道德文章名重天下天下之人識與不識皆稱曰師魯自大父以上官諱族系韓魏公表師魯之墓書之詳矣慶曆七年先君文正公守南陽時豫侍行師魯自鄖鄉輿疾而來託先公以後事豫得省疾于卧內見嬰兒扶床方二三歲睂宇秀爽師魯指謂豫曰此吾兒也豫始識君而􅋢其神俊異常又念師魯之積善必謂其遠大不可量也後十二年方見於許昌方十五歲舉止談論已如成人豫自謂所期果不妄矣又十六年忽聞君之訃驚漢自失乃知天理人事之難必而心深痛大賢之失其後也君以翰林諸公薦名臣之後特恩補太廟齊郎年未應調魏公奏為相州安陽縣主簿黠吏易君少而為姦君得其情皆按以法一邑驚服魏公鎮大名復辟監倉草場秩滿調泗州觀察判官未行以熙寧八年六月十四日卒于許昌之長葛縣享年三十有一君天資英爽讀書一覽輒不忘未冠已與老成長者游為文章下筆即成不加點竄善談論有時揚榷古今一坐皆傾英宗初即位魏公以顧命元勳求解機務上不之許魏公未敢堅去君上書於魏公曰功成身退乃天之道公今眷眷君臣之契不忍訣去而久持大權讒嫉者衆將有媒孽之巧伺隙而進一旦禍機濳發令名不終則公將噬臍悔何及也魏公嗟賞之曰真有父風後魏公得請外鎮蓋用其言性至孝十歲持母喪哀棘如禮見者嗟歎為人真率不事矯飾於財利爵祿未嘗屑意待人無城府受朋友規切竦然聽從朋友之過亦必忠告人有厄窮務竭力拯救以是人樂與之游當官論事直伸其理未嘗少屈相守尚威嚴事有不便他吏不敢白君曰茍容畏事以遂上官之失豈士人之行耶獨往辨正其事守亦納之更為薦舉公卿大夫薦其才者凡十餘人娶李氏豫舅氏司農少卿諱禹卿之女生一子照尚幼其猶子煥奉君之喪以元豐七年正月二十一日葬于河南府壽安縣甘泉鄉龕澗里先營之次而求銘於豫為之銘曰騏驥為駒骨相不羣豫章發地勢凌青雲嗣復在幼星眸貝齒爽如秋隼一翥千里未冠能文擺落塵腐大節可觀不屑細故才長命短器遠位局欲奮而萎壯年就木秀而不實聖人有言積善餘慶經豈徒云君躬弗蒙宜在後昆勒辭于石終古其存尹師魯河南集序高平范仲淹豫觀堯典舜歌而下文章之作醇醨迭變人賈侣乎惟抑末揚本去鄭復雅左右聖人之道者難之近則唐正元元和之間韓退之主盟于文而古道最盛懿僖以降寖及五代其體薄弱皇朝柳仲塗起而麾之髦俊率從焉仲塗門人能師經探道有文於天下者多矣洎揚大年以應用之才獨步當世學者刻辭鏤意有希髣佛未暇及古也其間甚者專事藻飾破碎大雅反謂古道不適於用廢而弗學者久之洛陽尹師魯少有高識不逐時輩從穆伯長游力為古文而師魯深於春秋故其文謹嚴辭約而理精章奏疏議大見風采士林方聳慕焉遽得歐陽永叔從而大振之由是天下之文一變而其深有功於道歟師魯天聖二年登進士第後中拔萃科從事于西都時洛守王文正沂公暨王文康公並加禮遇遂引薦於朝置之文館尋以論事切直貶監郢州市征後起為陜西經略判官屢更邉任遷起居舍人直龍圖閣知潞州以前守平涼日貸公食錢于將佐議者不以情復貶漢東節度副使歲餘監均州市征豫方守南陽郡一旦師魯舁疾而來相見纍日無一言及後事家人問之不答豫即告之曰師魯之行將與韓公稚圭歐陽永叔述之以貽後代君家雖貧共當捐俸以資之君其端心靖神無或後憂師魯舉手曰公言䀆矣我不復云翌日往視之不獲見傳言曰已别矣遂隱機而卒故人諸生聚而泣之且歎其精明如是剛決如是死生不能亂其心可不謂正乎死而不失其正君子何少哉師魯之才之行與其履歷則百永叔為之墓詺稚圭為之墓表此不􅍯載噫師魯有心於時而多難不壽所為文章亦未嘗編次惟先傳於人者索而類之成十卷亦足見其志也故序之河南先生文集總目卷一皇雅律詩卷二雜擬卷三雜文卷四記卷五序卷六書啓卷七書啓卷八書啓卷九書啓卷十書啓卷十一書啓卷十二行狀碑卷十三表碣述志銘卷十四志銘卷十五志銘卷十六志銘卷十七志銘祭文卷十八表疏卷十九劄子卷二十奏狀卷二十一奏狀卷二十二奏狀卷二十三奏議卷二十四申狀卷二十五申狀卷二十六五代春秋卷二十七五代春秋卷二十八附録河南先生文集總目祭龍圖尹公師魯文韓琦維慶曆七年某月某朔某日具官某謹以清酌庶羞之奠致祭于故龍圖舍人尹君師魯之靈嗚呼師魯惟君之生天與英奇如鑑之明無隱不窺如材之美無用不宜仁義之勇過於虎羆疑昧之決審乎蓍龜首倡古文三代是追學者翕從聖道乃夷名重天下無人不知知之深者非余而誰伊昔夏人擾于西垂余忝兵任君實同之周旋塞上余往君隨晝籌夜畫忍睡忍饑星霜矢石勞苦艱巇凡四五年心憊形羸退而視君志不少衰上嘉君勤進督渭師懷敏之後破壞創痍君能䀆力補綴撑持曰兵曰民以治以綏如得父母衆心熙熙保邉務實恥于妄為不合小人乃啓禍基易慶晉潞奔命何疲輸忠抗論伺者乘危君前在渭屬防秋時以公廨緡貨其偏裨俾償宿負􅊵干典彝月取其俸送官勿虧且責效命投死無疑職此抵罪竄斥流離衆謂之冤君甘如飴自隨徙均帝方念兹奈何窮山感疾無醫君決不起指鄧而馳范公大賢來託孤遺謂無怛化言色怡怡忽整衣冠盥滌莊祇慿几而逝衆皆歎悲范公之書其說如斯嗚呼哀哉彼倉冥冥莫可究推賢者胡惡動與屯其不肖胡佑坐來福禧以道而屯死為人思以幸而福生為人嗤在君所得何必期頥嗚呼哀哉余之與君義雖朋執情則塤箎葬不執紼奠不捧巵使我大恨痛切肝脾徒慿薄祭一寫哀辭琴不鼓矣嗚呼子期尚饗祭尹師魯舍人文范仲淹維慶曆七年四月十一日具位某謹致祭于故龍圖舍人師魯之靈嗚呼天生師魯有益當世為學之初時文方麗子師何人獨有古意韓柳宗經班馬序事衆莫子知子特弗移是非乃定英俊乃隨聖朝之文與唐等夷繄子之功多士所推堂堂沂公延於幕中矯矯文康薦于四聰自茲登瀛坐揚清風舉止甚直議論必公人事多故遷謪羇旅子行其志曾不為苦才弗可掩起于貶所往二經略屢典藩府自謂功名如芥可取黑白太明吏議橫生斥於散地頽然不爭惟曰我咎匪由人傾天意已回吉宜大來于何感疾益重其災隱几澄神而已焉哉嗚呼人皆有死子死特異神不惑亂言皆名理能齊死生信有人矣嗚呼與子往還抑亦有年今見其終益知子賢故友門人􅍟泣漣漣哀哉哭尹舍人詞并序富弼亡友河南尹洙字師魯嘗為起居舍人直龍圖閣知渭州乙酉歲謫官漢東未幾稍遷于均疾且革訪醫南陽以託范公醫不效遂沒焉時豫官汶上又東徙乎盧距其沒所遠甚歎師魯之不得見復不得撫其襯一祭其神因追思其平生所可列恨未有以卒其志為辭而哭之嗚呼人皆貴君實悴焉人皆富君實窶焉人皆老君實夭焉吾知君為深是三者舉非君之志不吾焉哭哭必義始君作文世重淫麗諸家舛殊大道破碎漫漶費詞不立根柢號類嘯朋爭相教惎上翔公卿下典書制君于厥時了不為意獨倡古道以救其敝時俊化之識文之詣今則亡矣使斯文不能救其源而極其致吾是以哭之始君為學遭世乖離掠取章句屬為文詞經有仁義曾非所治史有褒貶亦弗以思君顧而歎嫉時之為鈎抉六籍潜心以稽上下百世指掌而窺功不茍進習無匪彝今則亡矣使所學不能信于人而用于時吾是以哭之惟文與學二事既隆充用而衷豐于時窮純深蘊積資而為德行乎已而已必裕形乎家而家必克今則亡矣使賢者之行不能移人心而化大國吾是以哭之積德既成道隨而生謀罔不究動必有經列于庭則以蹇諤見黜于邉則以威懷取寧才望既出讒嫉以興酷罰嗣降慍色不形今則亡矣使君子之道不能被天下而致太平吾是以哭之嗚呼師魯君生于時實惟恢奇鍾此具美謂必有光大以奮康濟是期胡既厚其稟而反速其萎凡粵中蘊百亡一施豈茫茫下土天亦有所不知耶將冥冥上穹人固非其所司耶何惡不必釁而善不必禔忠良而夭險狼而耆汨淆參錯顚倒乖暌天其或者世不欲常泰人不欲常熙吾疑夫激者之論差不得而信之第於師魯哭無已而一哭而慟再哭而咽三哭而魂離四哭而腸絶蘇而復哭哭又不足聊以寫吾之哭聲而寓于辭庶不泯沒於陵谷哭尹師魯蘇舜欽前年子漸死豫哭大江頭今年師魯死豫方旅長洲初聞尚疑惑涕淚己不收舉杯欲向口荆棘生咽喉憶初定交時後前穆與歐君顏白如霜君語清如流豫年人甚少學古衆所羞君欲舉拔萃聲譽日搜搜不鄙吾學異推尊謂前修今踰二十年迹遠心甚稠後會國南門夜談雪滿樓青燈照素髮酒闌氣益遒昨君握兵柄節制關外侯豫才入册府俄作中都囚飛章力辨雪危言動前旒時雖不見省凜凜壓衆婾旋聞君下獄六月送渭州渭州舊治所昔擁萬貔貅堂中坐玉帳堂下森蛇矛令嚴山石裂恩煦春色浮釁生無根牙衆言起愆尤返來入狴犴吏􅍟安可酬法冠巧權詐刺骨不肯抽削秩貶漢東驅迫日置郵窮塗無一簪百口誰相賙諸子繼死亡清血漬兩眸貿然幾喪明憤苦結不瘳君性本剛峭安可小屈柔暴罹此冤辱苟活何所求人間不見容不若地下遊又疑天憎善專與惡報讎二𥪡濳膏肓衆鬼來揶􅟧棄局奔南陽後事悍所投心膽尚卓犖精明已彌留生平經緯才蕭瑟掩一丘青天自茫茫長夜何悠悠萬物孰不死死常在嚴秋君齒方盛壯衆期樹風猷二邉況橫猾四海皆瘡疣斯時忽云亡孰為朝廷憂豫方編吳氓日自親鋤耰無緣匐匍救几几空悲愁時思莊生言所樂唯髑髏物理不可詰此說誠最優祭尹師魯文歐陽修嗟乎師魯辨足以窮萬物而不能當一獄吏志可以狹四海而無所措其一身窮山之崖野水之濱猿猱之窟麋鹿之羣猶不容於其間兮遂即萬鬼而為鄰嗟乎師魯世之惡子之多未必若􅋢子者之衆而其窮而至此兮得非命在乎天而不在乎人方其奔顚斥逐困死艱屯舉世皆冤而語言未嘗以自及以窮至死而妻子不見其悲欣用舍進退屈伸語默夫何能然乃學之力至其握手為訣隱几待終顏色不變笑言從容死生之間既已能通於性命憂患之至宜其不纍於心胸自子云逝善人宜哀子能自達豫又何悲惟其師友之益平生之舊情之難忘言不可究嗟乎師魯自古有死皆歸無物惟聖與賢雖埋不沒尤於文章焯若星日子之所為後世師法雖嗣子尚幼未足以付豫而世人藏之庶可無於墜失子於衆人最􅋢豫文寓辭千里侑此一樽冀以慰子聞乎不聞尚享與文正范公論師魯行狀書韓琦某啓辱教示及之翰所撰師魯行狀俾附永叔作志文讀之思其人悲咽不能勝觀所載事又有與聞見殊不相合者大以為疑及閲尹氏姪子辨列則皆某之疑者於是釋然無所恨而喜尹氏有人矣甚善某憶公前書道師魯將亡時公亟往而謂曰師魯平生節行當請歐陽永叔與相知者為文字垂于不朽師魯舉手叩頭曰䀆矣某復何言某又嘗接師魯言以為天下相知之深者無如之翰則於紀述之際宜如何哉今所誤書若不先由之翰刋正遂寄永叔彼果能斥其說皆以實書之則行狀與墓銘二文相戾不獨惑于今世且惑後世是豈公許死者之意果可不朽邪之翰果䀆相知之誠不負良友邪嗚呼師魯有經濟之才生不得䀆所蘊謪非其罪而死又為平生相知者所誣以惡書之是必不瞑于地下矣實善人之重不幸也且前賢行狀必求故人故吏為之者不徒詳其家世事迹而已亦欲掩疵揚善以安孝子之心況無假于掩而反誣之乎夫生則賣友以買直死則加惡以避黨此固庸人之不忍為豈之翰之心哉但恐不知其詳耳然不知其詳而輕書之以貽今世後世之惑使師魯不瞑于地下為交友者不得無過今聞之翰領江南漕必已離安陸願公不以千里之遠速以行狀附還使詳尹姪之說悉刋其誤然後以寄永叔必能推而廣之使師魯之行實傳之光顯垂于無窮則公之許死者是謂踐其言天下忠義之人皆有所勸公之名德益重于世矣幸甚幸甚故崇信軍節度副使檢校尚書工部員外郎尹公墓表韓琦公諱洙字師魯其先太原人曾祖誼以道晦亂世不仕祖文化始以材行興其家官至都官郎中贈刑部侍郎父仲宣舉明經纍長郡邑廉恕明決所至以循吏稱終虞部員外郎以公貴贈工部郎中刑部葬其父河南今為河南人公幼聰敏喜學無所不通尤長於春秋善議論參質古今開判凝滯聞者欣服之天聖二年登進士第授綘州正平縣主簿歷河南府戶曹參軍邵武軍判官舉書判拔萃遷山南東道節度掌書記知河南府伊陽縣時天下無事政闕不講以兵言者為妄人公乃著敘燕息戍等十數篇以斥時弊時人服其有經世之才文康王公知而薦之召試充館閣校勘遷太子中允時文正范公治開封府每奏事見上論時政指丞相過失貶知饒州余公安道上疏論救坐以朋黨貶監筠州酒稅公慨然上書曰臣以仲淹忠諒有素義兼師友以靖比臣臣當從坐貶崇信軍節度掌書記監郢州商稅歐陽公永叔移書讓諌官不言又貶夷陵令當是時天下稱為四賢徙唐州丁父憂服除復得太子中允知河南府長水縣趙元昊反康定元年春冦延州大將劉平逆戰陷虜天子乃命文莊夏公都部署陜西之兵開府永興軍以經略招討之豫與范公為之副公為判官未幾上遣翰林學士朝公宗慤入內都知王守忠督出兵攻賊合府議奏曰今將興兵尚未習練願謹邉防期以歲月平之使還而賊復冦鎮戎軍部將劉繼宗禦之為賊所敗詔下切責俾以進兵月日來上府中復議曰將在軍雖得以自便然攻守大計當稟算于朝廷乃畫攻守二策余與公詣闕奏之唯上所擇詔取攻策已而難之事方寢賊復遣人以書叩延州僞請和而大舉兵冦涇原之山外殺部署任福公時在慶州得涇原求援書即移文慶帥率其部將劉政鋭兵數千人便道走鎮戎未至賊引去夏公奏公為專徙通判濠州又改秦州遷知涇州徙渭州兼管勾涇原路經略部署司事涇原乘葛師懷敏覆軍之後傷夷殘缺千罅百漏公夙夜撫葺一道以完時宣徽使鄭公為陜西四路帥主靜邉寨主劉滬議遣其屬官著作佐郎董士廉與滬於章川堡南入諸羌中開道二百里修水洛城以通秦之援兵公曰賊數犯塞必並兵一道五路帥之戰兵嘗不登二萬人而當賊昊舉國之衆吾兵所以屢為賊困者由黃石河路來援雖遠水洛路二日而援師安然以濟今無故奪諸羌田二百里列堡屯師坐耗芻糧不勝計以冀秦援一二日之速則吾兵愈分而邉用不給矣乃奏罷之便詔從之㑹鄭以府罷改知永興軍乃署前帥牒飭滬等督役如初二人者遂不奉詔興作不已公遣人召滬者再不至乃命瓦亭寨主張忠代滬滬復不受代部署狄公於是親至德順軍攝滬士廉下獄差官按問而鄭比奏本道沮滬等功朝廷卒薄滬等罪徙公慶州而城水洛焉會慶帥孫公請終任改知晉州慶曆四年契丹遣使報西伐元昊詔河陜三路要郡皆擇人徙知潞州當范公之在二府也余安道歐陽永叔輩並為諌官天下屬望諸公日竭忠獻納不避權貴而公方勤勞塞上迹遠朝廷暨諸公相繼罷去向天下目之為賢者執政指之為黨皆欲因事斥逐之士廉者即詣闕上書以水洛事訟公且誣公在渭有盜贓制使承風指按驗百端不能得一毫以汙公有部將孫用者出于軍校嘗自京取民息錢至官貧不能償公與狄公惜其材乃分假公使錢俾償其民而月取其俸償于官逮按問而錢先已輸官矣坐此貶公崇信軍節度副使徙監均州酒稅得疾沿牒至南陽訪醫藥疾革􅍟賓客妻子無一戚言整冠帶盥濯怡然隱几而卒時年四十七慶曆七年四月十日也公天性慈仁內剛外和凡事有小而可矜者必惻然不忍發見顏貌及臨大節􅍘大事則心如金石雖鼎鑊前列不可變也在軍謙勤􅋢士雖悍夫冗列皆降意容接故人人願䀆其力所至郡邑修設條教務以實惠及下去則人思之文章自唐衰歷五代日淪淺俗寖以大敝本朝柳公仲塗始以古道發明之後卒不能振天聖初公獨與穆參軍伯長矯時所尚力以古文為主次得歐陽永叔以雄詞鼓動之於是後學大悟文風一變使我宋之文章將踰唐漢而躡三代者公之功為最多初朝廷之將用攻策也命葛懷敏出鄜延道勒兵綏宥間攻賊積聚招懷種族奪其要害而堡障之賊知朝廷之威必翻然來服則久而易制公曰是行也不患將卒無勇患應敵寡謀耳乃自請參議懷敏行營軍事有詔如請而事中罷今夫文武之士平居議論慷慨自謂忠義勇決世無及者一旦遇急難而試之往往魄喪氣奪百計避脫雖以富貴誘之猶掉臂而不顧余居邉久閲人多矣如公挺然忘身以為國家者天下不知有幾人嗚呼以公文武之才犖犖然震暴天下之如是曾不得一紓所蘊於公卿之位輔致太平之業而反遭罹讒毁遂終貶官此當世守道之士所以仰天歎呼疑為善而得禍而中人者引以為監思擇利而自安也然上以聰明仁恕御天下一細民之枉必矜而獲辨如公以文致其罪未有抑而不申者也故當時指以黨而排去者不四三年間皆復顯官處大任使公年且及此其進擢可量哉奈何乎天不與公之壽也悲夫公纍遷官至起居舍人直龍圖閣娶張氏鹿邑縣君以順以慈克正家道後公七年而亡兄源太常博士亦以文行稱于世弟湘三班奉職沖秀州華亭縣主簿濤泳未仕並先公而卒沂資性淳茂動謹門法子男四人長曰朴奇雋博學有父風其二未名俱早世其幼曰高宗廟諱今方十歲女五人長適虞部員外郎張景憲次繼適張氏次適太常寺太祝謝景平次二人未嫁姪材文學器識足以嗣公而敦尚名節無仕進意至和元年十二月日沂材舉公夫人之喪葬于緱氏縣某鄉之某原從吉卜也范公嘗以書謂余曰世之知師魯者莫如公余已為其集序矣墓有表請公文以信後世余應之曰余實知師魯者又得其進斥本末為最詳其敢以辭既實書其事矣又考性命之說而表于墓曰嗚呼自古聖賢必推性命如公之文武傑立而貫以忠義兮此天之性位不大顯遭讒而跌且不壽兮此天之命雖孔孟不能以兼適兮尚一歸于默定昧者不思而妄求兮徒自奔於邪徑故公臨禍福生死而曾不少變兮是能安性命而歸正唯大名赫然日月之光兮亘萬古而增瑩吾聞善人者天必報其後兮宜嗣人之蒙慶論尹師魯墓志歐陽修志言天下之人識與不識皆知師魯文學議論材能則文學之長議論之高材能之美不言可知又恐太略故條析其事再述于後述其文則曰簡而有法此一句在孔子六經惟春秋可當之其他經非孔子自作文章故雖有法而不簡也修於師魯之文不薄矣而世之無識者不考文之輕重但責言之多少云師魯文章不合秪著一句道了既述其文則又述其學曰通知古今此語若必求其可當者惟孔孟也既述其學則又述其論議云是是非非務䀆其道理不苟止而妄隨亦非孟子不可當此語既述其論議則又述其材能僃言師魯歷貶自兵興便在陜西尤深知西事未及施為而元昊臣師魯得罪使天下之人䀆知師魯材能此三者皆君子之極美然在師魯猶為末事其大節乃篤於仁義窮達禍福不愧古人其事不可遍舉故舉其要者一兩事以取信如上書論范公而自請同貶臨死而語不及私則平生忠義可知也其臨窮達禍福不愧古人又可知也既己具言其文其學其論議其材能其忠義遂又言其為仇人挾情論告以貶死又言其死後妻子困窮之狀欲使後世知有如此人以如此事廢死至於妻子如此困窮所以深痛死者而切責當世君子致斯人之及此也春秋之義痛之益至則其辭益深子般卒是也詩人之意責之愈切則其言愈緩君子偕老是也不必號天呌屈然後為師魯稱冤也故於其銘文但云藏之深固之密石可朽銘不滅意謂舉世無可告語但深藏牢埋此銘使其不朽則後世必有知師魯者其語愈緩其意愈切詩人之意也而世之無識者乃云銘文不合不講德不辨師魯以非罪蓋為前言其窮達禍福無愧古人則必不犯法況是讐人所告故不必區區曲辨也今止直言所坐自然知非罪矣添之無害故勉狥議者添之若作古文自師魯始則前有穆修鄭條輩及有大宋先達甚多不敢􅍘自師魯始也偶儷之文茍合于理未必為非故不是此而非彼也若謂近年古文自師魯始則范公祭文已言之矣可以互見不必重出也皇甫湜韓文公墓志李翶行狀不必同亦互見之也志云師魯喜論兵論兵儒者末事言喜無害喜非嬉戲之戲喜者好也君子固有所好矣孔子言回也好學豈是薄顏回乎後生小子未經師友苟恣所見豈足聽哉修見韓退之與孟郊聯句便似孟郊詩與樊宗師作志便似樊文慕其如此故師魯之志用意特深而語簡蓋為師魯文簡而意深又思平生作文惟師魯一見展卷疾讀五行俱下便曉人深處因謂死者有知必受此文所以慰吾亡友爾豈恤小子輩哉乞與尹構一官狀歐陽修右臣等伏見故起居舍人直龍圖閣尹洙文學議論為當世所稱忠義剛正有古人之節初蒙朝廷擢在館閣而能不畏權臣力排衆黨以論范仲淹事遂坐貶黜其後元昊僣叛用兵一方當國家有西顧之憂思得材謀之臣以濟多事而洙自初出師至於元昊納欵始終常在兵間比一時之人最為宣力而羣邪醜正誣搆百端卒陷􅖄辜流竄以死嚮蒙陛下仁聖恩憐哀其冤枉特賜清雪俾復官資足以感動羣心勸勵忠義今洙孤幼並在西京家道屢空衣食不給洙止一男構年方十餘歲惸然無依實可嗟惻伏見將來祫享大禮在近羣臣皆得奏蔭子孫伏望聖慈録洙遺忠憫洙不幸特賜其子一官庶霑寸祿以免饑寒則天地之仁幽顯蒙德臣等忝列侍從愧無獻納苟有所見不敢不言謹具狀奏聞伏候敕旨河南集附録本傳尹洙字師魯河南人少與兄源俱以儒學知名舉進士調正平縣主簿歷河南府戶曹參軍安國軍節度推官知光澤縣舉書判拔萃改山南東道節度掌書記知伊楊縣有能名用大臣薦召試為館閣校勘遷太子中允會范仲淹貶敕榜朝堂戒百官為朋黨洙上奏曰仲淹忠亮有素臣與之義兼師友則是仲淹之黨也今仲淹以朋黨被罪臣不可茍􅊵宰相怒落校勘復為掌書記監唐州酒稅西北久安洙作敘燕息戍二篇以為武僃不可弛敘燕曰戰國世燕最弱二漢叛臣持燕挾虜蔑能自固以公孫伯圭之強卒制於袁氏獨慕容垂乘石虎亂乃並趙雖勝敗異術大槩論其強弱燕不能加趙趙魏一則燕固不敵唐三盜連衡百餘年虜未嘗越燕侵趙魏是燕獨能支虜也自燕入於契丹勢日熾大顯德世雖復三關尚未䀆燕南地國初始與并合勢益張然止命偏師僃禦王師伐蜀伐吳泰然不以兩河為顧是趙魏足以制之明矣并冦既平悉天下鋭專力契丹不能攘尺寸地頃嘗以百萬衆駐趙魏訖敵退莫敢抗世多咎其不戰然我衆負城有內顧心戰不必勝不勝則事亟矣故不戰未嘗咎也原其弊在兵不分設兵為三壁于爭地掎角以疑其勢設覆以待其進邉壘素固驅民以守之俾其兵頓堅城之下乘聞夾擊無不勝矣蓋兵不分有六弊使敵蓄勇以待戰無他枝梧一也我衆則士怠二也前世善將兵者必問幾何今以中才䀆主之三也大衆儻北彼遂長驅無復顧忌四也重兵一屬根本虛弱纎人易以干說五也雖委大柄不無疑二復命貴臣監督進退皆由中御失於應變六也兵分則䀆易其弊是有六利也勝敗兵家常勢悉內以擊外失則舉所有以棄之符堅淝水哥舒翰潼關是也是則制敵在謀不在衆以趙魏燕南益以山西民足以守兵足以戰分而帥之將得專制就使偏師挫衄他衆尚奮詎能繫國安危哉故師覆于外而本根不搖者善敗也昔者六國各有地千里師敗於秦散而復振幾百戰猶未及其都守國之固也陳勝項梁舉關東之衆朝敗而夕滅新造之勢也以天下之廣謀其國不若千里之固而襲新造之勢徼幸於一戰庸非惑哉兵既久弭士大夫誦習謂百世不復用非甚妄者不談然兵果廢則已儻後世復用之鑒此少以悟世主故迹其勝敗云息戍曰國家割棄朔方西師不出三十年而亭徼千里環重兵以戍之雖種落屢擾即時輯定然屯戍之費亦已甚矣西戎為冦遠自周世西漢先零東漢燒當晉氐羌唐秃髮歷朝侵軼為國劇患興師定律皆有成功而勞弊中國東漢尤甚費用常以億計孝安世羌叛十四年用二百四十億永和未復經七年用八十餘億及假紀明用裁五十四億而剪滅殆䀆今西北涇原邠寧秦鳳鄜延四帥戍卒十餘萬一卒歲給無慮二萬騎卒與穴卒較其中者總廩給之數恩賞不在焉以十萬較之歲用二十億自靈武罷兵計費六百餘億方前世數倍矣平世屯戍且猶若是後雖有他警不可一日輟去是十萬衆有增而無損期也國家厚利募人入粟傾四方之貨然無水漕之運所挽致亦不過被邊數郡爾歲不常登廩有常給頃年亦嘗稍匱矣儻其乘我薦饑我必濟師饋餉當出於關中則未戰而西垂已困可不慮哉按唐府兵上府千二百人中府千人下府八百人為今之計莫若籍丁民為兵擬唐置府頗損其數又今邉鄙雖有鄉兵之制然止極塞數郡民籍寡少不足僃敵料京兆西北數郡上戶可十餘萬中家半之當得兵六七萬質其賦無他易賦以帛名者不易以五穀畜馬者又蠲其雜徭民幸於庇宗樂然􅊢籍農隙講事登材武者為什長隊正盛秋旬閲當若寇至以關內河東徑兵傳之䀆罷京師禁旅愼簡守帥分其統專其任分統則兵不重專任則將益勵堅其守衛習其形勢積粟多教士鋭使虜衆無隙可窺不戰而懾兵志所謂無恃其不來恃吾有以待之其廟勝之策乎又為述亨審􅍘原刑敦學矯察考績廣課凡雜議共九篇上之趙元昊反大將葛懷敏辟為經略判官洙雖用懷敏辟尤為韓琦所深知頃之劉平右元孫戰敗朝廷以夏竦為經略安撫使范仲淹韓琦副之復以洙為判官洙數上疏論兵請便殿召􅍟二府大臣議邉事及講求開寶以前用兵故實特出睿􅍘以重邉計又請減併栅壘召募土兵省騎軍增步卒又上鬻爵令時詔問攻守之計竦具二策令琦與洙詣闕奏之帝取攻策以洙為集賢校理洙遂趨延州謀出兵而仲淹持不可還至慶州會任福敗于好水川因發慶州部將劉政鋭卒數千趨鎮戎軍赴救未至賊引去夏竦奏洙擅發兵降通判濠州當時言者謂福之敗由參軍耿傳督戰太急後得傳書乃戒福使持重母輕進洙以傳文吏無軍責而死乎行陳又為時所誣遂作憫忠辨誣二篇未幾韓琦知秦州辟洙通判州事加直集賢院上奏曰漢文帝盛德之主賈誼論當時事勢猶云可為慟哭孝武帝外制四夷以彊主威徐樂嚴安尚以陳勝亡秦六卿篡晉為戒二帝不以危亂滅亡為諱故子孫保有天下者十餘世秦二世時關東盜起或以反者聞二世怒下吏或曰逐捕今䀆不足憂乃悅隋煬帝時四方兵起左右近臣皆隱賊數不以實聞或言賊多者輒被詰二帝以危亂滅亡為諱故秦隋宗社數年為丘墟陛下視今日天下之治孰與漢文威制四夷孰與漢武國家基本仁德陛下慈孝􅋢民誠萬萬於秦隋矣至於西有不臣之虜北有彊大之鄰非特閭巷盜賊之勢也自西夏叛命四年㫄塞苦數擾內地疲遠輸兵久于外而休息無期卒有乘弊而起兵法所謂雖有智者不能善其後當此之時陛下宜夙夜憂懼所以慮事變而塞禍源也陛下延訪邉事容納直言前世人主勤勞寬大未有能遠過者然未聞以宗廟為憂危亡為懼此賤臣所以感憤於邑而不已也何者今命令數更恩寵過濫賜與不節此三者戒之慎之在陛下所行爾非有難動之勢也而因循不革弊壞日甚臣謂陛下不以宗廟為憂危亡為懼者以此夫命令者人主所以取信於下也異時民間朝廷降一命令皆竦視之今則不然相與竊語以為不久當更既而信然此命令日輕於下也命令輕則朝廷不尊矣又聞羣臣有獻忠謀者陛下始甚聽之後復一人沮之則意移矣忠言者以信之不能終頗自詘其謀以為無益此命令數更之弊也夫爵賞陛下所持之柄也近時外戚內臣以及士人或因緣以求恩澤從中而下謂之內降臣聞唐氏政衰或母后專制或妃主擅朝樹恩私黨名為斜封今陛下威柄自出外戚內臣賢而才者當與大臣公議而進之何必襲斜封之弊哉且使大臣從之則壞陛下綱紀不從則沮陛下德音壞綱紀忠臣所不忍為沮德音則威柄輕於上且䀆公不阿朝廷所以責大臣今乃自以私昵撓之而欲責大臣之不私難矣此恩寵過濫之弊也夫賜豫者國家所以勸功也比年以來嬪御及伶官太醫之屬賜豫過厚民間傳言內帑金帛皆祖宗纍朝積聚陛下用之不甚􅋢惜今之所存無幾疏遠之人誠不能知內府豐匱之數但見取於民者日煩即知畜於公帑者不厚臣亦知國家自西方宿兵用度寖廣帑藏之積未必悉為賜豫所費然下民不可家至而戶曉獨見陛下行事感動爾往歲聞邉將王圭以力戰賜金則無不悅服或見優人所得過厚則往往憤歎人情不可不察此賜豫不節之弊也臣所論三事皆人人所共知近臣從諛而不言以至今日方今非獨四夷之為患朝政日弊而陛下不寤人心日危而陛下不知故臣願先正於內以正於外然後忠謀漸進綱紀漸舉國用漸足士心漸奮邉境之患庶乎息矣惟深察秦隋惡聞忠言所以亡遠法漢王不諱危亂所以存日親盛德與民更始則天下幸甚仁宗嘉納之改太常丞知涇州以右司諌知渭州兼領涇原路經略公事會鄭戩為陜西四路都總管遣劉滬董士廉城水洛以通秦渭援兵洙以為前此屢困于賊者正由城寨多而兵勢分也今又益城不可奏罷之時戩已解四路而奏滬等督役如故洙不平遣人再召滬不至命張忠往代之又不受於是諭狄青械滬士廉下吏戩論奏不已卒徙洙慶州而城水洛又徙晉州遷起居舍人直龍圖閣知潞州會士廉詣闕上書訟洙詔遣御史劉湜就鞫不得他罪而洙以部將孫用由軍校補邉自京師貸息錢到官亡以償洙惜其才可用恐以犯法罷去嘗假公使錢為償之又以為嘗自貸坐貶崇信軍節度副使天下莫不以為湜文致之也徙監均州酒稅感疾沿牒至南陽訪醫卒年四十七嘉祐中宰相韓琦為洙言乃追復故官及官其子構洙內剛外和博學有識度尤深於春秋自唐末歷五代文格卑弱至宋初柳開始為古文洙與穆修復振起之其為文簡而有法有集二十七卷自元昊不庭洙未嘗不在兵間故於西事尤練習其為兵制之說述戰守勝敗䀆當時利害又欲訓土兵代戍卒以減邉費為禦戎長久之策皆未及施為而元昊臣洙亦去而得罪矣雜見事跡先是渭州西路巡檢劉滬建榮川為秦渭兩路有急發兵相援路出隴坻之內回遠恐下及事請募熟戶於山外築水洛結公二城以兵戍之緩急以通援兵之路都部署鄭戩以狀聞命滬及董士廉董其役今韓琦宣撫陜西還奏罷四路招討以戩知永興軍又言兩城之旁多生戶今奪其地恐城工畢而寇至請罷之戩因極言二城之利不可輒罷詔三司副使魚周詢往視其利害未至尹洙召滬士廉令還滬士廉以熟戶既集官物無所付請遂城之洙怒以二人違節制命部署狄青往斬之青械繫滬士廉于德順軍及周詢還是戩議乃徙洙慶州涑水記聞尹師魯謫官均州時范希文知鄧州師魯得疾即擅去官詣鄧州以後事屬希文希文日往視其疾一旦遣人招希文甚遽既至師魯曰洙今日必死矣人言將死者必見鬼神此不可信洙並無所見但覺氣息奄奄就䀆隱几坐與希文語久之謂希文曰公可出洙將逝希文出至㕔事已聞其家號哭希文竭力送其喪及妻孥歸洛陽涑水記聞知道者苟未脫然隨其所得淺深皆有效驗尹師魯自直龍圖閣謫官過梁下與一佛者談魯師自言靜以退為樂其人曰此猶有所係不若進退兩忘師魯頓若有所得自為文以記其說後移定州是時范文正公守南陽少日師魯忽手書與文正别仍囑以後事文正極訝之時方饌客掌書記朱炎在坐炎老人好佛學文正以師魯書示炎曰師魯遷謫失意遂至乖理殊可怪也宜往見之為致意開譬之無使成疾炎即詣尹而師魯已沐浴衣冠而坐見炎來道文正意而笑曰希文猶以生人見待洙死矣與炎談論頃時遂隱几而卒炎急使人馳報文正文正至哭之甚哀師魯忽舉頭曰早已與公别安用復來文正驚問所以師魯笑曰生死常理也希文豈不達此又問其後事尹曰此在公耳乃揖希文復逝俄頃又舉頭顧希文曰亦無鬼神亦無恐布言訖遂長往師魯所養至此可謂有力矣尚未能脫有無之見何也得非進退兩忘猶存於胸中與沈存中筆談本朝古文柳開仲塗穆修伯長首為之倡尹洙師魯次第繼其後歐陽文忠公蚤工偶儷之文及官河南始得師魯乃出韓退之文學之蓋公於師魯於文雖不同公為古文則居師魯後他如五代史公嘗與師魯約分撰其後師魯死無子今歐陽公五代史頒之學官盛行於世內果有師魯之文乎抑歐陽公自為之也歐陽公志師魯墓論其文曰簡而有法且謂人曰在孔子六經中唯春秋可當則歐陽公於師魯不薄矣崇寧間改修神宗正史歐陽公傳乃云同時有尹洙者亦為古文然洙才下不足以望修云蓋史官皆晚學小生不知前輩文章淵源自有次第聞見録天聖明道中錢文僖公自樞密留守西都謝立耳洙何恨於湜乎甫深伏其識量之翰又言尹洙自謂平生好善之心過於嫉惡之翰以謂信然南豐雜識韓魏公曰希文常勸以身安而後國家可保師魯以謂不然直謂臨國家事更不當顧身公雖重希文之說然性之所喜以師魯為愜爾魏公别録范文正公嘗為人作墓銘已封將發忽曰不可不使師魯見明日以示尹師魯曰希文名重一時後世所取信不可不愼也今謂轉運使為部刺史知州為太守誠為脫俗然今無其官後必疑之此正起俗儒爭論也希文撫己曰賴以示子不然吾幾失之范文正公作嶽陽樓記為世所貴尹師魯讀之曰此傳奇體也畢仲詢幕府燕聞録尹師魯謫官過大梁與一老衲語師魯曰以退靜為樂衲曰孰若退靜兩忘師魯頓若有所得及移鄧州時范文正守南陽師魯手書與文正别文正馳至則師魯已沐浴衣冠而坐少頃而化文正哭之甚哀師魯忽舉首曰已與公别安用復來文正驚問所以師魯笑曰死生常理也何文正不達此又問後事曰此在公耳乃揖希文復逝俄頃又舉手謂文正曰亦無鬼亦無恐怖言訖長逝沈存中曰師魯所飬至此可謂有力然尚未脫有無之見何也得非退靜兩忘尚存胸中乎獨無為子楊次公曰存中識藥矣然未識藥之忌也惠洪冷齊夜話一小說名默記內一條云尹師魯性髙而褊中洛中與歐梅諸公同游嵩山師魯曰游山須是帶得胡餅爐來方是游山諸公咸謂游山貴真率豈有此理諸公羣起而攻之師魯知前言之謬而不能勝諸公遂引手扼吭諸公爭救之乃免輝見前輩云一時失言有所不免若曰愧而扼吭無是理也著默記者亦不當書此周輝清波雜志校正尹師魯文集序崔銑昔者夫子立教洙泗之間牗天下之英賢道一而己成列四科豈有所差别而然歟蓋皆不失其本心而己心者仁是也仁者天德是也是故蘊之不私己擴之則普物即事以體道也澤人以立我也修文以限止也不然流於朴且靡術而諼曾是以為道乎銑考藝於宋得尹師魯之文所尚節義所長論兵明出事先任而無黨遭構不怒處終而精故詞簡而切旨不襲故言不躐其所不能其亦孔氏之政乎當宋代談經作傳摛詞申政者奚啻百家然自三四儒之外許魯齊謂彌近理而大亂真從於程氏者尹彥明稱庶幾焉行一乎敬言純乎經道行乎富貴患難噫何尹氏之多賢歟讀尹河南文集金之俊余嘗讀歐陽氏志尹河南先生之墓曰師魯為文章簡而有法博學強記通知今古又自疏云簡而有法此一句在孔子六經惟春秋可當之其他經非孔子自作文章故雖有法而不簡也若是乎文之貴簡而能為簡者匪易言哉一日從北海孫公所得河南先生文集抄本受而卒業焉其文朴直緊嚴果有當于簡即碑銘書疏或詳至數千百言之多皆精于理核于事而無靡詞無溢氣雖詳而仍不害其為簡也原春秋之所以能簡者孔子上下二百四十二年之間凡天子列國君臣行事本末與夫內外盛衰治亂得失之故靡不條貫洞達故權衡審是非明一字褒貶義無不該然則非大哉博學之孔子不能為春秋之簡非博聞強記通知今古之師魯亦不能為師魯之簡非博極羣書集古千卷藏書萬卷之歐陽氏亦不能為歐陽氏之簡而能以簡而有法一句遂䀆師魯之為文也此簡之所以有足貴而能為簡者之匪易言歟考之韓忠獻云天聖初公獨與穆伯長矯時所尚力以古文為主范文正亦云師魯深于春秋辭約而理精得歐陽永叔從而振之天下之文一變而古尤延之亦云我朝古文之盛倡自師魯則又非獨歐陽氏之說也由是言之文之學為古者必能為簡而能為簡者方可以語古嗚呼今天下之為文而有志學古者其亦可以知所尚也已師魯為古文在歐公前前乎師魯者又有穆修鄭條柳開輩柳鄭余未及見其文穆參軍集則代州馮秋水方伯順治間刻于金陵文疏拙詩尤劣甚不知何以得大名也此集二十四卷詩一卷餘皆雜文蓋北宋人文章之厪傳于今者猶見其全如此集者是可寶也惜寫字多魚豕之謬安得别本讐􅍟之姑挍正其可知者餘則闕疑不敢妄有竄改康熙十九年庚申九月新城王士禛書湘山野録錢思公鎮洛創一驛館命僚屬各作一文謝希深與歐公皆五百許字惟師魯止三百八十字語簡事僃歐公愧服今考集中不載此記豈闕佚已多邪辛酉夏六月阮亭又識於國子監東廂宋宗室希辨續眺氏讀書志云志稱尹師魯集二十卷希辨所藏二十七卷洙傳中所載亦同嘗考邵氏聞見録云錢惟演守西都起雙桂樓建臨園驛命永叔師魯作記永叔文先成凡千餘言師魯曰某止用五百字文成永叔服其簡古自此始學為古文二記皆不載于集中今此集二十七卷與趙氏志同二十六七兩卷則五代春秋而附録一卷則本傳及韓忠獻所撰墓表祭文歐文忠公墓志及論尹師魯墓志乞與其子構一官狀並雜見事跡七八條阮亭壬戌冬初再記
