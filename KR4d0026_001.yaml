front:
  text: 河南先生文集卷之一
  hash: sha256:e3f131f170b448f8915fd650dedbe13f31daf047c0fa1ce089d6632c17b5c562
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_001-1a}
body:
  text: 皇雅十篇天監西師耆武憲古大鹵帝籍庶工帝制皇治太平律詩七首贈三鄕浮圖智聰一首和人過韓柱國廟一首過興平哭耿諌議喪呈經略副使韓密學一首舟次壽州寄濠州江少卿一首和河東都轉運施待制二首隨州聞劉易入終南山一首皇雅十首天監受命也自梁至于周兵難不息宋受命統一萬方焉天監下民亂靡有定甚武且仁祚厥真聖仁實懷徠武以執競匪虔匪劉拯我大命自昔外禪月經日營令以挾制政以隂傾帝初治兵志勤于征奄受神器匪謀而成淮潞弗虔卒汙叛迹戎輅戒嚴皇威有赫彼宼詿民吾勇其百殄厥渠魁貸其反側帝朝法宫左右宗公忮夫悍士以雍以容爾居爾室爾工爾農既息既養惟天子功天監四章章八句西師征蜀也主用西師岷梁弗賓匪曰負固實交晉人予訓予誓合我將臣正厥有罪無庸傷民矯矯虎士載摧其壁于嗟孟侯亦果其䇿迎師而降靡抗鋒鏑豈獨身謀完是宗國蜀都既平將臣失律此衆悍驕彼民危慄當塗呌呶合萬爲一匪懐則威帝心是恤帝曰將臣予嘉乃庸廢命毒民爾弗有終邦典用疑惟罪惟功靡殛而削協于厥中帝曰孟侯受封于楚淑旂琱戈僃物異數俾爾族姻及乃文武服在王庭靡不有序蜀民呼歌天子威靈保我者封暴我者刑匪功是私匪弱是陵天子惠民疇敢不承西師六章章八句耆武受俘也命將伐南海平金陵俘二王以獻耆定武功時惟二方淮服其義海南遂荒孰孱而盭孰暴而猖自底不譓乃終滅亾帝戒二俘同即爾誅予惟民無辜休息是圖時其輯矣寧威獨夫帝嗟汙邦久罹于兵或暴下以征或敷虐以刑予命中典協于國經民服德音室家以寧耆武三章二章八句一章六句憲古令守臣也削其附庸以強帝室焉帝懷永圖治古是憲四方守臣惟屏惟翰在昔艱難弗惠訓典跨都連城髙牙以建有土有民肆乃征繕以息以容終焉叛換凡今帥臣杻厥聞見匪革亂原曷清多難帝告庶邦式是典彝元侯顯父戚臣宗支正乃封圻予一人是毗凡曰附城罔爾俾之畜兵厚賦靡爾得私毋㐫而國作福作威天子有命疇敢不祗子孫承承唯萬世規憲古二章章十六句大鹵王師討晉罪也冀州之疆粤惟大鹵俗忮而專地扼而固恊比幽都蕩揺邉圉三垂既夷兇威弗沮帝御六師百萬貔虎剪其附庸至于城下鋒鏑始交梯衝如舞蠢爾孱王請附降虜我士奮揚願究吾武皇帝曰吁念彼黎庶匪鯨匪鯢復爲王士晉郊既平九區以寧陳功太廟告假威靈在昔武王于商觀兵維我藝祖亦勤于征匪貸晉罪俟厥貫盈聖作聖繼巍巍相承皇矣二后功莫與京大鹵二章一章二十二句一章十四句帝籍修故典也躳耕以劭農焉帝籍于郊典儀具陳務農以訓供祀以勤祀在于誠匪勤于人訓農以實匪訓以文帝謹二物乃躳乃親公侯卿士暨厥庶民千甸有制飭哉惟寅帝賚髙年式宴且喜種種黄髪族立而議我生艱難暴亂以繼耳狃金鼔目狎戎器皇其我圖親講農事有子有孫力田孝悌鼔舞至仁薫焉如醉帝籍二章章十四句庶工任賢也帝咨庶工疇其輔予俊乂以登厥勞乃圖匪忘舊勲非賢勿兪巍巍衮台盛德以居任賢伊何昌言是庸勉告爾猷罔恤廼躳豈無辭怫于予衷子不爾疪爾無囬從始時從官容揚揚今帝左右儒冠煌煌朝廷以尊文物典章得人之盛奕世重光庶工三章章八句帝制北方請盟也帝制萬邦㒺有弗賓蠻夷戎狄羈而勿臣威格三方稽顙獻珍單于革心願交使人帝謀公卿列侯庶校咸曰彼心暴戾隂狡既擾我疆復利吾寳無若勵兵襲其還道皇曰有衆予實念兹戰無必勝矧其歸師借曰大獲疇能䀆之益俾餘醜毒吾朔陲乃兪其盟北州以綏在漢世宗抗威北戎暴農筭商經用弗充中土震騷漢南始空降及後世猶稱厥功初穆聖考德無與偕匪勤于兵北人遂來逮是三紀遠俗以懷生民休息嗚呼仁哉帝制五章四章八句一章十句皇治恤刑也帝仁于用刑在位者以寛恤爲治焉皇底其治欽哉惟刑在疑而宥㒺察爲明愛怒弗肆孰爲重輕毋一弗辜惟典之平前世理官倚法以刻匪彼爲仇葢曰任職令之蔽獄務正其辟鑒于前人繄我仁德皇德在仁寖而成風公侯卿士靡不率從麛卯萌生咸保厥終不鄙不天樂哉融融皇治三章章八句太平封祀告成功也噫太平無象兮世烏得而知維盛德可迹兮其封祀之儀東岱宗兮西汾脽禮上帝兮賓地祗皇有征兮吾民以嬉皇有祈兮吾民是私天敷佑兮俾皇之釐永世億寧兮無疆之基太平一章章八句律詩贈三鄉浮圖智聽一首伊昔相逢日于今二十年師隨安樂住我豈利名牽自笑真徒爾何如養浩然西門女几路未得賦歸田和人過韓柱國廟一首隋氏一宇内三將皆勇夫賀公活以累楊素死有誅賢哉韓柱國身與功名俱廟食垂後世祀典誠有諸荒忽臨終言遂此惑庸愚過興平哭耿傳諌議喪呈經略韓密學去年使斾西征日一見稱君胆氣豪始信推心待國士能令視死如鴻毛從來拔筆輕文吏自此横尸貴爾曹槐里今朝逢輤旐依然舊館一長號舟次壽州寄濠州江鈞少卿雨漲灘頭沙已空一㠶西上快清風誰知去郡遲遲意猶逐淮波日夜東和河東施待制二首已成沈約難并恨且奉陶公有限盃感事傷春多少意星星漸入鬂中來又一首千里觀風使節來百城舒惨繫行臺威嚴少霽猶知幸誰信芳罇鎮日開隨州聞劉易入終南山神驥渴死追無蹤离婁眩目迷虛空九衢懽㳺尚故處一日忽在終南峯附勢趨權徒擾擾生歌死哭何悤悤人間萬事既能了莫教聲譽過關東河南先生文集卷之一
