front:
  text: 河南先生文集巻之二
  hash: sha256:a83cd097de9a37f71e77d9786d8a62cbeaa81307b3256d62e859646484c45ab9
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_002-1a}
body:
  text: 雜擬九篇敘燕息戍述享審􅍘厚刑敦學矯察考績廣諌敘燕戰國世燕最弱二漢叛臣持燕挾虜蔑能自固以公孫伯珪之彊卒制於袁氏獨慕容乗石虎亂乃幷趙雖勝敗異術大槩論其彊弱燕不能加趙趙魏一則燕固不敵唐三盜連衡百餘年虜未嘗越燕侵趙魏是燕獨能支虜也自燕覆於虜虜日熾大顯德世雖復三關尚未䀆燕南地國初虜與幷合勢益張然止命偏師僃禦師伐蜀伐呉泰然不以兩河爲顧是趙魏足以制虜明矣幷宼既平悉天下鋭專力於虜不能攘尺寸地頃嘗以百萬衆駐趙魏訖敵退莫敢抗世多咎其不戰然我衆負城有内顧心戰不必勝不勝則事亟矣故不戰未當咎也原其弊在兵不分設兵爲三壁于爭地掎角以疑其兵頓堅城之下乘閒夾擊無不勝矣葢兵不分有六弊使敵畜勇以待戰無他支梧一也我衆則士怠二也前世善將兵者必問幾何今以中才䀆主之三也大衆儻北彼遂驅無復顧忌四也重兵一屬根本虛弱纎人易以干説五也雖委大柄不無疑貳復命貴臣監督進皆由中御失於應變六也兵分則䀆易其弊是有六利也勝敗兵家常勢悉内以擊外失則舉所有以弃之符堅淝水哥舒翰潼關是也是則制敵在謀不在衆以趙魏燕南益以山西民足以守兵足以戰分而帥之將得專制就使偏師挫衂它衆尚奮詎能繫國安危哉故師覆于外而本根不搖者善敗也昔者六國有地千里師敗於秦散而復振幾百戰猶未及其都守國之固也陳勝項梁舉闗東之衆朝敗而夕滅新造之勢也以天下之廣謀其國不若千里之固而襲新造之勢徼幸於一戰庸非惑哉兵久弭士大夫誦聖謂百世不復用非甚妄者不談然兵果廢則己儻後世復用之鑒此少以悟世主故迹其勝敗云息戍國家割棄朔方西師不出三十年而亭徼千里環重兵以戍之雖種落屢擾即時輯定然屯戍費亦已甚矣西戎爲寇遠自周世西漢先零東漢燒當晉氐羌唐秃髪歷朝侵軼爲國劇患興師定律皆有成功而勞弊中國東漢尤甚費用常以億計孝安世羌叛十四年用二百四十億永和末復經七年用八十餘億及叚紀明用裁五十四億而剪滅殆䀆今西北涇原邠寧秦鳳鄜延四帥戍卒十餘萬一卒歲給無慮二萬平騎卒與穴卒較其中者總廩給之數恩賞不在焉以十萬較之歲用二十億自靈武罷兵計費六百餘億方前世數倍矣平世屯戍且猶若是後雖無它警不可一日輟去是十萬衆有益而無損明也國家厚利募商入粟傾四方之貨然無水漕之運所輓致亦不過被邉數郡爾歲不常登廩有常給頃年亦嘗稍匱矣儻其乘我薦饑我必濟師饋饟當出於關中則未戰而西夏已困可不慮哉按唐府兵上府千二百人中府千人下府八百人爲今之計莫若籍丁民爲兵擬唐置府頗損其數又今邉鄙雖有鄕兵之制然止極塞數郡民籍寡少不足僃敵料京兆西北數郡上户可十餘萬中家半之當得兵六七萬質其賦無它易賦以泉石者不易以五穀畜馬者又蠲其雜傜民幸於庇宗樂然隷籍農隙講事登材武者爲什長隊正盛秋旬閲常若寇至以關内河東勁兵傅之䀆罷京師禁旅慎簡守帥分其綂專其任分綂則柄不重專任則將益勵堅於守僃習其形勢積粟多教士鋭使虜衆無隙可窺不戰而習兵志所謂無恃其不來恃吾有以待之其廟勝之䇿乎述享宗廟世數先儒論之甚詳歷朝頗以七世爲允此不復議然郡國建廟及陵寢之制可得槩舉自漢世郡國始立祖宗廟及從叔孫議增建原廟則京師祖廟有二若夫陵寢之制則因秦代而寖廣之望二十四氣三㐲社臘上飰後漢以正月車駕上古不墓祭秦王起寢墓側漢因之諸陵寢皆以晦元㑹儀原陵如獨顯宗遺制無起廡㞐故張輔稱之曰顯節陵掃地露祭欲率天下以儉也立祭殿黄初三魏武髙陵依漢之志自是園邑寢殿通絶年詔罷之以從先帝儉德唐氏陵寢頗循漢制徽永望上食昭陵依獻故事二年制獻陵三年之後朔唯景龍世特豊昵廟龍景獻二陵毎日一祭御史進正觀戍春秋仲月遣使二年博士以諸陵日祭非古詔乾陵朝晡追奠昭居敕乾陵冬至寒食遣外使忌日遣内使諸陵外巡陵武后朝每四季月幷誕辰忌日遣使諸陵起式正觀至於西都行幸並建太室四時俱享自後議中宗后兩京宗廟官攝二曰建廟主而不祭皇輿時巡則就亨三曰者紛焉大寺有二一曰必有其廟時享之日以佗京師羣廟之主以徃以不決而罷存廟瘞主駕或東幸則飾舉軍奉今舉漢唐之典迹其制度大率主於隆而不主於殺也豈非篤孝思之意廣親親之恩乎然觀夫先王之致孝也極乎配天盛乎禘祫致精明之德躳祼獻之禮重之慎之䀆夫至誠而已若乃盛日祭於園寢委時享於下國雖美物僃致而至誠不篤與夫周頌所稱不其異哉審􅍘漢史書元帝優游不􅍘爲衰世之戒夫擥御臣之柄以強主威孰不由􅍘哉然􅍘者或審之以昌或任之以亾周公忍親親之誅尼父行僞辯之戮漢祖從輓輅之説審于已者聖審于人者明也商辛酷忠良之刑桓靈極黨錮之獄任于已者暴任於人者昏也是故天下惑之我行之審于已也我惑之正人莊士言而從之審于人也天下賢之我戮之任于已也我惑之嬖幸近習言而聽之任于人也與其􅍘而不審不若優㳺之愈也嗚呼聖或所不能暴或所不爲若昏與明後卋其鑒哉原刑刑罰世輕世重其來尚矣降三代稱治莫盛有唐唐之憲令大較施于今不甚異而正觀中天下􅍘死刑止數十其治主矣死刑二十九人正觀四年天下􅍘國家兩河罷兵三十年民力不罷仍歲豊稔而􅍘重辟歲過二千百二千四百下乃二千二百天聖元年至三年或二千七聖君慈仁未嘗以威怒肆一不辜其請傳死者率用恩貸昔帝元以尚此然􅍘獄煩簡何具遼哉夫今之罪麗于死者貧十居九非貧不忌法葢其自愛不篤也夫南畆之民儲一歳之僃者十鮮一二其次㩁錢富室出倍稱之息其次質産入租交爲人傭下乃轉徙他郡壯者隷兵弱者匃食不幸爲盜賊竆矣今歲殺盜千數而爲盜者十不一死是天下盜常數萬也遠爲徐樂憂天下之患可爲㴱戒至若山澤之利古未㩁者復䀆錮之矣故民輕於犯禁狃於變詐勢使然也國家䀆地方籠物貨非以自奉顧用度廣爾今天下有承平之名而不免兵興之費雖欲輕斂㢮禁亦未免也彼正觀世西夷非素弱也警急非無僃也文物制度非暫削也何德而及此亦御之有術而已今欲師正觀之省刑莫若究其源其源在謹兵藉制經用而已夫兵食不浮國用不穴然後賦斂可輕山澤可㢮人人自􅋢而重犯法也如不究其源雖日下欽恤之詔察大小之獄欲犯法者不冤則庶矣期于刑省不其難哉敦學今大學生徒博士授經發明章句究極義訓亦志于祿仕而已及其與郡國所貢士並校其術顧所得經義訖不一施反不若閭里誦習者則師道之不行宐矣若俾隷業大學者異其科試唯以明經爲上第則承學之士孰不從于師氏哉議者欲郡設學校誠甚髙論然天下業經以萬數而傅師學者有不一二不澄其源雖置之無益也又卿大夫家階賞典得任者其年及程止校以章句爲中格急用補吏非志學者不能自勉故門選益衰世德罕嗣廢學故也周官設氏掌教國子葢公卿大夫子也今祭酒實其任謂由門調者宐籍于師氏策以經義始得補吏優其髙第朂其未至則學者益勸仕者能世其家矣矯察國朝規唐制設登聞四檢廣言事之路而憲防未著非以懲艾誣訕敦勵忠讜也若乃譏切人主建明時政固上之所欲聞也至于挾擿隱過牟斂細利寧有補于政哉夫黈纊非以蔽聰外屏非以蔽明葢任視聽不足䀆乎聰明也前世居國者或喜聞外事任察爲明有陳閭里之事者嘉其無隱以爲傾䀆至其垢汙忠賢害莫甚焉是以鈎黨之錮發于近習告密之獄起于廣聽緬鑒前事豈不根于㣲萌哉謂可申嚴著令凡人之隱慝非律所得言者罪之謀利有遣民者報罷則昌言日進而險詖徼幸者少儆矣考績國朝考績之制自三品以下悉自上功狀有可程殿最覆奏以陞退之所以甄年勞而重祿賞也夫以庸制祿天朝之典也難進易退人臣之常也故上推其賞下競于讓官唯其才衆無覬心然後廉恥興行風俗敦厚也今臣下自紀績效以干賞典是則衒鬻者被祿沈黙者稀遷奔競之風靡然成俗得不矯其弊哉按唐正觀故事門下置具員以次補庶官未嘗人人自薦以希進用也建中三年中書上言正觀故事常恭官外官五品以上每省除拜中書門下皆主簿書謂之具員取其年課以爲選授此國之大經也今諸刺史四考郎中侍御史各兩考餘官各三考與轉餘並維故事宐循其制申命有司自五品而下謹其官簿取歲月當遷者籍其治行于朝而命之有司失舉與自上功狀者鈞其罰庶乎爵賞之柄出于天朝貪冐之源少以懲艾豈非崇讓一端乎廣諌昔舜命禹曰毋若丹朱傲周公戒成王曰毋若啇王受又曰小人怨詈汝則皇自恭德是則君臣道隆辞達而已矣然禮有五諌聖人從諷者葢爲人臣言之也若爲人君言之雖聞怨詈亦將自儆不無益也或曰禹周公奚不諷曰申戒于未然雖激猶諷也陳事于已兆雖諷猶辨也大禹周公之爲臣也欲其君克終厥戒但後世不見其過舉德美充乎無竆與夫違而弼之異矣嗟乎後世以禹周公之道事君者庸非忠乎河南先生文集巻之二
