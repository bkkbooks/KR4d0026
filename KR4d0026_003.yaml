front:
  text: 河南先生文集卷之三
  hash: sha256:1da14bcc810c9500070e5579019e8c3f540b769afd679a3ee22e8ce1eb4c462e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_003-1a}
body:
  text: 雜文九篇河南府請解投贄南北正統論一首攻守策頭問耿傳一首憫忠辨誣兵制退說好惡解二篇河南府請解投贄南北正統論一首論曰天地有常位運曆有常數社稷有常主民人有常奉故夫王者位配於天地數協于運曆主其社稷庇其民人示天下無如之尊也無二其稱也故易曰大寶史曰神器苟社稷有主而僣其稱號則其名曰盜其位曰竊示萬民可得而誅後世可得而貶千古不易之道也自晉室不綱五胡猾夏元帝艱難否運奄有東南景命未融不失舊物迄於恭帝百有四年宋祖有代德而受外禪復六十年而禪齊齊二十六年而禪梁梁五十年為侯景所篡梁元帝攘戎狄而篡舊位遷都江陵三年為西魏所滅則東南之運絶矣始後魏道武以晉太元二十一年即位都代後六代孝文遷都雒陽後復六代孝武遭高歡之難遷都長安是為西魏西魏三代恭帝二年始平江陵江陵平一年禪于周周二十五年而禪于隋隋三十八年而禪于唐推而言之則東南承襲之運至江陵陷沒當傳于魏魏傳周周傳隋隋傳唐為得其實而江陵之陷陳霸先立梁元之子方智為帝復不能輔而代其位是為陳蕭察據一州之旅稱帝三世是為後梁魏孝武之西遷也高歡立清河王子善見為帝稱東魏既而高歡子洋篡其位是為北齊而前史列東魏後梁並篡為帝號北齊陳氏各有國書逆順不分稱謂紛揉若以蕭察為中興之主霸先是曰元凶霸先為受命之君隋氏當為叛國昔蜀先主以宗室之胄據有全蜀為魏所滅遂黜其帝吳孫權以三州之衆傳及四世為晉所得竟斥其名以義則蕭察未及漢中以地則霸先豈偕孫氏東魏之立不異于聖公盆子北齊之僣有同乎劉聰石勒但後梁東魏有國之後可正以王名陳氏北齊竊號之臣宜斥為叛寇或曰子以魏平江陵始為正統則道武而下亦不可以稱帝列紀邪北齊後周俱承魏禪豈獨帝周而虜齊耶豫曰不然夫魏武晉宣未享於皇極陳壽干寶各標其帝號彼為得理此復何嫌況魏氏孝文已來文物太盛三分天下有其二至于末世竟平江表在昔秦為列國太史公尚為立紀者蓋以其後世能成帝業也此則恭帝而上不猶愈于莊襄前耶但統而言之平定南土方為正統非謂道武而下不可稱帝列紀也且孝武避狄于秦安定公披草萊建宫室重延魏祚踰十二紀而受其禪魏傳其璽齊為其虜梁為其臣隋承其運非帝而何噫周之吳楚太伯鬻熊之後也怙恃其衆僣號稱王仲尼修春秋而夷狄之聖人之旨垂戒于方來所以亂臣賊子懼也惜哉唐太宗世修五代史蓋執筆史官多齊陳之人或其勳列之後是以各夸本國並列正史失之一時誤及千古至使亂臣賊子謂方面可據位號可竊為下莫得而誅後世莫得而貶不其惑哉不其惑哉攻守䇿頭問耿傳一首問西師之興幾一歲矣為守計則師無還期坐耗廩粟又邊稅所入不廣當有轉輸之勞若乘之以饑凶民困于內兵失於外非策之善也遠惟前世深入之利近鑒至道之役豈課今者不可參以古事將勝敗不繫于人耶然則攻與守必有一術焉為今計者當如何所論守之害與計勝之說然則若云折李族擊其前大將繼而乘之似未得宜何者二族壤土相遠雖俾俱進其戰地戰日不能預制是有俱進之名其實不合勢也彼若置一能旅之衆繼之深入獨與一旅之共鬪則衆寡相絶勝勢在彼矣彼既勝則深入者益孤吾之大軍復何乘哉古有攻其所必救者虜之以救何地耶所謂吐蕃回鶻者正合以夷狄攻夷狄義然今之唃厮頗得吐蕃故地猶見命於朝回鶻有君長通于京師此二國驟親之使其自為攻計恐不能得其深效徒市虜自利耳若循唐至德故事使天將傾之又虜且不從凡此皆當詳極其說憫忠甚哉世人謀其身之周也山外之戰川戰虜並在好水川姚家牧隆城俱不及五里隴山外屬平凉西去羊諸將以力戰死明白不可欺創趙律者去其首得諸將尸皆被重或者咎其失計且不與其死噫趨利以違節度其失計信然邊二月己丑至髙經略副使韓公行萬一千人早行曹部署任福䀆統諸將合力以制平邏報賊逼懷遠城公巳發鎮戎軍先募勇士總次之任福居後其夕宿三川賊已退懷遠東南去之于是都監桑懌為先鋒鈐幹宋觀繼之武英又賊戰于張家堡南斬首數百賊卒駝馬羊牛萬計翌日諸將由懷遠躡其後兩路巡檢常鼎劉肅與桑懌為軍屯好水川與賊接壘宋觀武英為一軍桑懌以騎趨之任福又分兵自將以往其夕任福㑹兵川上不使賊得逸去是時殿賊自將兵十餘屯籠落川隔山相去五里猶遣信相通期以明日四塞然數少是以兵益進萬衆營于川口遣青言賊秉義不屈奈何不與其死也牧隆城五里與賊大軍遇懌馳犯其鋒賊益癸已任福桑懌逐賊循好水川西去未至羊陳亦死福中數箭小校劉進勸福自免福曰吾為兵自辰至午軍潰懌與劉肅俱戰沒任福一子在韓公召渭川都監趙律將死事騎軍二千二百為大將軍敗何以苟生一死足以報國遂死之先是遇戰合行營都監王圭自羊牧陸城以屯共四千諸軍後繼是日及朱觀武英㑹兵于姚家川與賊武英重傷不能視軍自午至申賊兵大至東偏步五百來陳于朱觀陳西圭屢出略陳聞堅不可破四射㑹賊暮引去觀與任福戰處相去十五里然軍潰衆遂大奔王圭武英衆千餘人保民恆發矢將將既戰死郡以其夕收軍去故山外之民不甚至敗不相聞也始賊未與官軍遇大持武延川諸死者六千餘人指使軍校死者數千人被毒然諸將戰兵以千六百總二萬三百忠義世之所髙死人之所難以甚難之節負至髙之名苟與之則已當蹈之矣惡所以謀其身哉善謀其身者不然必非之曰喪兵沮威雖死吾弗與後然享其富保其生為無愧為身之謀豈不周乎寇仇在境師兵在行欲必生以保功難乎哉嗚呼喪兵沮威以取死豈諸將心耶亦不幸而已為國家言無使謀其身者終其幸死義者重不幸則節士勸矣辨誣山外之役參軍事耿傳在行福行營軍事是役也傳以通判慶州參任公諷之遂行傳本當後韓戰合虜騎益至或以傳文吏無軍責勸其避去傳不顧被數創死于陳勸傳避去傳不行營都監武英敗時外轄朱觀輩咸勸傳少避鋒鏑傳愈前指顧答英曰英當死君非三兵者奈何遂與英俱死未能言其詳自若觀及武英人或誣之曰傳督諸將進俟與大憝卒遇敗傳致也後得傳與諸將書戒以持重慮為虜誘此豈督諸將進邪作書與任福以其日小壬辰夕傳在朱觀中營致任福軍中任福敗孔目吏以書白韓公公即奏勝慮首與虜大軍相遇切戒之自寫若朱觀名以以示疑者爾上之以録謹言宋興八十載文吏死率者或以城守之責或不幸與禍㑹其死義一也至如臨大敵不懾與驍雄之士爭致其命如傳死者亦鮮悲夫謀既不用又從之死猶不免於誣為誣者豈喜于立異邪惡夫為忠邪作辨誣兵制今之戎狄地兼燕涼然彊大之勢未過乎前世中國士卒專力武事非若古者籍兵於民農戰兼用者也是中國兵勝於古夷狄不勝於古也古者中國鞭笞四夷而役屬者有之給繒帛以懷來者有之與之戰或勝或負者有之今厚賂以厭其求惟恐不及或與之較未嘗一勝焉其故何哉非夷狄之兵彊非中國之兵弱法制之失也何謂法制之失以吏事而制戎事也為今而言策之長在戰與守策之失在禦與校廢策之長用策之失所以亟敗也假以虜事言之若聞其將寇我境我之大將不計敵衆寡之勢不論戰遲速之利必分兵禦之禦之不勝制令者曰吾知出兵而已行者曰吾知奮命而已朝廷必薄其責議者亦置其罪苟不禦之雖全其師朝廷誅其逗留議者稱其畏懦此所以必禦之也若聞一城被圍不計受攻之急緩不論城壘之堅脆必䀆鋭救之救之不勝制令者曰吾知救之而已行者曰吾知死之而已朝廷必薄其責議者亦置其罪苟不救之雖城獲全朝廷咎其不進議者言其坐觀此所以必救之也禦與救非將之罪也以吏事制戎事法制之失也或曰禦亦戰也救亦戰也禦與救皆為失策何謂戰為長策也夫禦與救非利戰不得已而戰也非我利則敵之利也所謂戰者我利則戰不利則不戰先計而後戰者也先計而後戰鮮不勝矣不幸而不勝者將之罪也然則中國之為守􅍯久矣何得謂守為長策而廢不用也所謂守者方面之守非一堡一障之守也非尺寸之地守也今敵入吾地不計衆寡利害而禦之敵圍吾城不計堅脆急緩而救之禦之必敗救之必敗兵潰于外民潰于內失所以為守矣守方面者異于是使城自守母望救兵之出蓋兵不出則勢不分勢不分則有以待之夫待之者不戰則敵疑作戰則敵懼必戰則敵北能守所以辦戰能戰所以濟守明戰守之利而不得志於夷狄者未之有也退說豫家洛陽汝距洛為近凡過汝而館昭禪師居者三十年矣今年貶官漢東道汝復館焉因言禪師始見豫進于文已而益進以名遂以仕禪師視豫之為進久矣山林樂也盍退乎以休吾勤禪師曰退與進均有為也不若兩忘焉豫竦然愧其說之勝然豫之所謂退者豈以進為不偶退為髙邪直以不才于退適宜耳樂之不為過也既而自詆曰豫之不才于退適宜者非今日始自知也間天子命之治民又命之治兵不於是時自退今以罪黜乃曰樂退退之樂與否非所得而言也禪師之說旨哉於是作退說以自警好惡解二篇甚矣世人毁譽之亟也觀人之色辭則是非紛焉其色之莊也譽之則曰重而有守毁之則曰狠而自恃其色之和也譽之則曰易而兼容毁之則曰諂而求合其辭之直也譽之則曰慎而讓善毁之則曰險而伺迎其辭之博也譽之則曰通而適理毁之則曰夸而尚勝為是說者皆好惡之為也好惡發乎其人非性之所好惡也噫色與辭烏足以䀆其中邪吾將一之以恕觀其色不曰重則曰易而已聽其辭不曰慎則曰通而已與其失于譽不猶愈失于毁也若夫察其中也必考乎古聖人之道由之者貴之戾之者賤之貴者為君子賤者為小人貴賤者君子小人之分非吾所得而貴賤也何好惡之為􅏺或曰子之謂好惡發乎其人非其性之所好惡為譏者姖惑焉夫介者好拘通者好放晦者好默察者好辨反是則其所惡皆性之偏固者也乃若因其人可好則好之可惡則惡之不亦廣哉豫釋之曰吾疾夫世人毁譽之亟也視其外而不考其中摘其末而不究其原故舉色辭而言蓋淺之為好惡非其人有可好可惡之實也是以一之於恕而已則性之偏固者不猶貸哉果其可好惡豫固曰君子小人之分矣詩曰好是正直傳曰惡夫佞雖聖人不無好惡庸何疑哉或者復曰好惡發乎其人與性之所好惡奚以異邪人之性莫不有好惡者也其施于人同者好焉異者惡焉是好惡皆發于已何從而發于人邪豫應之曰吾友有􅋢直者其議論古今必以直為􅋢也然有所不喜者考其人慤士也豫質焉答曰惡其邪也是則惡者是而所惡者非也或者遂解河南先生文集卷之三
