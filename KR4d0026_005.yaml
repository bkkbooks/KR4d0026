front:
  text: 河南先生文集卷之五
  hash: sha256:e6be9fcd9f254beaa3504918fcf2182c8fb406a093a62cf1370a06d00b3f6373
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_005-1a}
body:
  text: 序十首郢州送路綸寺丞一首並詩送李侍禁一首送浮圖奉堅一首送王勝之贊善一首浮圖祕演詩集序送隨縣尉李康矦一首送浮圖迥光一首送光化縣尉連庠一首送供奉曹測一首送丘齋郎一首送路綸寺丞序渙之寺丞自郢中有南陽之行治舟之日郡守廣平公張宴白雪樓命賓屬以餞之酒數行為引商刻羽之曲坐客凄然有離索之嘆友人尹某因道古人送言之意將有以序其行夫古之送言必以已之所得規彼之未得今渙之才美而甚晦內方而外和惟晦與和某當師之方得渙之以自規其敢有獻于渙之哉獨離索之恨不能忘已既醉且泣以詩繼之感事并傷别平時淚滿巾今朝郢樓上更送北歸人又平生愛問江南事喜見人從江上來今日江頭送歸客葦花深處祖筵開送李侍禁序新秦楊叔武嘗為豫言其友人李君之為人篤行君子然樂于佛氏之説豫他日得見則以叔武之言説之君曰誠有是非取其所謂報施因果樂其博愛而已豫應之曰是仁之實也古有孟氏書為仁義之説君之樂冝近焉君于儒書為泛通自豫言于孟氏益加勤異日大詫曰孟氏説與吾素所向無大異遂主孟氏學豫又曰自孟而下千載能尊孟氏者唯唐韓文公君由是復通韓氏文且曰今而後知博乎愛者在行之冝耳與豫遊二年其言非孟即韓君之性真資于仁者歟始讀佛氏書以其愛之博也樂之及觀孟氏韓氏書推而廣之則有所至焉幸卒其志則聖人之道無不至者于其别敘其初以勉之送浮圖奉堅一首浮圖奉堅師訪豫出所述三昧儀求為之贊豫應之曰師為浮圖學能廣其所傳以導人欲贊其説當求之深其學者不然名公大人其能取信于世者豫蒙固未能了師之説且言不足為世重曷為求哉而師之請益堅觀師之心是不欲使一人不通其説者若是其固邪噫世之儒者有能自信其傳如師之固歟于其行作序以紀之送王勝之贊善一首天下久安衣冠子弟持身能自修謹或作辭章能僃科試者為其父母必目之曰令子弟為其朋友必推之曰良士為國家擇人必舉之曰美材於是上下交稱其賢賢者若是其已乎河南王勝之宰相子年二十五常日為文三千言三千言人多能之勝之之文其論經義頗斥遠傳解衆説直究聖人指歸大為建明使泥文據舊者不能排其言其策時事則貫穿古今深切著明于俗易通于時易行參較原覆其説無窮大抵贍而不流則而不窘詞厲而淳氣出而長蔡君謨常稱之曰歐陽永叔之流永叔君謨皆子之所長也君謨未嘗片言假人如是稱之信矣又俶儻宏達服仁畏義真魁傑人而不屑細故與時疏闊由是謗譽交至噫謗何為哉然前所謂持身能自修謹其文章足備科試者語其賢或未至求其謗固無有也使其人效勝之試且不能勝之兼取之如其所為何難乎太平聖朝方以文法治天下願無略豫言浮圖祕演詩集序浮圖號文惠師祕演者過我道歐陽永叔為其作詩序蘇子美貽之詩永叔悲演老且衰子美有惜哉不櫛被佛縳不爾烜赫為名卿之句豫識演二十年當初見時多與穆伯長遊伯長明峻人罕能與之合獨喜演演善詩復辨博好論天下事自謂浮圖其服而儒其心若當世有勢力者冠衣而振起之必犖犖取奇節今老且窮其為佛縳詎得已邪伯長小州參軍已死演老浮圖固其分演之再來京師不飲酒不與人劇談頗自持謹與世名浮圖者不甚異演之心豈與年俱衰乎永叔因石曼卿始以知演見其衰而聞其壯所為是以為之悲然演始健于詩老而愈壯不知年之衰于聞詩發于中寧相戾邪豈演老益更事且不預世故遂汨汨順流俗其外若衰其中挺然獨于詩乃發之邪演詩既多為人所重演亦不自􅋢之數客外方頗逸去録之凡三百餘篇云河南尹某序送隨縣尉李康矦一首自豫貶官有見顧者哀豫之窮惻然見於色辭其人未必相知特哀吾窮耳豫愧其意重其為人何哉見人之窮惻然而哀之是亦情發乎仁者也李君亦見我惠書幾千言皆張大仁義之説無一語哀豫之窮者豈以身之窮不足纍於心乎夫自處不卑者期人則深豫喜李君知我而嘉其自處之髙也重其别姑贈以言送浮圖回光一首豫聞廢放之臣病其身之窮乃趨浮圖氏之説齊其身之榮辱窮通然後能平其心吁其惑哉屈原賈生為放逐之辭皇皇焉切以深所不忘者君也彼豈以身之榮辱能纍其心邪先聖稱顔子簟食瓢飲人不堪其憂回也不改其樂蓋夫樂古聖人之道者未始有憂也尚何榮辱窮通之有乎豫謪隨之一月光師來相過持其師之説以警豫光師明達人也于其行敘吾説以為别送光化縣尉連癢一首自西師之興金帛糧糗之積凡資于兵者其費益廣鐵革幹羽之用凡須于兵者其取益夥費之廣則吏之聚斂者進焉取之夥則吏之幹力者進焉上任其能下收其功自監司所部及于郡縣由初仕至于久吏宿官莫不以是為吏之優為政之先于是吏之強者益肆弱者亦趨甚者不恤困窮不察有無殫利以夸精嚴期以名勤有以治體為言者必詆之曰方事之艱當求所以富國強兵之要烏體之為哉故吏益材而民益愁為吏者寧當然邪連君君子人也其仕五歲矣豫質其為吏之術大概本于仁而達下之情其于民也知利之興寬之而已職事無廢也期會無失也考千古之為吏者當以良稱而于今未得以材名也噫沿古未嘗無兵也國家仁育天下幾百年今一方兵興其資于民役于民者必視其貨力與之約束豈重擾哉而下之愁歎者吏為之也吏豈喜擾邪亦欲以材自名而利其進也是故奬材吏則士益偷貴良吏則民遂其生惟君子不可以利回故樂與連君盡其説送供奉曹測一首豫遷武當之一月曹君護淮陽戍兵來抵郡下一日見過盡出淮陽送行詩示豫且以詩為請豫自得罪不欲以文辭發聞于人雖朋遊素厚者未嘗先為書問非以自􅋢慮為朋遊纍也今始見君而遽相稱道懼流俗之善訿者並以毁君矣用是敢辭而君之請益堅噫流俗之毁譽固流俗之所惜也倜儻之士則不然毁也譽也必審於已而已奚流俗之為哉君生勳德之族少年志學而趨向如此其倜儻之士乎詩不能盡豫意作序以别送丘齋郎一首天子臨軒策賢良之法何為哉得非質今事考古誼使足施于世邪然未聞某事某所建也某事某所廢也豈朝廷不亟行其言徒試其才識而取異日用邪將為賢良者務高其説而不切于行邪收其異日之用則今登科者益用于朝為朝廷言主乎得人猶不係乎樹策之始行與否也如不切于所行務高其説以取重于名者殆非試策之本意丘君仲謀敏贍通古今其才識辨論于賢良無愧異日應咨問使為國者汲汲于所陳而易於亟行聞其􅍟者惟恐不大施于時兹有望于賢良也寶元二年上元夕洙謹序河南先生文集卷之五
