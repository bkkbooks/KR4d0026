front:
  text: 河南先生文集卷之六
  hash: sha256:f32c8e1537c03b026ca551f7e77860c1d887821d1e38557123396727ff3798df
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_006-1a}
body:
  text: 書七首上葉道卿舍人薦李之才書一首上陜倅尚屯田書一首荅黄祕丞書一首上京兆杜侍郎啟一首上吕相公書二首上陜西招討使夏宣徽小啟一首上葉道卿舍人薦李之才書某再拜八月初作書託鄭開封附去浙中後十有餘日聞有西掖之召中外企望爲日已久雖有此拜固未足爲賀也恭惟甫至都下尊體休勝某輒有私悃仰布左右惶恐惶恐孟州司法參軍李之才年三十九天聖八年同進士出身能爲古文章語直意邃不肆不窘固足蹈及前輩非某所敢品目其爲人敦朴真率不自矯厲安于卑位頗無仕進意故世人罕能知之京師諸君有石曼卿者與之㳺曼卿獨喜其不汲汲榮利與已合耳之才母老無餘貲曼卿嘗勸之隱去使其無所歸于知似未䀆也之才又逹世務使少用于世其才過人遠甚今幸其貧無資不能決其歸心知之者當共成之也近制吏部選人有保任者及五人得上其課之才未嘗干于人在上者或薦之今已四人十二月又當罷去念非明公無以成之者明公雖素未知其人然某被遇最㴱由知某而後知之可也之才在朝廷無近親若其持身謹廉常吏皆能之故略其言事遽詞激㒺避詆訶倘蒙畱意恭候還教不任懇切上陜倅尚書田書某再拜某幸與執事同年得進士第又常得請見左右雖未熟接語論䀆朋友之分然不爲無舊執事立言樹教以古聖賢爲師法某雖淺陋未能窺執事畛域然素有志于是亦得爲同道挾故舊契加之道同陜與洛相去不三百里而未嘗作書者非敢自疎誠以罪黜之迹懼他人見議以爲附同年之居高位者爲佞也近蒙復官爲令畿邑去陜益近自今或時拜書兼有近著文俟到縣中寫一通上呈今偶趙都曹見過云遽行謹奉手書少道萬一望恕簡率荅黄祕丞書某再拜春初得所惠書以賤事未克裁荅尋承有延安之行秋中始還道塗登頓良苦自西師之興議者交語以爲執事在邊帥幙府某獨謂近時上將猶不能專軍之命令幙府豈足容足下才邪近聞承詔當至都下一吐奇論䀆發胸中所藴使識者聞之知處置得失與軍之勝敗䀆係于人爛然無疑今不即用猶足警異時豈不壯哉願無辭此舉以慰朋執之望中間所稱河間民誠義烈士書中所錄自足傳信增之文辭非爲益也但當訪其名氏相見期不遠餘俟面敘上京兆杜侍郎啟嚮者伏聞京兆之拜知者皆見慶以爲必應辟署之選頃之人有見語者曰公奏一不從且再上矣既而皆然恭惟明公更中外劇任將二十年門下吏被器使者百千人一日當辟士章未上人皆以某必應其選某豈賢於百千人哉誠由明公見􅋢之㴱數數稱道布聞於人故及此耳屢草謝記輒復中罷懼益章明公見私之恩非所以承奨拔之意也今或聞兩奏皆寢始得修問左右區區之心豈敢忘於大府哉惟祈早􅈾柄用以允天下之望使縉紳衆品皆被甄淑不特門下舊吏曲蒙厚恩感激所㴱實罄於此上吕相公書月日朝奉郎守太子中允新差簽署涇原秦鳯兩路經略安撫判官公事騎都尉尹某再拜獻言僕射相國申公閣下某謬爲朝廷器使預參西方軍事向一至京師得以邉書陳於上前退又以所陳白於執事非以夸辯而求合冀事之亟行耳會閣下以舊德入輔某以既辭天子不當久畱都下區區之說獨未聞於左右今輒條次所陳之要以書自啟惶懼惶懼某以西夏用兵之害莫甚于大將兵少與法制不立此二事耳請先以大將兵少之害言之今涇州乃涇原大將治兵之所戰士才數千假使虜衆數萬來冦關壁則邑落誰撫出戰則鎮守孤危且衆寡不敵必召屬城之兵以爲自助之勢大將既已先擾外軍復無統一此必敗之理也大凡大將救屬城則易屬城救大將則難何以謂之易若虜刼冦吾境大將當以重兵守險或設伏要路或􅍘其首尾又號令諸城使之合勢以逸待勞此大將救屬城之易也何以謂之難虜入吾境大將既召屬城之兵以爲已援若兵在百里之内再日而至則吾之險阻已與虜共之矣若待數百里之外兵至則虜已据吾要害休其士衆待吾兵至逆而擊之援兵雖多其統不一此屬城救大將之難也雖戰守隨機大槩論屬城之兵主於守大將之兵主於戰唯能使之戰然後庇其屬城保其險固也今大將之兵與屬城均于自守俟虜至然後呼集屯戍迫以期會戰地戰日皆非案定此則自救不暇豈能決勝哉如某所計請增大將所治兵滿三萬騎五千屯戍不預其數可以戰可以禦可以守也或者引前世用兵之法能以寡擊衆者此非通論其所計者數千之敵數萬十倍之衆耳凡臨事機應變出奇雖百倍之衆尚有以制之然未有預以寡少之兵而必十倍之勝也夫三千之禦三萬與三萬之禦三十萬其勢甚易三十萬之衆未必一其力三萬之衆敵不能見其形不一其力故將多者難爲辦不見其形故善用者能張其勢如此則勝負未分也三千之禦三萬則異乎此合而陳之則見其弱形彼氣吞之一也多爲奇兵則懼于勢分二也離去城壁以据要險則慮其攻襲三也此三者雖善將者無如之何故云以寡擊衆未爲通論是大將之歩卒必以三萬騎必以五千然後可用也明詔減去城柵可益大將兵而未聞䀆奉行也某知京師某兵不當益出故獻募兵之法知募兵必以財故獻鬻爵之論此大將兵少之害可得而制也其次請以法制不立之害言之古者大將出師其下皆偏禆部曲莫不稟命於大將者也今諸路都監而上皆與大將均其所統雖名品至異然皆署事而同論非古制也不獨非古只以國朝殿前侍衞司軍制言之亦異矣今殿前侍衞都虞侯乃都指揮使之貳其名品不甚相遠至于署事皆不得預豈非戎事尚一其下正當稟命邪今則不然凢臨事機得聯署者皆得預議議一而後可行請借論之若保安軍諜者言當有冦至邪帥臣若專爲保安之備則其下率從若帥臣有料敵者言賊聲言保安不必專爲之備又使某將備鄜州路又使環慶謹守備其下必有爭議者曰環慶隷我當速召之以爲已援柰何使之自守且諜言冦保安不當備鄜州以分吾兵雖爲大將者亦自計曰異日賊從鄜州路又非環慶吾猶與諸將罪均若果從保安一蹉跌不勝則吾違諸將言獨被罪矣此不獨號令不行於下亦既衆人議之則自信者寡矣是則軍中之政有異見者當獻議而已不當必大將之從已也今同署而交議議一而後可行此法制不立之害也以某計之諸路大將外止署副貳者一員參署軍政别置主軍大將八員四員外守城鎮四員專隷麾下皆聽命于大將如身之使臂臂之使指無敢不從此法制不立之害可得而革也其募兵鬻爵與主軍大將名級皆别具咨目條陳某疎遠不識朝廷大體然竊思之今日之軍政非大更置之莫能成功聖上憂勤兆民顒顒伏惟閣下上副陛下倚注慰中外之望則天下幸甚干凟威重伏俟嚴譴某再拜又一首四月日朝奉郎太子中允充集賢校理新差通判濠州軍州事騎都尉賜緋魚袋尹某謹再拜獻書于昭文僕射相國申公閣下自羌虜犯邉某嘗獻書論事又得陳說左右今年虜㓂平涼山外地王師挫衂某念前所論說其已驗者三其不效者一某謂大將之兵必以歩卒三萬騎五千然後可以戰可以禦今任福所集諸將之兵始以萬一千人益以王珪趙律常鼎别屯之衆縱使合而統之才滿二萬是大將兵少且不得素撫其衆果以挫衂一騐也某謂兵家之制在乎統一欲使部曲分畫預有定名今諸將臨敵受命法制不立號令不明以致奔覆二驗也日者朝廷既擇用攻策相公復詢虜若先至何以禦之某逡巡仰􅍟以既欲進攻不若養勇以縱之是某揆今之勢不見可禦之術故爲此􅍟今禦之而卒敗三驗也相公又訪虜所當來某雖泥言臨涇高平穴相雜山外沃野居民富腴然最可備者保安胡繼諤族耳今繼諤兄害星某不能料虜之所先不效也自山外之敗議者歸咎諸將不能持重以取敗亾此知其末未究其本也諸將獨不用韓經略言分而趨利此一事可責耳假使合而爲一持重不戰其全師不過如王仲寶豈能制虜之俘掠以取勝哉仲寶壘去賊不十里賊去不能追然朝廷不加罪者以任福輩戰敗耳倘福輩不進仲寶雖欲不戰不能也戰亦不免于敗矣何者彼逸我勞彼整我囂彼人人自趨利我畏死有遁心又加以數倍之衆豈有不敗哉不獨向時之役是乃虜常勝而我常敗也難者必曰虜何得常逸我何得常勞夫虜之将來廣爲屯營使我疑其所向必多方以備之及其既來我大将之兵不滿萬人急召某將若干人又召某將若干人如是散召之以至三將五將有先期者後期者合而統之亦必越三萬必三百而後集則虜已據我要地休息其衆分擇精銳以鈔居民既因我糧復所費糗糒有餘速戰則氣盈緩追則逸去或曰俟其歸而擊之賊又有橐駞以載其重我多歩兵又益器械糧糗之負以之追躡利害彌遠或者必謂俟其歸者非躡其後也阨其路而已且虜騎堅勁峻坂竆谷無所不馳無所不通其來也未嘗一路而至其去也何從而阨哉是以彼嘗逸我嘗勞也然而彼何得嘗整我何得嘗囂夫賊號令既一部分既定在塗而訓入境而誡此其整也我則不然冦至而會兵兵行以應敵諸將聚議不過頃刻教旗分陳之法施于倉卒此其囂也何謂彼則人人趨利我則畏死而有遁心夫賊得吾一卒奪其衣装足以自資此利近而易趨我衆力戰者多死先遁者或免而無誅惡死而樂生人情之常凡此數者賊必勝之理其章灼如此某所謂未見禦之之策也又若内屬之户爲虜所取者固爲虜用矣其未取者虜一擾之則我疑之我疑之雖未爲虜用已失之矣何者外爲虜所擾内爲我所疑必持兩端以自固此與虜用等也今未爲虜擾者獨環慶諸族與保安胡繼諤耳不早圖之又將爲其所擾矣某前謂當謹備繼諤而虜不望者非繼諤之強能自支虜而莫敢犯也某自延州萬安鎮扺其部族以及慶州之平戎凡數百里居民殆絶但有種落耳是虜取繼諤與侵延州之境不若取山外之境此特所利先後耳非可恃其不來也夫事四夷馳非王者事今天子仁聖誠使虜不敢犯返復何求於虜哉此策之上也然未知何從而致此若如某前歲所陳大將可屯得以歩卒三萬騎五千部曲分畫各有定制此則有以待其來而制之亦策之次也不然驟集他路之兵備一月之餉嚴其部分明其金鼔輔之以屬户破其種落擾之因之有以俟其欵伏此又策之次也捨是止用今日備禦之策但慮屬户居民大罹其毒被邉諸城䀆爲孤壘内地遠輸日益愁怨且虜以利舉苟外無所掠必將攻城日朘月削塞邉遂蹙當是時益兵之多調發之勞恐不止今日而已願相公㴱慮之某向欲以此陳畫聞于上聽令以伏暮無狀被命南去地優事簡於身甚幸苟循黙無所建明則異時公議恐難獨免然某今日言之必以爲妄願畱置几桉向秌以暨來歳幸復視之必將數驗不然者則我之天幸有二虜長死一幸虜長不自將使他人分其兵來我驍將或能禦之二幸非此二幸或有成功則某不知也意激辭直不避忌諱維相公與二三同德以天下大計畱意觀省察其至誠幸甚幸甚上陜西招討使夏宣徽小啟某才到慶州聞任福兵敗徑赴鎮戎軍有不曾稟候二日命專輒事伏已具公狀中葢事出倉卒所謂失火之家不暇白大人而救火以此加罪誠不敢辭伏望太尉原其初心少賜寛假則終始幸甚非久當詣幕府河南先生文集卷之六
