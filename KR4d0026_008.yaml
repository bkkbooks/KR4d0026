front:
  text: 河南先生文集卷之八
  hash: sha256:b9da7d0552e345b18eed3ff7a787f0645c7a3c433fdab13a84dfa9eec042d702
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_008-1a}
body:
  text: 書啓渭州謝宣撫樞密韓諫議書一首議西夏臣伏誠僞書一首議修堡塞書一首議斬首級賞罰書一首上陜西都轉運孫待制書一首上樞密杜太尉啓一首與邠州通判劉九太博書一首上四路招討使鄭侍郎議禦賊書一首謝宣撫樞密韓諌議書某承乏邉州逮此逾月上稟前降預議下與諸將協和修完器僃謹守條約區區自􅊵庶無敗事然於保邉之術經遠之略則久在幕府必蒙體亮多謀而寡權尚法而不忍此性之弊自知甚明豈意見私之深遽茲奬拔惟憂任過其量仰玷恩館其諸誠悃非面啓莫䀆議西夏臣伏誠僞書某頓首樞密諌議今日捧教承已反德順軍諭反子奭自虜來歸言其臣伏事此虜計之得也抑其虛名以示陽尊於我猶足以驕我心而怠之僃況得重賂以實其帑豈非得計耶且虜之臣伏果能革其僭悖之心貶其車服名號䀆如臣禮耶徒以所上章奏以臣自名耶就使䀆如臣禮亦不可信況於其國車服名號一無有損徒以數幅之奏易萬金之賂彼之醜類雖甚昏愚較計利害豈能易此哉夫君臣名號中國所以辨名分别上下也國家統臨萬國垂九十年蠻夷戎狄捨也律氏則皆辭命而羈縻之有不臣者中國恥焉西土之役由是而興夷狄則異於此唯其利而已且彼於中國非素敵也其祖其父皆臣也奚恥而不為臣哉今虜之醜類必皆曰我戰數勝又能取賂於彼我其強也雖吾士大夫之有識者亦曰彼戰數勝矣而反屈於我且得重賂以畜其衆是真能保其強者也如是則彼之臣伏果於我為得耶於彼為得也或者必曰向者患其不臣今既臣之復以為患則反覆無所據且自古夷狄之於中國始判撫而終馴伏者多矣奚獨此之為異哉其必應之曰不然中國固當鞭笞四夷而臣屬之也但辨其來臣者誠與僞耳然則誠者有畏者也僞者有謀者也今果有畏也有謀耶謂之有畏則吾戰未嘗有勝也吾兵未嘗有攻也彼何從而畏哉謂之有謀則國家之患或基於此矣譬人疾之攻於外也朝夕命醫者視其脉之進退一動一息必加意焉又起居飲食之慎醫者必決之曰脉止是而不能變也疾者亦自審曰疾止是而不能加也於是日冀其有瘳焉當其疾或瘳於外而猶根於中未能去也疾者喜釋其苦良醫雖戒之日益怠焉飲食起居雖自曰慎之日益肆焉於是疾乘隙而發則已痼於中而至於外也雖醫之良殆難為計矣自虜衆犯邉師徒喪敗至於今日知所以為敗者多矣凡一堡一障之隙吾皆營而固之知所以為僃者多矣知所以為敗可以不敗知所以為僃可以待之此禦戎之常也今既重賂以結之為虜之僃必異於此邉壘雖未即廢壋增而浚者必休其役戍卒雖未即罷當聚而練者必散而處舉是而推之則上下之情無有不懈也是亦有疾者雖瘳於外而根於中當其伺隙而發則已痼於中而亟於外雖良醫難為計矣所謂國家之患或基於此矣者以是也難者必曰景德中北方講和自是三十矣天下無事虜未可以不信待之也某必應之曰此時事之異也景德中虜入吾地深而大衆卒不與戰至今言之者猶曰當是時我不許其盟則虜衆殱矣是強弱之勢未分我衆有餘力也虜既㱕鑒其入地深而無所克知中國之未易輕於是有講和之事自是無少􅋢焉及羌種外叛遂有益地之請亦信於前而不信於今蓋利之所在也然則信不足固其心賂不足塞其欲較然可見矣今王師數衄於外又加以北方之隙則強弱之勢豈得引景德中事為比耶且北方以地為請既以賂解之西方以號為請又以賂解之二虜知我終不能以地與號假之也將合謀必以地與號為假或不以地與號而他求焉當此時我以兵拒之耶以賂繼之耶以兵拒之則不若今日之兵有僃且練也且重賂不資於敵而以供士費也以賂繼之則中國之貨有極二虜之請無窮為今之謀當以國家之患必基於此猶人之病將痛於中而亟於外朝夕念之唯危亡之為憂則庶幾乎少安矣某識慮昏淺不能先事以言蒙見詢采不敢不䀆伏惟明公位尊任重與國同體願深留意議修堡寨書近奉朝旨依張忠所相度山外修建堡子十五處計功四十萬某以為堡數太多又不於羅李家修城恐忠未得仔細已令畫圖至今未到竊見虜纍入塞皆以戰勝有所克獲是以不致力於堡寨今既依預降固守虜來不得戰此等城堡卑小若䀆鋭拔之肆其慘酷則諸堡皆震懼不矣有劉璠之失往時樞密諫議建譏廣劉璠定川屯最得策欲乞應弓箭手所居如的去城寨二千里外方建堡子仍須堅完縱虜大至須為可守之計如此不過修建得三五處一有二費不免為虜陷三得弓箭手且在城寨防守如允所陳乞賜指揮議斬首級賞罰書近覩牒命凡得賊首級一切見賞格支錢更不在轉遷酬奬之例此恐有所未䀆大槩不欲以首級酬奬者蓋慮壞亂行陳及爭奪不明故也今秋成之際賊之遊兵屢來抄劫堡寨弓箭手或有殺獲例無酬奬則難以激勸凡百十騎交鋒非力戰或窮追即不能取首級非乞别降指揮應敘理曾緩大陳得首級者只依賞格處分如只是尋常賊馬出來抄劫能殺獲首級者申取上司指揮上陜西都轉運孫待制書十月二十七日朝奉郎行右司諌直集賢院知渭州兼管勾涇原路經略安撫部署司公事上騎都尉賜緋魚袋借紫尹某再拜獻書於按察待制閣下竊以州郡之於監司奉教約遵憲度而已反此雖無害於治不得為無過某向以糶麥事不待報下輒專以行明公不以輒行為責方條問其利害是明公不以監司為威重但核事之可否宜乎名重於天下也某竊自思向者明公責其輒行則默然伏罪者詢其利病則將以䀆其說於左右恐懼恐懼恭惟明公所治東崤陜西接梁漢南武關北䀆上郡列城數百地數千里某所領者有經略數郡之名耳不專其任又都統在涇軍政一以稟之是其所治獨以平涼潘原二縣地不過百里明公以列城數百地數千里之大其於思慮則明公以廣某以專其於事實則明公以傳聞某以目睹其謂思慮之廣不若專事之傳聞不若目睹雖英識精鑒洞照幽隱然大槩論之鮮有異者是以事之利病䀆條於公牘中伏惟察其至誠宥其任愚幸甚上樞密杜太尉啓某出入門下幾三十年至於才識短長器局淺深自知甚明況在英鑒平涼用武之地平時郡守皆舊臣宿將今艱難中當重其選反以愚儒處之但懼上損國威仰纍恩館前此拜章懇辭又以近日授官無有遂其讓者以是亟詣官所未審某官徒采其虛名試任之邪果謂可任而任之耶若試任之則邉要事重固不當試也如果謂可任則望終始保庇庶幾有所樹立某言此者誠以冦讎在境師兵在屯凡百措置未有一事不繫於樞府者則某官見庇之深不獨移於某是亦留意於邉事也與邠州通判劉九太博書得伯壽書欣慰無量伯壽志於古聖人之道有年矣日來年益加於道固益邃某聞邃於道者於世事泊如也功名未立其如吾何幸伯壽安之上四路招討使鄭侍郎議禦賊書昨日兩得指揮那移狄部署下兩將軍馬於鎮戎軍儀州守把似恐太速見石輅回奉傳尊意如賊有寇須且持重觀其形勢此最得策今來事宜雖急然未見的實入寇去處惟望鎮重以待之此中行下㳂邉文字至渭州並不令下往諸寨蓋近裏城寨不當使預有驚疑故也但齊整兵甲伺候出行城中並不令知覺合具上聞又一首今早又領牒命欲令㳂邉州軍披城作硬寨以遏深入之勢竊以本道見在兵馬除城寨屯守外其戰兵只可在一處枝梧何者賊衆若來不下十萬今若鎮戎德順兩軍作寨不過四五千人接戰則不敵渠勢又不足儻為所乘則城中搖矣皆兵共鎮戎戰孟元兵共八千八百三十五人八千八百九十人德順通趙隙若只令狄青領大軍在瓦亭觀其形勢彼求戰則我堅壁不與之較彼前進則懼我制其後俟其有隙而乘之此計之得也且賊大衆入冦不過德順與鎮戎兩路至於原明上險非賊大冦之路也萬一賊自鎮戎舍九亭路直趨原州則有彭陽一軍在前瓦亭重兵在彼後亦非彼利也今之所憂者但憂狄之兵少不能勝虜耳兵共一萬五千四百三人堪戰者不過孫用正德恭黃州家三將通部署牙隊真兵還即可得萬五千人萬二千人侯竹貴代到歐然不憂狄敗也狄不敗虜萬萬無深入之理望侍郎愈益狄兵專委以制虜之事所謂益狄兵者候狄往瓦亭郡即乞便發涇州兵赴瓦亭令受狄節制大抵賊入境之後統師思慮貴專號令貴一鎮戎德順二軍兵既寡少若營於野豈可保其不戰既患其兵少又憂其或戰兵少則欲濟師為援憂戰則欲其還望如此則慮不得專令不得一也且涇原諸將練事而可倚任者莫若狄青涇原地形可守而為要害者莫若瓦亭此侍郎熟慮之矣以可任之將守要害之地而濟之以兵則思慮不得不專號令不得不一此先勝之術也某自受任曉夕計慮比於平日似有所得恐未能上副尊策則乞令幕府一官到州諭㫖或召某令暫詣戲下聽命更取裁旨河南先生文集卷之八
