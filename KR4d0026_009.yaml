front:
  text: 河南先生文集卷之九
  hash: sha256:d450416a2c579865e07988ce28cb267bd5681b1d16477b682d19b17b1030e0dd
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_009-1a}
body:
  text: 書啓答秦鳯路招討使文龍圖書二首與四路招討司幕府李風田裴元積中書二首與水洛城董士亷第三書與幕吏石輅李仲昌書一首答諫官歐陽舍人論城水洛書一首答秦鳯路招討使文龍圖書二首知受命即拜手啓以是不敢更具謝札伏承誨翰乃有頒遺不任悚荷之至虜今秋亦聞點集近報舉數萬衆乃取屬户數百遂罷去未料其意所在也虜數動常以季秋及中春又因月盛時且不甚攻城異時也來未可必其如此何者我嘗逆與之戰今之為謀大抵欲以不戰疲之安知其不能就我不戰而為計哉觀今之為備不過以故意行之是自欣以知變而不知虜之能應變也伏聞明公軍政甚治士氣亦振守禦人策必有多算敢冀指授庶奉尊教又一首某頓首再拜承賜手教詢劉滬被繫始末城水洛利害早蒙責以不言某以元師主其事是時防邊方嚴懼於軍政處置益相戻所害不細獨欲遲留以緩其事故默默無所發其實畏避誠足深愧適會中旨罷其役雖愧亦頗自幸既而二月十九日得元帥牒云被朝旨驟舉此役於是抗章條其利害秋部署亦自削奏語尤切至二十二日見詔書罷四路是夕得旨令具興修利害條上於是知朝廷前未有旨令舉此此役乃亟召許遷等還此劉滬者獨以所將兵與其役始以文諭之不答差指使召之不若又命見歸都監張忠代將其兵亦不受命某與狄議此而容之是節制不復行於下於是狄假以巡邊至山外命散其部兵然後滬就拘滬樂功名有膽要亦可惜然違戾如此無以貸也同年董士亷者老困可哀某以書三諭之令其歸雍卒不見從遂同被繫然滬等所執文符皆鄭公罷後所發不知何謂也其平居好論議至於起獄以取直豈某心耶世路風波殊可駭畏竄身山林閉目氛埃無路可致耳今聞朝廷命使定城水洛利害拓地廣塞亦古人之常但揆已之才略度今之兵力若既城之後分兵而守輸粟以濟緩急冦來又當逺救懼以敗事耳如朝廷果以城之為利某當乞移僻郡必有賢才見代城之而不保其利終不紛力較毫髮以取勝也未審尊畫如何願早賜教答幸甚與四路招討司幕府李諷田裴元積中書二首某啓某初到郡得前政所占民田不還直自今納稅一事其決欲行之自念秩卑恐有司詰問益淹久不便於民是以白於鄭公公大以為然尋出榜諭民給其直且免其稅此一事諸君盡知之及韓公來某臨郡已兩月所得民間不便事益多見訴尤不便者必告之曰韓公且來汝自訴之及韓公來以事自陳者千餘人韓公必盡覽之究其事理覆其報原或見詢於某或命他官參定然後行之其於事固已精且詳矣某豈私於此方之民哉亦由前日白鄭公給民直一事蓋以公家之事苟利於民則韓公鄭公與其行之皆一也何必分彼此哉不意好事者以某附韓公為事多所更置未審言者以某附韓公為善耶為不善也若以所更事為善則不當謂之附也若以所更事為不善則某前在涇州鄭公朝夕見延其於邊事無不詢也無不慮也獨獄事不與聞他則無細大皆往覆究極於議論未嘗有隱未鄭公相顧之意始終若一是則某之論議有可采者也於邊事有所得者也苟一以不善贊鄭公則公必怒而絶之何能終始相顧如是也是果不以不善贊鄭公者也不以不善贊鄭公而專以不善贊韓公是厚於鄭而薄於韓則於好事者之言為不通也若以前日在涇為智今日在渭為愚又於有識之議為不通也此事聞已久疑之不甚信近日益有端緒然不知鄭公果如為信否鄭公為元帥某預掌一路兵寄若好事者言行則間隙日生苟有戎事某無所逃誅矣平涼去年經虜冦殘破之後朝廷不以某不才擢當此任亦思有以自報朝夕勤事非公宴不邇聲妓受署殆今五月斷獄不過十數人皆歷歷可訊其營田護寨蠧於事者韓公盡以刷去之今獄訟益簡止以練兵為事爾諸君察某心豈主於榮官哉子發相知尚淺士規益之皆目見某謫官當時寧有歉於心耶古者刺史嚴明郡守有投劾解印綬者某豈重去此一官哉幸諸君為某辨於鄭公公果不晤某立當解去且以終鄭公前惠又不使他日戎事之際使某憂疑自危措置顧失雖被大戮或敗國事願諸君留意見答又一首得劉伯夀牒取王文政文牘尋以封送始文政等以罪配隸牢城保寧為兵會韓公來以舊獄訴於公公命覆其罪苟不至深切則移籍於廣鋭蕃落文政等皆在涇於是申上帥府呼此二人幕府不俾二人者來反令取其具獄就涇視之既而帥命二人者來止云材弱射七斗弓箭不滿兩握其具獄則詳之矣於是衆議曰具獄往而二人乃來此必審其初罪不為深切矣其言材弱射不中程者慮以廣鋭處之也蕃落舊等才五尺三寸近制短指者亦聼狄侯命二舊卒方之不少損又命以射彎九斗弓箭不滿二指在舊卒下等之上涇內地不知蕃落所用皆短箭故差繆相逺若必以長箭程之雖積功至大校其少且壯者亦不能應格矣又蕃落中有犯姦若盜如此比隸軍者甚衆決不復疑但喜得勝兵者二人遂易其籍帥府乃詢云若二人者罪安得不為深切然後乃知帥府之意不欲隸此二人於蕃落既已籍之無如之何乃答曰其罪不至極於惡蓋婉其辭所以恭上命也不圖又命劉伯壽覆其獄凡涇人之相厚者皆見責曰何乃不稟帥命某聞之甚駭其言若他事則不敢知如止此一事則非所以為不稟也何者始本路索此二人於涇帥既不遣復命取具獄視之若果以為巨慝則當下令曰此不足貸二人無可遣理獨歸其具獄則某必審視其罪雖其可貸猶當奉承帥旨奚必改籍此二卒耶且韓公非素得視此二人具獄也命本路究其罪易其軍興不易皆繫於本路也不易不足為忤意易之不足為迎合且本路軍與民暨蕃酋以事自訴以功自理於韓公者多矣皆下其事於本路且命詳之其以事自訴得辨者十二三以功自理應格者十一二蕃酋所陳其可行者十不一二皆不以先入之言為主也文符盡在可取而覆視豈必以此一事為違戾耶兹事極微而某懇懇為言者誠以害於體為甚大也昨日經略司行某事其於法少礙而事當然者大吏持以前日王文政等無礙於法尚爾今此恐見詰奈何某叱去之某謂狄侯曰異日此曹有言必請黜之雖異日黜之徒能制一吏如將校何將校必曰此一細事猶不得遂其行安能使我有畏哉吾獨知畏元帥耳此甚足為元帥憂也自某臨本路原州鎮戎軍決罪有不至死而特死者有當死而慘其刑者某與狄侯議皆不問其狀蓋知其守將可任以事當申其權於下也又有卒犯罪反持其主校過失者某詰之曰若主校與汝共為隱隱汝懼纍以言或主校濫罰汝不勝其虐以言吾皆聼汝理有罪者今汝自有罪當罰主校若貸汝則過終不聞是使主校皆畏過莫敢笞其卒者此軍之大弊也狄侯暨諸將皆曰善然遂杖去之且大將與士卒非人人能督察撫循之也必有主校焉使軍中皆畏其主校則將無所事矣夫士卒不畏其主校則飲博自恣飲博自恣則卒至於貧窮卒至於貧窮則無所不至焉為主校者豈使反畏其下哉故為將者必察羣校之貪虐者首去之無使其下能持焉則卒皆有畏矣是則大將者不使士卒獨畏我而不畏其主校又不使屬郡之兵獨畏我而不畏其守將此治兵之大要也某秩雖卑然於本路言之與狄侯皆大將之任也責任既重朝夕於邊事無不憂者聞士卒不畏其主校則小以為憂聞屬郡不畏其守將則大以為憂今將使一路之人不畏其大將則元帥安得而不憂耶故某所謂於事雖小而於體甚大者正以此某得以諌名官凡事之曲直猶當於天子廷辨之今乃不能自辨於元帥反囁嚅於幕府豈畏懦耶蓋元帥之體不當以事詘於部將是某凡辨論事可取直於天子不可取直於元帥幸諸君少留意焉與水洛城董士亷第三書近兩附書皆計上達殊不蒙體亮何所守之堅也水洛修與不修亦所見之異耳李文饒牛思黯爭維州事是非至今有不同者亦何必不修為是修者為非但某與狄侯以才略之不廣兵衆之寡少不能逺為守備故建不修之議適會鄭公罷去逆蒙中旨從本路之議行簡奮忠國之謀必以修之為便當辨之於朝廷稟詔者而來則本路從之亦有名矣幸行簡少思之水洛地果屬何路譬若治他人門內之事豈不為侵耶是行簡可以已其事本路不當變前議也行簡困􅪀纍年聞改官朋友所共欣故前走書奉報誠亦私心所喜一官雖不足為行簡言然於夫人之心豈不為慰哉此事窮極某輩為守職行簡為侵官何不思之甚也試使某今日却以修之為便行簡以某為何人耶况狄侯強毅有守雖某言之亦必不從前書減裂故未蒙省察是以喋喋願熟慮之與幕吏石輅李仲昌書承從部署已至德順軍所留劉滬董士亷文字蓋只苗往諸處取索及往長安文字不緣章奏既捕之即是罪人安得妄上文字眩惑朝廷耶必若其言吾輩隱匿即當徼上不可留也况泛泛妄自飾非但白部署且封起勿毁去即無害已行文字却取去不便兼且有迹反使不知者將謂不當留其文字唯存其人使盡辭於獄自免閉塞之議二君熟思之答諫官歐陽舍人論城水洛書某十九日至解州聞永叔舍人其日抵陜郡以數年之别相去才數千里不得一相遇悵然以為不幸然某方為姦人所擠名御虐百端舉朝莫與為辨若見永叔必極論是非其不知者將以某祈恩求援於永叔此不獨重為某纍又且以纍知已故不得相見未為不幸也自天休見侵未嘗作京師書用此亦不敢修問左右蒙專遣腳力致手誨何朋友之顧厚也仍以某近喪長子為慰某始三男中男往嵗多病襄城道中物故者也幼子三嵗美慧可念三月中在渭失之長男壯大與姪植皆門户所倚者一旦同逝人生孤苦至此處世復何聊賴永叔見哀之深誠知我者然謂晉慶不常為意似未見亮永叔尚爾况他人耶水洛事未易可言然事之利害人人各異見不必深咎今既城之則異日自辨不足復論但天休既罷兵任若以城之為利當論於朝廷不當督涇原部將擅為此役彼劉滬者為涇原部將苟知城之為利害當與天休合論於朝不當數事耳幸賜照亮河南先生文集卷之九
