body:
  text: 答福州蔡正言書一首答張固太博書一首答河東宣撫參政范諫議啓近捧教答所啓事皆䝉施行不任戴荷之極近聞蔡石皆外補又緣飲㑹事多斥善士去年聖上奮然英斷登用明公暨韓富諸公天下翹首以望太平今明公未去位端士頗復見外世人用意如此言之可為於邑明公縱以邊事未還富公詎宜久留於外耶又況北虜四十年休息若一旦舉事其勢不小嚮將所傳與西賊相攻卒無實驗此謀豈可測也自古夷狄之得志中國無若元魏元魏始從雲中得代郡太原然後取河北願明公深思根本為國家謀長久之算一堡一障不足以捍禦無或因循異時負天下之望某受遇素異直布所懷不避忤犯尊意死罪死罪答樞密韓諫議書自使節還都不敢輒上箋記伏䝉深賜體亮將降手教兼以某兒姪喪亡曲加存慰不勝感涕姪植男朴俱為門户所託朴又嘗以文贄左右䝉國士之顧本謂此兒終為門下之用何期不幸一至於此某在秦所生一兒亦前此失之年將五十未有繼嗣未嘗不中夜撫心對客吁歎若使憂能傷人亦恐不復再奉顧盻矣樞管事重伏望善調寢膳以副禱頌賀兖州杜相公書啓伏承相公亟解台司出鎮東土拜恩䖍恭即日上道雅懷素志固無少歉然士大夫之有知者相與切議以相公居位日淺法制利澤未大施于下用是於邑某之鄙心更所未盡若於朝廷於生民而言則不異衆說若以進退論之兹為全美伏惟相公繇初仕以至顯重無一事不為人紀無一行不為人式天下之望唯恐不作宰相豈獨私於相公誠以有益於斯民也夫宰相之任道行則久處而無嫌道黜則亟當去位然髙位大權人所顧籍於是被將祿保寵之譏蒙阿諛順㫖之議不獨今世前代名公所不能免恭惟識進退之體保初終之節全天下之望考於今日可謂無愧若以歲月則平時所履懼將大損某出入門下垂三十年區區之誠實在於此敢持此說為賀答河北都轉運歐陽永叔龍圖書自承河朔之行意竊有疑何者正人在朝天下䝉福今雖總制一道然所施置不過千里其於重輕豈同日而道哉以是不敢為賀近日得都下信君謨守道悉以外補又以㑹飲微過多斥善士聖上慈明永叔以忠亮被遇不當以外內易慮志懷本朝也范公既鎮兩撫則未能卒還富公何得久留於外耶見河東使還所奏罷下等科率一事不謂留意文業乃得詳盡至是昔栁州見韓文公所作毛頴傳歎稱不已韓之文無不商者頗怪栁何獨如此為異見永叔所作奏記把玩駭嘆者纍日蓋非意之所期乃爾益知栁言為過相别纍年輒此稱道諒後見噱也又一首十一月中寫下手書㑹論奏部下事遂不欲通於左右今辱書承所履甚休兼其知某向所陳事某之心愛賢過于嫉惡不獨永叔知他人亦見信豈有心之所愛幸而共世不與之親且厚耶今之相知者多見戒曰當避形跡見踈者則相目以朋黨果如是顔子不幸得罪須盜跖乃可言不然學聖人者皆顔氏黨也世態殊可憎然不足恤至于勤事持身亦不敢懈見詢晉潞少時所遊之樂今歡意都盡不惟年物之異直畏事耳嘗憶往年送王勝之序云聖朝方以文法治天下子其慎之當日亦偶為此言不謂遂驗闒葺輩唯欲托人細過不可不慮也人還遽意殊不盡答鎮州田元均龍圖書向聞處置保塞事何事其精也兵久驕遂至殺害守將若又貸之則無復法制矣明公行此一事使主威復立雖四夷之人功無以易此甚善甚善近聞京師以微過多斥善士蔡君謨石守道相次外補未知其然否年來朝廷凡所更置亦有所存雖高而事不下接者自非聖人未能無過至于進用皆天下賢士大夫抵治平之漸也聖上聰明任人不疑而奸人忌前醜正務快已意其下思如此今勢尚微恐其漸熾所斥不止於蔡石也某豈私於數君哉所慮者讒勝賢絀則國家憂患豈止於四夷哉方今言為上所信且重者無如元均願深留意蓋疏遠之疏謀雖陳懼其不見聽也范公既西撫之行富公何故久留于外耶某久不作京師書亦不喜輒議時事數日聞此憤悒不已㑹得明公書因以盡道所懷幸賜體亮與鄧州孫之翰司諫書與之翰别久未嘗一日不來思直以德度服人企仰之心不能暫忘耳今幸㑹而復别重以顧恤之意笑語之樂中懷悒鬱不啻向時乃知仰高之心與愴離之惜各是一事古語作惡數日此最得之到隨當别作書又一首與之翰别十年所與游處深相知者不數人其間不以踈近為間毁譽為疑同不為黨異不為嫌如吾之翰者益難其比向觀之翰所論朋游其親若厚如其比者亦復無幾驟此相别以某奉思之心揆之翰相念之意詎有已耶上鄧州范資政啓某自謫官惟作報書當世公卿素相厚者未嘗輒上箋啓今明公鎮鄧鄧距隨不逺而李丞者專來相過時歸于鄧某又與李俱出門下若遂無尺紙以奉左右則何以逃簡慢之責某居此土風之善食物之同異情懷與樂否李皆悉之不暇一二談也恭惟解邊劇就安逸尊體甚休南陽舊邦春物向盛不得陪高宴傾談宥用是為恨答揚州韓資政書鄧州附到七月三日所賜書不勝感忭某久不上記亦如尊諭到隨賤屬多患瘧疾盡得平愈食物甚賤私用雖窘而不乏讀經書益有味體力亦無疲耗不煩賜念平日與人異同遂至爭論不息蓋國家事今既發放若復云云乃是懷私忿耳不惟絶之于口亦不萌之於心用是益以自適但恨地逺不得拜伏門下棲倚之心莫能具陳惟望善保台候以慰傾頌之懇答福州蔡正言書自君謨在朝廷為言事之臣遂不作書逾三年矣忽辱手誨以家兄亡殁為慰感深涕無已因念家兄平日常以遠事見教而朋友之說多異于此某所亦以為家兄親愛當然朋友相成以義者也家兄沒兩月某卒得罪使其尚存聞某就獄其亦憂而成疾矣故自謫官而來不以廢放自悼惟以負教為恨君謨於某兄弟皆厚故道此意漢東土風不惡寓家城東佛寺私用雖窘而不乏讀書日益有味不煩留意君謨侍親多慶因人或惠問以慰思渴答張固太慱書頃年在秦嘗見家兄稱道閣下之道人及來安定㑹軒車東還過郡始得請見則仰高之心有所從矣暨至平凉同僚議邊事有石若乘者數數論閣下之所施置無不得宜者益所歎伏近見孫之翰稱閣下之隱德懿行足以慮今世故某奉接未數而仰聞盛美為日久而且詳也謪官來止作報書雖欲通記左右顧不能致今辱書存恤至厚感愧無已又承别拜恩命即來知何日再接髙論不勝區區之意河南先生文集卷之十
