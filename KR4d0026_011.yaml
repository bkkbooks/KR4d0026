body:
  text: 答江休復學士書一首與京西轉運劉察院薦樊景書一首答光化軍致仕李康伯率府書一首别南京致政杜少師啓一首答計用章祕丞書數日中連得兩書㫖意甚厚兼以曽見鄙文過賜稱道閣下在某為前輩於文髙于道淳者也宜有以指其疵瑕朂其未至以成朋友切劘之益今乃曲為題品豈德隆者專譽人之長以誘其進耶不然何許與人之過也感愧感愧詢來介云已有嘉州之命不知信否閣下以忠獲罪其為留滯亦久矣造物者得無留意人遽草草奉此為謝意殊不周答汝州王仲儀待制書郡校來䝉賜手教具審尊體寧裕兼以退解為寄意高理詣誠所欽伏然閣下謂進與退繫乎道之所在雖聖門達者無以為異也若論夫才與不才竊有惑焉蓋才者容有小人而不才者不害為君子君子而才不至其進也於世不甚益亦不甚損小人才而進雖樹功立事其蠧益深閣下試思之以為何如又一首辱賜書教承自至汝陽政簡訟稀尊體安適某到隨州城東得一僧居竹樹甚美頗有隱者之趣所愧者以罪來耳答鄧州通判韓宗彥寺丞書某被罪放逐於時之士大夫宜見擯棄不與為齒閣下無一日之雅惠然見過開懷論議與平居交游之舊者無少異閣下真篤於義者顧某無以承厚意唯欽仰令德而已又一首辱書曽道及鄙文今録近所作四篇附李丞適呈皆有為而成非立意如古文章之為也閣下方以才名為士林推重當世名卿巨儒凡與游者其作為文章莫不通䕂聖功揚德音如觀樂於宗廟和平嘽緩無不得其宜若夫廢放之人其心思以深故其言或窘或迂或激或哀異此則非本于情矯為之也譬諸急弦促軫烏足留大雅之聽哉惟閣下亮之幸甚答環慶經略使施待制書某向領州得在部下官事未嘗相檢察笑語未嘗見疏外此閣下于某甚厚及某盛夏就獄閣下相視有不忍之色護視賤屬不啻骨肉逮及謫官盡室獲歸無少失所此又於某甚厚自見放逐平日遊舊罕有以尺紙見問者閣下方領兵貴重乃能數千里惠書勤勤見恤此又於某甚厚某接熟左右固未久然亟辱顧過宜何以為報惟祈益樹德業早登公輔得為聲詩以道盛美此其望也與鄧州丁憂李仲昌寺丞書向者足下說南陽孫守言人之才皆有分定雖强之不能有所益若德者在人勉之而已足下質於僕德果可勉耶僕就足下為吏而說曰毋矜已無盡法無報怨是足以為德矣足下樂兹說語僕云願誦此以自警此三者非於足下有所見也泛論為吏者當然耳足下乃能如是真好德者也既相别因思足下之所未至者輒復奉規足下讀書觀古人之所為其好賢惡不肖甚明然於行已似有小異足下於今世所與游者賢不肖悉有之賢者果能親巳足下固親而厚之矣賢而適與已親不肖而適與已親足下雖能辨其賢不肖之異而皆用其親疏而親疏之豈以人厚已棄之不祥不巳親而强附之為佞耶君子之親賢非以發其祿仕振其名譽蓋將以立身而至於道者也故與君子處斯君子矣與小人處斯小人矣為長者折枝尚無愧焉有親賢而為佞乎若不肖者業與之厚不當絶之毋自昵焉可也世復有以附已者為賢異已者為不肖不獨置親疏其間又從而反其賢不肖之實此所謂朋黨者也幸足下不繆於此且勉於進放繼以盡言唯勉之又勉之未見其已答李伯昻祕校書近令弟來辱示長箋以揚太博奉薦為謝足下以名臣子在選部二十年能廉幹任職監司自當以進賢塞公議豈必朋遊為先容耶不敢當不敢當答張子立郎中書連得兩書皆以先文志文事某於鄉里士人銘其先世者多矣其人於世不顯要其一事可傳即為志之况先文以宰相子致位三品樹立事功始終灼然為人稱道者耶敢不承命答謝景平監簿書嚮者過鄧承見訪以足下齒少語不及他止奉詢宗門而巳今得所惠書辭縟而意厚感歎不巳始某辱先公顧遂與二昆接熟今又得足下何其昆弟多賢使某盡從而游也足下力文樹德古之交友稱忘年者竊有慕焉答江休復學士書遞中兩得書并詩所云牙校附者書訪之不獲用是答不敢作書當見亮也自河南內之喪便有平涼之行盛夏就獄窮治百病端卒無毫髮自潤之汚遂得在外聽㫖只用不合貸與部將錢經赦不改正催收徒流三千里私罪當逮二官逐命漢東之命至此聚族不至失所雖未得還鄉自便然亦無撓日讀書詩一篇了無仕宦意必素亮也與京西轉運劉察院薦樊景書某頃守郡嘗薦士其取之初不甚精以謂天下吏員甚衆官局小大各有所任拔十得三四亦不為失人又其異日無狀已必預其罪以是無所愧負若薦人於朋友則必慎之重之蓋不如所稱則為誣罔苟以貪墨取罪則已無所損預獨朋友坐之其為愧負萬萬於巳得罪竊見州學教授樊景年三十慶曆二年進士始家江南大父以策畫為開寶功臣家襄今無仕於朝者景幼孤養於外祖高公慎交高公高潔尚名檢景深存外氏風某謫官與之比居為學未見其已其志篤於道者也所作文辭與今之名能者不相上下為學官通作尉三年矣今將以八月罷去近制郡掾與縣主簿尉三考用二人薦為縣令景始一人幸閣下成之某嘗與景論為政景以馭吏寬民為先是敏於政者然某見其志與行而未見其為政故詳其所見而略其所言使其為政不必後其志與行也某自見廢黜不喜道當世人過惡獨見人之善美不免有所稱譽誠知向亦用此取罪然似發于天性雖重得罪不能自巳景雖從某游今之所稱皆其行實於景無錙銖加重是雖私啓其實公論閣下雖不識景果用某言是亦公薦之也異時景得見門下閣下自觀其才實將復薦之又薦之恐不止於兹一薦也則某不獨為景求知閣下亦於閣下知人之明不為無助豈止於無愧而巳答光化軍致仕李康伯率府書與閣下别久然心未始忘也某泊於風波自取放逐閣下齒髮未衰遺榮養髙同處兹世其識慮相去何穹壤之異也何期未賜棄絶四致榮問雅意勤密至慰至悚某留鄧俟房州叔父過當詣鄧待闕拜見不晚諸悃非面序莫盡别南京致政杜少師啓某自初春卧病聞拜新命欲俟稍安即修賀啓無何所患沈綿迄今未瘳生理固不可期若遂不能達誠左右則抱恨無已自念受恩門下三十年每聞相公一美事則咨嗟稱道為門生之光今年俯七十確然去位德全道隆終始無玷歡欣抃躍異於常日某得罪本末更不復論及仇人欲以贓見汚窮理百端卒無毫髮自潤自謂無愧于人然於相公不得言無愧嘗記頃年相公在監司怒次主吏月朔預取俸錢者俸錢尚不可預給况私用庫錢耶蓋由久去左右滅裂教誨止知廉身不能慎事故自謫官未嘗他尤但自咎而已惟於有位者不敢先作書問今相公致政還第方敢少露悃悟某雖伏枕纍旬醫言據脈可療萬一有瘳庶幾再得請見門下不任依戀激切之至河南先生文集卷之十一
