front:
  text: 河南先生文集卷之十二
  hash: sha256:d4ebc3a3ef17748f623733c6998e65b17226ae379f603197f8c9f2a01729c806
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_012-1a}
body:
  text: 行狀碑故中大夫守太子賓客分司西京上柱國陳留縣開國侯食邑九百户賜紫金魚袋謝公行狀故朝散大夫給事中知同州軍州事兼管內勸農使上柱國隴西縣開國伯食邑五百户賜紫金魚袋李公行狀故推忠協謀同德佐理功臣樞密使金紫光祿大夫行尚書吏部待郎檢校太傅同中書門下平章事上柱國太原郡開國公食邑四千一百户食實封四百户贈太保中書令文康王公神道碑銘中大夫守太子賓客分司西京上柱國陳留縣開國侯食邑九百户賜紫金魚袋謝公行狀曽祖廷徽國子司業越州觀察判官祖懿文祕書郎杭州鹽官縣令父崇禮泰寧軍節度掌書記檢校左散騎常侍纍贈户部侍郎本貫杭州富陽縣章嵓鄉赤松里謝濤字濟之年七十四謝氏系譜自公七代祖已下官諱具存始居河南之緱氏至四代祖終衢州刺史葬嘉興因家江東及鹽官葬富陽縣遂為富陽人當錢氏制吳越故散騎而上三世不為朝廷官公始十一嵗嘗與父客談散騎私觀之見其辨對有成人風大為歎異學舍有説左氏春秋公十四嵗從之學歸輒與同輩伸其義必盡其師之所傳既冠寓居吳郡會汾晉平郡國當表賀吳士為奏者文體弱更數人皆不能如郡將意公私草之為人持去郡將大稱愜吳中先生亦自愧不及故王黃州羅拾遺處約並為吳之屬縣長公與其遊羅嘗與王書云濟之揚椎夫人蓋吾曹之敵其為名流推重如此淳化三年舉進士上第除梓州榷鹽院判官明年盜發益部公以梓近益為大郡畏益強逼且利以自資攻之必亟盍大為守且時近郊多林木乃白郡守悉取之以完棚櫓且為薪蒸之備既而被圍百日樵採路絶城中賴焉公參陳謀議公護塹壁及圍解於僚吏為最力就遷梓州觀察推官明年權知益州之華陽蜀民流散之後田廬荒廢詔書凡入租占田有能倍入者斷以新籍於是豪右廣射上田貫民歸者多亡其素産公曰此權時之制欲就業耳芳利其倍租而使下民失業豈經制哉乃命盡還舊主所施行與詔書異至道二年召歸授著作佐郎太宗面諭令通判大藩即通判夀州遷祕書丞又通判筠州知興國軍真宗考籍有五年無過者特遷得改太常博士一日內中出朝士治績著者凡二十四人名付中書門下令召見即以景德二年冬對長春殿賜五品服令通事舍人焦守節送學士院試試之明日會邊奏警急降詔北任是時曹濮盜起又虜者分趨齊鄆東土頗騷朝廷慎擇郡守真宗面諭宰相昨日京東闕人奏曹州闕人謝濤可轉官知曹州遂除屯田員外郎曹之征賦舊分送睢陽倉公至郡會霖潦民車在道者不克進公曰自曹及宋陸行數百里平嵗致之不為易今泥淖益困吾民且江淮漕運日至睢陽城下曹有廣濟漕亦通京師使曹賦得增送京師睢陽自取江淮來未以直曹賦豈非便耶乃開廩盡收屬縣賦且上其利狀遂與轉運使交奏朝廷從公奏降詔褒美未幾召還奏詔祈雨嵩嶽祠畢雨澍因言嶽瀆有請禱而無報謝意義或為闕真宗是之因詔自今修報如禮是年西南有大星見占在蜀分詔公巡撫益州西路入别受詔與益州張公詠同議鑄大鐵錢利害於是考鐵價與舊錢更相均準故下不得盜用而物價長平蜀人至今便之使回舉三十餘人宰府疑其多公面陳諸吏幹狀願署連坐以冀必行奉使舉吏連坐自此始後所舉多踐臺省不調者猶為郡守四年授三司度支判官大中祥符初出知秦州又知歙州改度支司封員外郎坐三司判官日舉榷茶官被罪奪司封五年復為度支通判河南府馮魏公罷居守薦公于朝召試授兵部員外郎直史館判三司理欠憑由司出為兩浙轉運使賜金紫遷禮部郎中判司農寺天禧五年兼侍御史知雜事乾興元年遷户部郎中永定陵駕將發少府治明器象物甚侈大山陵使奉詔自京至陵凡城門民舍卑隘者壞之公上章言先帝封祀儀大物備尚不聞廢壞所過城舍今遺制務儉薄反以象物壞民居非先帝意願下有司裁損章寢不報物議是之是年以疾求更歸除吏部郎中直昭文館知越州天聖中代還遷太常少卿判官太府寺登聞檢院以步履艱蹇求西京留司御史臺踰年改祕書監臺任滿就求分司明道元年轉太子賓客景祐元年十月三十日戊疾薨二年八月嗣子兵部員外郎直集賢院絳奉公之喪自京西歸葬于富陽公生平不恤家事然友愛甚篤宗門有孤者收養嫁娶如巳子在朝廷見貴勢無所降屈士子進見雖少賤對之肅然及交言則開懷無少隱故人皆憚其高而愛其誠況治郡部吏有一善必孜孜稱薦或犯法雖甚惡之直其罪而巳未嘗有故刑故終身無二嫌怨者雅善品藻文章江夏黃叔才嘗作惕允恭墓銘甚負其文顧公曰能損益一字者我當辨之公削去二十一字叔才歎服不已西京被疾人有贄文者必讀之終篇或摘其詞之工者稱道之其愛奬士類如此初兩浙轉運使還朝議將以掌誥命會得疾逾旬不能無事遂寢素好修煉藥術喜與方士談視榮利泊如也本朝圖書之府惟昭文史館集賢祕閣公與兵部同時分帖四職太府等實父子相代縉紳榮之見于衣冠盛事録母夫人崔氏追封博陵郡太君夫人許氏封晉陵郡君初散騎五子皆以五行定名公次第炎有文稱終公安令館今為天台令果從方外教號安隱師坦左侍禁子三人長即兵部次約將作監主簿少以才敏知名季綺太廟齋郎約綺皆早亡女四人長適同出身周盛次適德興令堯臣次適延陵尉傅瑩次適吳縣尉楊士彥孫三人景初將作監主簿景溫太廟室長景平試校書郎女孫四人並幼公才位德美當列國史敢直紀行實以備史官之録謹狀某年七十六公之先三世傳春秋學至户部始以明經取科第公亦世其學端拱二年及第校解州安邑尉居官有能績秩滿再調京帥廷見日太宗省其勞狀嘉之擢大理評事知邠州三水縣將靈武用師轉賦粟以餉軍再至積石皆在期先遷光祿寺丞通判雅州會盜據成都不逞者譁言以驚動旁郡公詰姦謹備郡境肅然事寧制書褒諭遷大理寺丞通判寧州卒都進者謀亂事覺公懼連比者不能自明精意辨析全貸者衆移通判邠州遷太子中舍殿中丞為開封府推官賜五品服未幾出為利州路轉運使先是户部舍老京師嘗墜馬大衢中人亟以告公朝服即步出府門趨其所頃之導從者皆至户部無他傷肩輿以歸或以事聞者及奉使入辭真宗問曰卿父墜馬無傷耶因賜三品服是時臺郎御使史出領使任尚穿賜金紫公秩卑初被進用搢紳榮之至部會嵗歉奏賑飢之章未報出倉粟數萬石散之民無轉徙者遷國子博士入尚書省由主客金部司勳五遷至金部郎中歷三司鹽鐵判官京西京東淮南河東河北五路轉運使京東淮南皆再主前在淮南開漕渠通廣陵市或有異議者罷知泉州後由淮南入為三司度支副使授光祿寺卿知算州未行改太常少卿兼江南安撫使遷光祿卿充淮南制置發運使時東土大飢自淮轉粟五十萬濟青徐民俄授右諌議大夫知揚州徙知潞州代還授給事中知同州景祐五年八月二十五日以疾終於州公為政平易務為靜治不喜作為聰明部吏或犯法須其自章然後置于理其用心寧失有罪不忍獄自巳發故所至有長者稱掌內外有三十年金粟羡盈纍千萬供億用度無一敗事不獨精敏故人以其聞見詳熟他吏難與比者樂薦士保任百餘人多至通顯母田氏追封某郡太君妻安氏仁夀郡君子五人熙載同學究出身早亡熙古進士第為屯田員外郎熙績衛尉等丞熙朝大理寺評事女四人長適屯田員外郎何日次適天章閣待制楊楷侍御史程戡屯田員外郎夏安期自適楊氏而下俱亡諸孫七人嗣子奉公之喪即以其年十一月二十八日葬河內某鄉某里先公之墓次前葬録公世系官閥并其行事俾某次之將求作者以志其壙某詳載其實以景祐五年十月日責授崇信軍節度掌書記朝奉郎試大理評事兼監察御史前監唐州灑稅尹某狀協謀同德佐理功臣樞密使金紫光祿大夫行尚書吏部侍郎檢校太傅中書門下平章事上柱國太原郡開國公食邑四千一百户食實封一千四百户贈太保中書令文康王公神道碑銘并序景祐元年秋八月壬戌樞密使同中書門下平章事王公薨于位􅊨天子震悼翌日臨其喪廢朝三日以太保中書令告其第命鴻臚內侍通治國喪事賻物恤孤卒用其加等禮官考行諡曰文康即以其年十月葬河南府河南縣洛苑鄉魏封原舉二夫人祔焉公諱曙字晦叔其先太原人始王氏居太原為著姓其後有徙西河者公之先君能傳其世系之所從實隋世文中子之弟績之後績號東皋子東皋而下間有儒者然不大顯亦未嘗去河汾經亂亡其譜不復貫敘故後世唯祖東皋子至公始葬先君河南今遂為河南人曽祖傑祖崇生兵間以義勇自許河東大將周德威聞其名召補禆校德威後帥燕軍以戰死失知巳功業不著以夀考終景純少客燕地感家世儒者不當用材武進乃南遊嵩洛得佐嵩談用之者為之友寖以文稱還太原至境上時劉氏方據其地嘆曰天下將定以區區一方支天下兵此危國也遂不入止上黨帥延致幕府府罷不復作吏購四方書或手抄之晚年書數千卷端拱中終京師及公之貴追榮三代曽祖太傅曽祖妣張氏韓國太夫人祖太師祖妣閻氏齊國太夫人考太師尚書令妣祁氏魯國太夫人公少舉進士淳化三年上第釋褐河南府鞏縣主簿再調定國軍節度推官咸平中天子用古科目者方開之士工部尚書趙公昌言舉公賢良方正試入等授著作佐郎出知明州定海縣代還為群牧判官賜五品服遷太常丞受詔修傳燈録判三司憑由勾簿司考發開封貢士坐失實出監廬州茶稅東封加恩遷博士通判陳州未至任詔還務修册府元龜以工部員外郎充龍圗閣待制賜三品服從汾陽遷工部郎中改右諌議大夫河北轉運使部吏受賕失事劾罷知夀州改淮南運使歸期勾當三班院糾察在京刑獄權開封府事加樞密直學士知益州坐開封府日保任祿吏犯法降授左司郎中尋復諌議大夫召為給事中兼太子賓客天禧三年同知禮部貢舉所詘士或倡言被抑無行者從而譁之不復辨狀降為諌議大夫俄復給事中同知通進銀臺司門下封駁事兼群牧使四年寇萊公被罪坐姻纍罷學士知汝州乾興元年猶以前坐責授郢州團練副使天聖元年起為光祿卿知襄州二年再知汝州四年復給事中知潞州六年遷工部侍郎知河南府移永興軍七年入為御史中丞兼理檢校七月以工部侍郎參知政事明道元年六月朝入殿奏復舊著為定制先是禮部尚書張公詠再守成都蜀人懷之以為後無繼者及公去遂有前張後王之諺其臨他郡則因其俗而治之施其術若無窮然使人愛之如蜀人為尤重獄訟無細大必精意處之上黨有殺人者公察情非是面訊其狀其人以為不得真殺人者已無免理卒不自明僚吏亦言不足疑公密以物色捕殺人者得之作辨獄記以戒理官前在西部有中人建議廣旁陵屋居僦之取利以薦園寢公上言神道尚靜今亟有興作牟細利為家人煩褻之薦非所以奉祖宗意于時近幸方用土木取功賞書奏皆憚其守正任中憲日屬玉清昭應宫災詔以衛卒及掌事者付臺劾火起狀時太后臨政謂公曰此人火非天災必戮守衛者公上疏曰昔魯桓僖宫災孔子以為御名僖親盡當毁者也漢遼東高廟及髙園便殿災董仲舒曰髙廟不當居遼東髙殿不當居陵旁故天災若謂此宫所建非應經義望以臣議下大臣苟不合故典籍請歸田里時議者或云官當廬未及對以疾還第即上章求解政仕七月授户部侍郎資政殿學士知陜州是冬改元推恩遷吏部二年夏徙知河陽秋再知河南府十一月被召加檢校太傅充樞密使明年七月加同中書門下平章事未幾痬發下乎浸淫以至大病享年七十二公幼得先公所聚書讀之至周官春秋尤極其義故為文章必本制度臨政長于斷事雖天性通悟發為事業迹其源流蓋有助焉景德中天子嘗命近臣修書時楊文公在翰林公止太常屬丞制以二公並命論者以材名等夷非復爵位差降也臨益部日會嵗飢衆心頗搖公曰往時蜀擾非有豪傑為倡先特以攘寇不息驅而合之浸大耳今欲制其前莫若禁盜於是嚴盜法犯者一切皆死出金榖募告者又俾爪牙吏摘其囊橐畫謀者久必就拘或示慘刑蜀人股栗嵗中遂無盜用然他法皆寬平詿誤多貸免嘗有卒夜告其軍將亂公覆狀立辨其偽斬之軍士皆感泣蜀舊以季春糴廩粟以濟民言利者增其直公抗修復大臣雖以財費不充沮之未有斥言不當建者及公援據經典辭頗切至上及太后皆感悟薄前守衛者罪修宫議亦寢明道中嵗旱公以成湯六事為言且云今一嵗四赦則政不節事也願深以五事為戒在河陽會遣使濟瀆祠醮公上言嶽瀆山川自非時祀請罷勿祀以息擾下之弊公坐萊公去京師十年天下有宰相望士大夫惜公且老懼不克相延企者久之及晚節登用雖以東宫之舊上雅意所屬然亦公議有在焉嘗以人臣患不節儉深自虧損在京師居第隘甚起居常一室中廏唯二馬食無重肉處之泰然蓋矯時之為也篤于朋友樂周其急治家甚嚴退居私庭諸子甥侄橫經侍席間命次子鼓瑟以自娛終嵗無絲竹之樂洛中營小園歸意甚壯末年恩禮愈極終不得謝有志勿就良足悲巳初夫人石氏平原郡君次夫人寇氏馮翊郡君子二人益恭虞部員外郎孝謹溫厚得其家法益柔右贊善大夫篤學好古善自樹立二孫慎言光祿寺丞慎行太常寺太祝女七人適校書郎陳勘將作監主簿趙士宗殿中丞孫瑜殿直楊舜臣唐州推官尹宗濟光祿寺丞張宗簡將作監主簿陳安石孫女四人並幼公母弟映試將作監主簿早世有子二人益謨左侍禁益沖將作監丞公所著文集四十卷兩漢詔義四十卷周書音訓十二卷唐書備問三卷群牧故事六卷莊子指歸三篇列子指歸一篇再使北虜作戴斗奏使録二卷公既葬二年虞部君泣謂某曰先君素慎密在中書樞府為上謀慮雖子孫莫得聞故嘉言密論無一傳者在任他官多用章疏論事命從子益沖書之益沖密留其藁今頗得存及諸行事皆世所睹者大懼失其傳子故吏當次之將刻石以示後世不敢讓以世系官閥總載之繫以銘云惟君御臣勿二勿疑知之厥艱惟臣事君曰進曰退處之惟難疇其知之公始庶士旅于外庭乃列從官乃賓東朝推先帝明逮今皇聖信之有初保之有終乃翊扆政乃冠內樞惟皇之聰疇其處之公在中歲官嘗下遷不勉而和匪畏而虔康常以堅亦既在位帝咨考成時唯典刑靡逸自居靡高自名竭忠以誠知臣處身匪厥艱難惟聖逮賢公實全德誦之刻之以永其傳河南先生文集卷之十二
