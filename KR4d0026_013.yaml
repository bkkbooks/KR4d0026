front:
  text: 河南先生文集卷之十三
  hash: sha256:fadfb0d1938238d92d7eda2a3c60ff78fe628ef2010b47f6d2f8f50c31f0bf8d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_013-1a}
body:
  text: 表碣述志銘故龍圖閣直學士朝散大夫尚書刑部郎中知河中軍府兼管內河堤勸農使駐泊軍馬公事護軍彭城郡開國伯食邑八百户食實封三百户賜紫金魚袋劉公墓表故將仕郎守河南府登封縣主簿兼尉衛君墓表故朝奉郎太子中含知漢州雒縣事騎都尉王君墓碣銘故王先生述故大中大夫尚書屯田郎中分司西京上柱國王公墓志銘故推誠保德功臣金紫光祿大夫守太子少傳致仕上柱國天水郡開國公食邑四千二百户食實封一千户趙公墓志銘故龍圖閣直學士朝散大夫尚書刑部郎中知河中軍府兼管內河堤勸農使駐泊軍馬公事護軍彭城郡開國伯食邑八百户食實封三百户賜紫金魚袋劉公墓表彭城公天聖七年四月薨於蒲後三年其子几葬公河南伊納鄉尹樊里又五年几以著作佐郎宰方城告於故吏尹某曰豫父晚節始得以諌議事先帝逮今天子初即位列放從官亮節直聲為時名臣然在朝廷不四五年淹恤外藩弗至大任是故道充於友朋而未被於民論議通古今或沮於當世平素藴蓄有所不伸潛德隱行暗曖弗彰大懼夫流風遺烈寖失其傳願揭石墓左以表之懇讓不克輒論其閥閲云公諱燁字耀卿咸平初中進士第歷河中臨晉開封封丘二主簿河南穎陽令遷著作郎監陜州商稅改著作郎知河中龍門縣通判益州天禧初擢為右正言於判三司勾院賜五品服三年以本官直集賢院同修起居注四年改右司諫換工部員外郎兼御史知雜事判流內銓五年賜三品服改三司户部副使乾興思轉刑部旋改吏部員外郎出為陜西轉運使未赴職奉使契丹還以本官充龍圖閣待制知三班院提舉諸司庫務天聖二年同知禮部貢舉權開封府三年遷刑部郎中充龍圖閣直學士知河南府五年徙河中府治河中凡二年年六十二公少為古文章篤於風義始舉進士與張景定交論道浤相師友初為龍門宰部有即盜欲人不忌命公領會事自補悉擒之公曰此劇盜也送府或有判叛去者且尉兵弱不廷留揖防皆命斬之一府服其果文康王公鎮蜀有以威暴上聞者會公自蜀召還對真宗問曰凌策王曙治狀何異耶公曰前凌策在蜀嵗豐少事得以平易治之比嵗小歉蜀人剽輕其心易搖故王以嚴刑制之然所誅殺特盜賊耳未嘗變陛下他法帝善之初為諫官屬嵗洊飢後河決東郡公上言歲歉不登力役屢起元元困苦道殍相望此宰相事也未聞有濟之之術願策焉以寒群望疏寢不報京師民間傳有靈泉飲者愈疾議建祥源觀詔初下公上言前世有傳聖水愈疾者皆誕妄不經今盛夏亢陽大興土木以營不急非也國事自上清宫建凡有興作皆準本符瑞以答天貺臣下罕有以土木沮議公右守正無所憚焉又抗論時政前後數十事今據其要者公以外官有衆之號而使窮民轉徙汙萊弗闢蓋考課即明吏職廢弛寖以及此昔邵信臣守南陽闢田三萬頃此實效也今守宰居位皆積日以幸遷非有意於民者宜申明考課法一切易殿最以督之又請禁民棄孝養而事浮圖老子者或受父母教及親亡者勿禁先帝世吏一受賂終身不見齒及天禧晚政稍被寬貸或復得進公請重其制纍赦勿原又公荒嵗入粟者止與上位虛名假之不足為將之制宜自乃右而上得與武臣奏補子弟為此吏部此制擇善吏為御史府主簿三司法官時有貴臣亦以親庸補其員公請罷之因言近臣封見不當為子弟乞恩以開幸進公以古之荐士受上賞今罪有從坐而賞不著非沮勸之道宜較其章著者推以恩典國家景德役分部置使總按刑獄公以為郡守皆朝廷臣轉運使巳專刺舉之職復置使按郡非所以責任守臣而息獄訟也當罷之河北平詔勞師臣建吏卒獨不及民公請蠲兩河嵗賦以寬之又建言黜章句篆刻之役崇尚學術復聘士之禮其章疏大較如此施行者蓋一二焉有唐故事拾遺補闕掌供奉諷諫得以廷論以事國朝授者或兼儒館或領外字專以充文雅材幹之臣非復曩時職事天禧詔書置諌官御史十二員者得公與肅簡魯公宗道二人為諌官凡所論列拜疏而已未嘗請對公援舉故事自是當得對遂為故事及遷司諌會論疏次刑獄事章不下固讓不拜翼日章報乃受命公厚於故舊始終無少間也王文康坐寇萊公責官朝士無往者公歎曰友朋之義獨廢於今世耶坐譴無愧矣乃出餞之雅愛處士李讀之為人讀終公陳其公退之行詔贈讀著作郎其敦篤如此在西京日有歸老之志求領留司御史臺不允比召還不詣闕願徙河中卒如其請難進易退有古君子之風焉公之先代郡人後魏孝文之遷都因徙家於洛陽十二代祖環鐫北齊中書侍郎環鐫生坦隋大理卿坦生政會唐武德功臣封渝國公政會生無意尚唐太宗女西平公主位至洪州刺史無意生奇為吏部侍郎天授中為酷吏所陷奇生護嘉令慎言慎言生河東令聚聚主祕書郎藻藻生蔡州刺史符符生洪洞令圭圭兄弟八人崇龜崇望最顯崇龜位至清海軍節度使崇望相昭宗至左僕射生大父贈太保諱嶽仕後唐終太常卿夫人趙氏封天水郡太夫人太常生烈考贈太保諱溫叟事皇朝終御史中丞夫人李氏封永樂郡太君公兩娶趙氏右贊善大夫朱之女今郡君有子七人長曰貺將作監主簿次即著作郎君次曰先將作監主簿次曰笆忱把兢亟太常寺太祝貺先早亡女二人長適大理評事王瑁琇次幼劉氏自中丞而上事備纍朝團書著作兄弟皆聞效有材稱著作又登進士第能世其家矣今世衣冠雖或前朝舊族然經級大槩離去舊邦不則爵命中絶譜牒散缺無如劉氏蟬聨盛大者又自渝公而下至今十世猶葬尹樊里此其尤異者也初公領貢部其洋奏名及為河南以椽史事公故著作君以家世之舊為請某撰述非工獨能不由遷以私於人用以傳信於後故敘先烈則詳其世數紀德美則載其行事稱論議則舉其章疏無溢言費辭以纍其實後之人欲見公德業當視於斯文為不誣矣景祐四年月日刻石故將仕郎守河南府登封縣主簿兼尉衛君墓表君諱景山字仲安魏郡南樂人後徙家河南纍舉進士不中第景祐元年西都復國子監學士共薦君得試國子主簿嵗餘改河中府士曹參軍仍在西監講書四年授伊陽府移登封主簿康定二年六月三日以疾卒年五十君少以辭章為人稱年十七舉進士魏郡首送之二十餘始來河南益自飭謹接朋友恭甚羣居論議默默若無所辭或從容與之謀即多所發明以是前輩知其讓已少年皆慕其為人交譽之無一異者晚節所守愈固通六經章句大義從之學者常數十人或與君評後進人物君雖賞鑒有輕重然多曲為之品目人譏其所收太廣後頗有成立者人更以此服之素為名公知遇説紫微以禮致之始主學事丞相沂公稱其行於朝因以入官焉父續祠部員外郎直史館有名於時母郭氏太原縣君娶王氏一男籍民九嵗一女十二嵗君卒後五十七日葬河南洛陽賢相鄉靖問里洛中士人告於豫曰衛先生葬宜有文以志其壙豫知仲安者是當為之志會日逮不克納其壙遂表於墓故朝奉郎太子中舍知漢州雒縣事騎都尉王君墓碣銘并序太子中舍王君以康定元年三月某日卒官二年十一月某日葬於河南府河南縣某鄉某里其孤尚恭尚哲謂某曰歐陽永叔既銘吾先君之壙願得文以揭於墓某與君逰最舊不敢以讓云君諱汲字師點其先京兆萬年人五代祖乃唐季為壁州刺史世亂不得歸遂葬果州西克州圖山下里人呼為壁公墓曽祖福事王蜀為其合州刺史祖某父某通經術皆以夀終君幼聰警善為辭章兄湛取進士第有稱於時君始來京師為廣文生數舉不得第湛纍官司封員外郎君用司封廕授將作監主簿調鄭州原武河南密縣主簿天聖八年詔舉郡諸曹縣主簿尉堪為縣令者公得以擢為澤州晉城縣令縣治在州下州有廣鋭軍選所牧馬旁郡會嵗飢縣民有亡田者軍士遂謗某田為牧地民既復馬當還故牧軍士以動力取強於民吏不能禁君至立辨於郡卒徙故地莫有犯者明道二年詔舉郡縣吏有治實者本路轉運使蘇耆以君名聞即召還改大理寺丞知京兆府藍田縣事遷太子中舍知陕州夏縣事縣近山頗為水患又城池久壞姦盜出入無限制君請於府築堤新城人皆便之移漢州雒縣會兩州大飢君率富室入粟數萬以濟貧民敕書褒論焉君為吏凡六更其治或為佐為長皆得以一縣盡其用精敏敢斷官有斂役未嘗以嚴期暴民事皆迎辦民或訴枉者雖嘗為郡理決者君必窮覆審究不以勢奪其守以是能庇其民為人平易胸中洞然無少隱與朋友遊有始終讀書惡異端尤不喜隂陽拘忌之説識者尚其通焉娶胡氏封安定縣君子三人尚恭尚哲同年取進士第皆賢而文尚辭舉進士五女長適殿中丞吳感次適殿直朱浙次適潞州屯留令楚建中次歸吾家子朴實其壻幼未嫁初司封葬河南君嘗語諸子異日當從吾兄及終遂奉其言銘曰生於蜀官於蜀又沒其地來葬河南實成君志九原可作從我伯氏子孫遂家以祖從世王先生述先生葬有日次子豫狀先生行事來告曰侍讀學士楊公既銘吾先君之墓先君知子子不可無述豫惟楊公與先生同年進士出處中外四十年知先生治行詳且實莫如楊公世人信其文亦莫如楊公豫若復次其事徒使人疑其傳故不敘其狀獨述豫之得於先生者慶曆四年即先生治蒲之二年豫自安化徙守平陽道蒲先生與豫語春秋因出唐志二十篇且曰此未嘗以示人先生於褒貶善惡之著者若無所指意其甚異者衆之所尚或詘之衆之所謝或嘉之豫亦疑其然先生為豫問其端質於大中之道考之於春秋無相戾者嗚呼先生所美唐善也所詘唐惡也於今曷避而不以示人蓋夫違衆之所識謂之虐反衆之所尚謂之隘舉世皆然惡得獨異而取危耶宜乎先生之不以示人也先生沒唐志且行於世觀其書然後見先生之志於時未嘗伸亦未嘗屈也後之知先生者其在唐志乎先生諱沿字某歷居大官在朝廷為名臣由樞密直學士為涇州觀察使涇原路經略安撫招討等使領兵貴重以其佐軍敗罷為郎復進天章閣待制慶曆四年十一月某日終於蒲葬用明年十月某日云故大中大夫尚書屯田郎中分司西京上柱國王公墓志銘并序公諱利字兼濟其先倉州著池人曽祖坑江州刺史祖演大府卿父承謙尚書庫部郎中母董氏漳南縣君葬河南伊闕今為河南人公淳化三年登進士第初調河南尉遷著作佐郎再為祕書丞太常博士入尚書省為屯田都官職方司員外郎轉屯田郎中官凡七遷始以陕府監稅歷通判聞溫滄定四州知絳州涇州改監并州倉得通判同州知河南之永安緱氏二邑總十一任以本官分司西京年七十二天聖四年八月十六日終於緱氏於明道二年十月二十九日葬洛陽大樊原不從於先君用吉卜也公加警悟昭為童授詩于故尚書右丞張公雍張公説詩博引經義聽者多所未究公于下坐重伸其説辭約理畼一坐聳然初命河南會憸人趙贊領務于洛贊招權樹威趨時者望塵迎謁惟公與之抗贊不勝其憤它日坐衢中以職事呼公欲衆辱之公莊色正辭贊不能屈留守吕公聞而深器之在滄州日閲其獄有羣盜當就死公察其氣貌曰是非作惡者密訊之頗得其寃狀公命稽其刑且大索境內不數日盡得真盜賴免者數人又嘗遣三卒至都下二人者共害一卒取其齊裝反以其人逃狀聞公疑其姦遣吏李密者自郡至都以物色求之得其實二人即伏罪其精審皆此類定州民居雜戎落附鄉籍者至寡公招捸撫集歲益萬餘家凡為政清簡時與賓朋宴樂不求敫察之譽故所至皆便其治及去郡吏民千里候問歲時不絶其見愛若此雅善談謔有醖籍外為和易而內甚介時親舊處任柄未嘗一造其門再絀皆非罪一以河決一坐失舉幕屬留滯者纍嵗處之恬然晚節以歌詩自娛有集十卷私帛室不以槩意暨疾語諸子曰嘗聞之先君我家自隋世為顯族處環衛方鎮者相繼不絶惟未嘗與文翰為從官因亂譜諜散去恐後世遂已其傳因命筆授之其意欲諸子以文自進也娶李氏封隆平縣君撫養宗屬有家法三男長鼎進士第大理寺丞友震洛陽主簿次復舉進士三女長適試將作監主簿張師雄先公而亡次適耀州華原令楊建令用次適太子中舍孫長卿孫男四人夾仲虞仲子仲南仲女四人並幼銘曰王氏世以材武吏幹稱及公始用儒術進而位不大諸子益以文自力王氏其顯乎故推誠保德功臣金紫光祿大夫守太子少傅致仕上柱國天水郡開國公食邑四千二百户食實封一千户趙公墓志銘并序公諱稹字表微單父人少好學持心固堅得章句義輒早夜以思不少懈猶自以不足乃之四方從賢俊遊喜為文辭卒以勤成其業年二十六舉進士一上中第授平定軍判官再調台州軍事推官薦其行能者數十人除大理寺丞知蘇州崑山縣通判楚州遷殿中丞知通州召歸同判宗正寺賜五品服樞密直學士公濬薦公端厚可任以事擢為監察御史由殿中侍御史遷侍鼓院開封府判官判三司開折司車駕西祀為東京留守推官咸以持法謹重為人稱大中祥符五年遷兵部員外郎益州路轉運使賜三品服入謝真宗顧曰天下久平然郡縣事朕宜聞蜀最逺民富侈吏易以擾是尤欲聞者卿朴忠當無少隱凡事有更置者具録納意無敘名位附常所奏章以來以為卿行之公至部事無細大悉心以諫至有一日章數上皆優褒焉卭州蒲江劫盜不得反繫平民十餘人掠笞威使強服又合其辭若無可疑者公行部意其自誣馳入縣獄考狀盡得其寃即出之置縣吏於法雲南蠻擾焚盧州淯井監詔發兵誅之器械糧餉皆速辦事寧以勞遷工部郎中代還兼侍御史知雜事同判流內銓奉詔詳定民吏負害之物稽民者公審其無欺秋考盡除之改三司鹽鐵副使天禧二年成都守當代宰相剖上近臣名三四皆不稱旨或舉公姓名帝曰趙某固可用擢為右諌議大夫充集賢院學士知益州度文市館六千公召工較其日力嵗正千餘匹乃以千數上供焉就移知同州遷左諌議大夫給事以徙鳳翔京兆二府使契丹還遷工部侍郎加樞密直學士知并州進刑部侍郎上雅知公為先帝所信任且倚耆德為朝廷重乃拜樞密副使明道元年進吏部二年拜尚書左丞知河中府景佑四年拜吏部尚書五年以疾請老九月拜太子少傅致仕十一月一日薨於河中年七十六公性篤厚與人語言必誠盡無一外飾雖年位尊顯不自為貴士子賤微者皆與之鈞禮為政尚寬凡處事要其歸不害於禮而未嘗立異見以名已功用是天子器之以為可任大事在臣者交稱其篤厚焉夫公之先世以儒名其家然無顯者及公之貴曾祖賡贈太保曾祖妣劉氏追封京兆郡太夫人祖修已贈太傅祖妣朱氏追封河南郡太夫人考晟贈太師妣孫氏追封洛陽郡太夫人娶田氏封京兆郡君先以亡子男七人士安士宗士寧士宏士宇士宣士賓俱以蔭補官士安士宗士宇士宣皆早亡士寧今為太子右贊善大夫士宏大理寺事士賓祕書省校書郎女六人長適職方員外郎朝宗次適祕書省校書郎袁次適朝氏次適大理評事李南仲次適祕書丞梁堅次適右班殿直朱融今存惟朝氏李氏婦孫男二人仲達太常寺太祝仲達奉禮郎孫女八人皆適士族公薨年十二月嗣子奉公之喪葬河南萬安山之原自初薨凡三十九日而葬葬速故贈諡之典未及焉銘曰孤卿六官百工之式公實職之天子萬機百官是維公實毗之五福之厚既德而夀公實有之萬安之隂考龜已定公實命之既封而崇既固而完公其安之河南先生文集卷之十三
