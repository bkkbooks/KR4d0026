front:
  text: 河南先生文集卷之十四
  hash: sha256:af8c24563d6ac5a441f7f0d1cb586975ff6766593dfacb67407abff9aae8dfb2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_014-1a}
body:
  text: 志銘故三班奉職尹府君墓志銘故將作監主簿陳君墓志銘故永安縣君李氏墓志銘故夫人王氏墓志銘故鄉貢進士謝君墓志銘故朝奉郎行許州陽翟令贈太常博士趙君墓志銘故供僃庫使銀青光祿大夫檢校尚書兼御史大夫知霸州軍州兼管內勸農事上騎都尉南陽郡開國公食邑三千八百户張公墓志銘故朝散大夫尚書刑部郎中直昭文館上柱國賜紫金魚袋陳公墓志銘故三班奉職尹府君墓志銘并序先君先夫人之第三子名湘字巨川年二十有四天聖五年五月九日以疾卒景祐五年十一月二十八日葬河南夀安仲兄洙泣而志其壙曰巨川少豫三嵗幼同遊嬉稍長俱就師起居食飲無一異然豫好論議古今往往與先生辨是非巨川獨喜靜不參一言人皆材豫以謹厚名巨川年十七由大父廕得官初榷偃師酒又掌衛州牧馬與豫别三年豫在京師巨川以疾來告遽往已不克見他日視篋中得手抄歷代史及兵家書總數百卷及觀所見邊事欲國家變五代襄制籍兵於農以紓用又以西北帶邊凡百餘堡戍兵寡敵至不足為捍防不若省堡戍增屯要害如唐三受降城天德軍之比其言深切而著明其大要若此嗚呼名弟謹厚則信矣觀其材又能以重持之豫何及哉豫何及哉先君先夫人諱氏官封已載墓表娶木氏一男一女木氏及女後巨川一年皆卒男名材謹慤不三氏葬此而後異其域弟之葬得與先君同域在地之丙周術之云故將作監主簿陳君墓志銘并序陳君名賡字仲雍鄴郡安陽人舉進士纍上不中第自試其業曰始吾好夷吾書通其變能使國以富強期少用于世以盡其術念非進士無以進今數絀年且衰所藴蓄訖將不用其施吾家遂罷舉専治生業是時君母夫人在兄貫始有位于朝賴君奉養日益充其治生用術至精年豐凶與物上下斂散急緩皆有宜日不為汲汲嵗較之則大有餘用是鄉里稱其長者以兄廕得試將作監主簿明道二年七月十八日以疾終于家年六十父芳贈尚書刑部郎中母解氏封福建縣太君娶劉氏溫州防禦使平之女弟和順能持其家法後君二年卒生六男安仁安世安國安上安靜安民一女尚幼安仁由世父廕補太廟齊郎安世試將作監主簿餘皆舉進士兄貫今為刑部郎中直昭文館君以景祐五年正月二十三日葬于河陽太平鄉北門里先君之墓以夫人祔焉銘曰賢者以道進退無失得其次尚功名以術濟其用不則施其家以仁其宗要其歸異夫獨善者是不以無用廢有用乎故永安縣君李氏墓志銘并序夫人姓李氏濮陽人父獲纍贈尚書令母劉氏追封齊國太夫人李氏世衣冠積産甚厚諸女雖幼皆預為嫁具禮器服必以稱及夫人笄仲兄今徐州丞相由進士貢數不中第資少衰夫人持奩中物盡內於丞相曰兄以義氣為鄉里重寒士頗仰給此以濟兄用丞相竒其識隂擇節士為之配是時丞相與鄴郡陳公交甚歡俱以名稱京師景德中同年又科第夫人遂歸陳公陳氏官州縣十餘年丞相位通顯夫人未嘗以兄勢卑其夫族事先夫人能勤禮自待承顔下色無小怠先夫人年過八十多病食飲起居須夫人乃安陳公祿既豐或勸夫人厚玩服以自貴重夫人曰始吾生大家嘗以約自守及從吾夫為小官浣衣粒食裁自充然吾夫人不以貧自病者以吾安於約故也奈何敗吾素守耶夫人通釋氏書性慈恕不妄語言授封永安縣君以某年某月日終於河內武陟之私第年四十四生子五人安石安定俱以廕補官女四人適某人公名貫會為刑部郎中直昭文館景祐五年正月庚申葬夫人於河陽太平鄉北闕里安石與豫善求文志其墓壙銘曰不以財自私或失以侈能以約自持或病以嗇兼二者而無譏君子之難矧在婦惠夫進以顯子多而才雖奪之年孰為大哉故夫人王氏墓志銘并記夫人故樞密使丞相王文康公之第七女年十七嫁將作監主簿陳安石五年五月十二日以病終實寶元元年五月明年二月二日葬於河陽太平鄉北闕里夫人在丞相子為最幼尤為家人所敬重既笄以大臣女賜冠服嵗時得朝見中宫性至孝居丞相喪號呼不食中外姻族來弔者相與為寬辭以譬之夫人毁頓無生意弔者莫忍視更為之致哀夫人持法自約始終無違其容止皆充其德焉安石鄴郡冠族父貫今為尚書郎守本郡安石及夫人之兄益柔皆與豫遊道夫人行實俾豫次之繫之以銘曰孝本乎性推之為仁睦於夫氏由乎事親年弗與俱嗚呼夫人故鄉貢進士謝君墓志銘君諱昌言字仲謨其先太原人父某贈大理評事始家河南為大族君少好學屬文深沉有局量與人交不喜評論其短長然於賢已者必加厚焉舉止藴藉雖飲酒至醉猶不少失法度士君子與里閭小人俱以謹重目之故王丞相隋微時嘗依君家及其貴用以恩欲酬以官親黨咸勸當益自附結君不甚屈官亦終不及四由進士貢不得第以景祐元年三月某日終於家母孫氏追贈永安縣太君初娶王氏繼室傅氏故忠武軍節度使潛之孫二子良臣良弼並舉進士女二一嫁太廟齊郎通一尚幼寶元二年月日二子奉君之喪葬於北邙之原君母兄昌齡今官五品故先夫人皆得追命焉君之伯君先姊實洙之大母君於洙大父之行也又嘗皆舉進士同硯席故詳其為人銘曰溫溫其淳矯矯其莊守學而固秉德而嘗在家之聞實士之良葬從先君刻此銘章既寧既堅以永其藏故朝奉郎行許州陽翟縣令贈太常博士趙公墓志銘并序公姓趙氏諱字幽州良鄉人祖父世以儒衣冠遇亂無顯者幽州陷虜二年公始生幼而孤鄉里少年率從虜教馳騁田獵頗以材勇自奮公獨褒衣從先生遊讀書泛通大義馳射亦過人然不以能自名故得以文史進母嘗疾癰其呼聲不絶公吮其潰毒痛即少止母慮傷其意後頗隱其狀公視母色戚泣而吮焉數從虜師掌文記得本縣主簿又為飛狐尉遷蔚州靈丘令雍熙中王師至其地得歸京師授河南偃師令纍調江陵岐山義烏陽翟四令公性剛明尚義節其為吏遇事敢決無留獄所至以強辨稱在江陵遇蜀李順亂轉兵食自峽而上為羣吏先使者以狀聞制書褒諭罷陽翟歸偃師家居舊制縣令過七十居其官請老者得以東宫官致仕以是時年六十九居其官請老家人以精力尚強勸其再調一邑以五品還家公曰吾量力而止豈以虛名自役乎乃以疾請後十五年年八十四終於家夫人劉氏慈明有賢行後公十七年而終四子偕企及布一女適進士張康世孫六人友文尚文子文溫文秀文懿文公之退居也命偕主家政及舉進士公在及已登科兩佐使幕會為殿中侍御史再贈公為太常博士夫人授封夀安縣太君之喪偕企無存者御嗣子考吉卜葬公河南洛陽邙山北原夀安君祔焉銘曰猗歟令人孝哉其淳厥艱在初和而不汙有美其終恬乎其充邙山之地茲焉寧體祭以大夫公卒有子故供備庫使銀青光祿大夫檢校尚書兼御史大夫知霸州軍州兼管內勸農事上騎都尉南陽郡國開公食邑三千八百戶張公墓志銘公諱顯忠字盡節其先樂陵人祖奉超為橫海軍大將顯名軍中父延斌國初以材武積功為捧日左廂都指揮使富州團練使贈左武衛大將軍公幼明慧語言拜起如成人七嵗得見太宗皇帝留邸及即位給事殿省補殿直供奉官皆以寄班冠其官稱汝隂有龍騎卒叛為盜命公捕之方合鬪為流矢所中拔去矢鏃摶衆益進遂破其黨以功遷內殿崇班自是凡七遷由內殿承制歷禮賔東染院西京左藏庫洛苑文思五副使至供備庫使其所任之職即全邵七州饒信等州都檢校使泗州天雄軍駐泊都監江淮都大提舉捉賊提點河東路刑獄公事再為西京水南巡檢知嵐憲霸三州事最後知霸州天聖九年十一月九日以疾終於任年六十公性重慎寡言雍熙後數奉使四方是時太宗皇帝喜詢外事凡內臣使還見便坐與語移刻或以應對敏給亟被恩寵妄者頗托細微事期以中傷人公止以所使事上聞他無一言僚輩皆稱其長者然用是官亦稀遷天聖六年再為西京巡檢時莊獻明肅太后猶臨朝公因入辭自陳開寶末以童子入侍當時晉寺舊人今無居位者兩宫惻然問其官尚諸司副使遂命以正使授之公出入省闥暨領州任逾五十年唯此命及汝隂以功升他皆用嵗勞或以例遷公泊然自守未嘗有冒進怠為政尚寬易所至民宜其治御家有法撫踈屬皆以恩知者尚其為人母安氏追封河內縣太君娶郭氏封太原縣君後公一年而終二子長正臣左班殿直卒次正守右侍禁三女長適供奉官閣門祗候王宗慶次適前并州司法參軍議汝賢次適供備庫副使彭再問孫三人長舉三班奉職次凖次尚幼寶元二年十月二十七日長孫舉奉公及太原君之喪葬於洛陽北邙山大樊原銘曰幼明而遇壯中而奮孝升其族政試於郡持身以莊秉心惟慎爰初暨終弗顛弗進葬洛之陽兮考卜其順後世以嗣兮不隕令問故朝散大夫尚書刑部郎中直昭文館上柱國賜紫金魚袋陳公墓志銘公諱貫字仲通其先鄴郡安陽人父芳葬河陽今為河陽人景德二年中進士第纍調杭州臨安秀州嘉興二主簿懷州河內令用知已薦授祕書省著作佐郎刑部詳覆官歷祕書丞太常博士為審刑詳議官監左藏庫判河南府知衛州事入尚書省為屯田度支兵部三員外郎知涇州事移利州路轉運使又為陕西河北河東三路轉運使三司鹽鐡判官由河東入為三司户部副使遷鹽鐡副使景祐四年授刑部郎中直昭文館知相州事寶元二年罷州還過河陽寢疾以十一月二日終於家年七十二公少倜儻有異節通孫吳諸兵法喜議邊事咸平中大將楊瓊王榮喪師公詣闕上言前日不斬傅潛張昭允使瓊輩畏死敵而不威陛下法今不更其制後當益弛宜著令凡合戰而奔者大校悉戮之大將戰死禆將無傷而還與奔軍同軍衄城圍别部力足救而不救者以逗遛論執政以瓊輩已即罪議遂格又論形勢選將練卒三篇皆上之其形勢篇論兵法地有六害今北邊既失古北之險然自威虜城東距海三百里其地沮澤墝埆所謂天隙非虜勢能入由威虜西極狼山不百里地廣平利馳突此必爭之地凡爭利之地先居則逸後趨則勞宜有以待之其選將篇昔李漢超守瀛州虜不敢犯關南尺寸地今將帥大槩用恩澤進雖以謹厚取信然卒與敵遇不知所以為方略故虜勢益張兵折於外者二十年此選將得失之故也其練卒篇論國家收天下材勇以僃禁旅皆賴賜與恬休息久不知戰鬪事當以衛京師不當以戍邊莫若募其土人隸之大小軍又藉丁民為府兵使北兵扞狄西兵扞戎不獨審練敵情習熟地形且皆樂戰鬪無驕心及北方請盟公復上言虜數犯塞驅掠民數十萬今乘其初通宜出內府金帛以購之虜嗜利必歸吾民自河之北戴德澤為無窮矣公既舉進士廷中唱第得同出身上顧其姓名曰是數上邊事者擢賜第二等及第公為吏尚嚴明持法不私所臨州姦慝無所貸嫉盜賊為最甚涇州有惡少輩畏公嚴相與為恐惟言期不敢犯及公遷去其父老遮道流涕曰願公留三載使不肖子久公化得終為善良其領財賦校簿籍有毫釐蔽欺必窮治之常曰吏視官物如已物庸非忠乎在利州遇嵗飢蓋以職田穀以賑民民有積穀以覬利者皆令自占其數計口以留其領餘盡發之所濟萬餘人制書褒諭在陜西議罷塞上堡柵孤逺不足為鎮守者在河北請決徐鮑曹易四水以興屯田詔皆訓其利害焉靈夏之違命也公慨然曰吾四十年為國家論邊事會天下久承平謀説之不用今老且病忠力不效豈非命耶乃抗疏以為凡料敵勢患老大入而幸其不來者皆不足以計議大今所守之塞地敢董阻非弱戰之引若其驟至並客體異設伏出奇則勝勢在我如虜不大入徒以遊兵擾吾邊候則當益修守備師無還期財殫民勞其患滋大為今之策宜誘之以利激之使怒軍法善戰者制人不制於人能使敵自至者利之也其文千餘言大抵類此又嘗著兵略十卷識者悲其志焉公之在朝先君得以大理寺丞致仕纍贈光祿少卿母夫人解氏封福昌縣太君夫人李氏兖州丞相之妹封永安縣君男子五人安石安守安期安道安禮安石安道皆將作監主簿之官安定河南登封尉而安期安禮俱皆太廟齊郎也有女四人適殿中侍御史文彥博大理評事浦延熙將作監丞扈章一尚幼其年二月二十二日嗣子奉公之喪葬於河陽太平鄉北閻里永安君相焉而銘之曰逹於事不疑其用明之至盡其忠不隱於上誠之至壯嵗議邊白首益厲不以不試詘其言不以踈逺易其志推公此心豈専功名蓋以治國未能去兵故兆謀於事先慮危於久平壯哉遺文其沒猶生得非於用明而於上誠者哉河南先生文集卷之十四
