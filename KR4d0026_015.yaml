body:
  text: 志銘故天水尹府君墓志銘故福建路勸農使兼提點刑獄公事朝奉郎尚書主客員外郎上輕車都尉耿公墓志銘故宣德郎守大理寺丞皮君墓志銘故夫人黃氏墓志銘故永淸軍節度推官宣德郎試大理評事知河南府澠池縣事候君墓志銘故贈太常博士致仕何君墓志銘故贈祕書丞左君墓志銘故金紫光祿大夫檢校右散騎常侍降授右監門衛將軍持節惠州諸軍事惠州剌史兼御史大夫輕車都尉隴西郡開國侯食邑一千七百户李公墓志銘故天水尹府君墓志銘并序公諱節字守約其先代北人大父暉事後唐為清泰功臣嘗以節帥彰國軍普初以忠於舊君遇故人景延廣匿其三子君父其中子也得亡太原及劉氏據其地以材勇隸帳下為禆校乾德初劉氏大將有欲其地內屬者謀覺牽聫坐死君尚幼得小校張謙者持養數年歸於叔父讓讓為岢風軍使君往來河西以騎射名軍中從父兄繼倫立功河朔君往依之補衙內都虞候將奏以官有善相者謂曰君名一職即死不則逼五十為豈家時相者言他事屢中君決信不復意仕繼倫卒始來河南因家焉君性剛決少長兵間樂散施以義氣自許與人遊處勤懇持規規矩卑意謹甚以是當世貴人多與之接年五十六某年某月以疾終於家始景氏所匿其長勳後貴顯繼倫其嗣也李即岢嵐軍使準君父亡他國與兄弟絶故闕其名君其郭氏治家訓子甚慈而法後君若干年而卒生伍子宗溥宗禮宗濟宗泳宗源宗溥宗禮皆早亡宗濟唐州團練推官宗泳給事政府宗源三班借職女三人長適尤氏次不嫁俱亡孫七人仲堪業進士仲芳太廟齋郎餘並幼景祐五年四月三十日諸子奉君及郭夫人之喪合葬於河南太尉鄉萬安山之原唐州從事君以志文為請初豫在樞密王丞相府從事君其壻也與之為有舊後豫親之喪在外從事君助豫奉之以歸是嘗德且舊於其親之葬是宜為之銘銘曰嗚呼君之先或蹈大義或陷危國家再覆而嗣卒以存其艱甚哉及君之葬子孫寖以仕自進以興其家豈前史所謂有隂德者歟故福建路勸農使兼提點刑獄公事朝奉郎尚書主客員外郎上輕車都尉耿公墓志銘并序公諱充從字徽之曾祖正祖思唐皆明經術居鄉以行稱父昭化始以通春秋傳取髙第為蜀州司戶參軍蜀盜起城破被擒賊將汚以官儕輩莫敢拒司户獨叱之且大罵至斷手足死不屈天子嘉之録其後公得同學究出身纍調莫州任丘尉兾州司理參軍會契丹入冦公率城中豪賈輸軍用下民被兵皆制次朝會及條理獄事與法力辨刑章常以議直取勝轉運使劉公綜強力自任於吏事少所推與獨器公才就薦天雄軍節度推官磁州民有競曰者逮繫百餘人纍欣莫能決俾公按其事得實附曲者咸坐之既出無一異語知天雄軍王公承衍屢以功狀稱於朝授大理寺丞擢知開封長垣縣事天子東封泰山以置頓之勤就移通判利州事歷太子洗馬殿中丞國子博士通判濟州知鄭州事天禧中河決東郡詔環決河千里調芻桔輸致之時河南諸郡久無調發之勞詔暴下吏持之嚴民相驚動有自相驚動決死者公視賦版均其斂無毫釐過繆或資表於故者強之勝者增也且威信素著史蓄縮承風旨民亦莫敢自欺郡中肅然事迎以集是時河陽孫公奭為政尚寬惠而公以嚴明稱安撫使劉公燁使還各以其績狀聞真宗顧曰使天下之郡守皆如二臣何憂致治耶劉公因言公位卑宜奬任之於是擢為福建路勸農使兼提點刑獄公事遷尚書主客員外郎行部至河州感瘴癘歸以天禧五年終於福州之官署年四十三公少孤無兄弟事母甚謹故知雜御史王公濟以為常山通守一見以器幹許之遂以女歸焉及居官廉直果斷不避貴勢所至無留事卒以能稱其為人尚義節好施與有燕趙遺風初公既位於朝再贈司户君為太子中允夫人辛氏追入永樂縣太君王夫人封太原縣君夫人未嘗內食密使諜者訪其母兄十餘年散父資數百萬卒得母歸宗黨伏其孝二男長傳將作監丞次知節早亡二女長早卒次適緱氏主簿髙鼎寶元二年十月二十七日監丞君奉公及夫人之喪葬於河南緱氏唐興鄉解賈村之南原銘曰嗚呼朔野之氣節士之裔稟乎徑剛承厥志毅騁才而聞秉直而遂胡嗇其年弗克其志葬於河之南得子龜筮不殞家聲在公之嗣者也故宣德郎守大理寺丞纍贈司封員外郎皮公墓志銘并序公諱子良字漢公其先襄陽人曽祖日休避廣明之難徙籍會稽及錢氏王其地遂依之官太常博士贈禮部尚書祖光業佐吳越國為其丞相父粲元帥府判官歸朝歷鴻臚少卿公初能屬辭淳化中以家集上獻初尚書以文章取重於咸通乾符世降及丞相鴻臚皆以文雄江東三世俱有編集總百卷餘至是悉以奉御得召試對便坐賜出身歷汾州介休并州榆次三縣主簿時靈夏用師仍嵗饋挽公當督其行不以嚴期暴民事亦以濟遷饒州録事參軍無為軍巢縣令用知已薦授大理寺丞監筠州酒稅大中祥符七年正月二十五日以疾終於任年五十三公為吏尚寬平不煩教條所至民宜其治去必見思世為吳越顯族樂散施晚年窮匱仰俸入裁自充然均給踈屬終不少懈知者嘉其孝友夫人管氏賢明有法度二男長鏑早亡次仲客今為太常博士三女適曹經宿洪之張奎皆士人二孫公理公髙並幼上籍田嵗公以子五品得以某官若其第夫人封夀安縣太君明年太君以疾終寶元二年十月二十七日太博奉公之葬河南永安縣某鄉某里夀安縣君祔焉銘曰皮氏擅名厥初襄陽後家於南再世以昌公事本朝其舊邦才奮而通命艱弗充公葬惟河南是成公志公有令子既孝既禮遂家河南為子孫始故夫人黃氏墓志銘河南樂泳來致其父水部君書且自言曰泳母以賢行稱外氏以暨我家不幸早世不及封號以沒藁殯者三十年今葬有日敢因父書求文以志於壙豫不得讓夫人姓黃氏世衣冠父慶長司勳員外郎母王氏新泰縣君夫人年二十一為水部配四十二以疾終興元之南鄭寶元二年正月六日葬河南永安唐興鄉雙塔里樂氏自水部君之大父贈兵部侍郎諱史以文章為通儒其後世有顯人遂為河南大族夫人居世次為冡婦性寬裕言語動作為諸女法雖僮侍未嘗聞其厲辭通音律樂施與宗族踈近交稱其德生四子滋進士中第今為著作佐郎浚早卒泳沖皆舉進士二女長適供奉官馮維禹次適太廟齋郎麻公授水部君名許國以材能為尚書水部員外郎其銘曰婦道治內潛德弗章有子而才乃顯其光刻石墓門圗徽不忘故永清軍節度推官宣德郎試大理評事知河南府澠池縣事侯君墓志銘并序君諱詠字可復其先西河人祖益事後唐武皇起太原軍中從莊宗定河南為中興功臣歷晉漢領兵鎮位至中書令以太子太師還第國初疾薨葬河南遂為河南人父仁浦舉進士早卒君少由進士貢一上不中第用門資得試將作監主簿調處州遂昌尉不赴官歷河中府河東孟州河隂二主簿遷虢州録事參軍郡豪州趙室者殺人誣其庸使代死且賄吏以成其獄君辨狀立出之改武信軍節度推官知河南府夀安縣事秩滿集吏部與濟輩見便坐有詔循一資吏部調君入蜀君永還所循質以侍親遂復以節度推官知大名府冠氏縣事又徙河南澠池明道二年八月十三日以疾終於任所年五十君生公侯家雖見全盛時然後昆弟或陪無錫封連姻王家尚有古時餘風君獨喜儒術與寒士同趨向私室用度委於家史匱豐無所省晚節資益衰處之自若與人交淡然其久愈固持論議不為貴勢屈知者尚其節初先君既終五月君始生母康氏普州刺史延澤之女明逹人也教育以暨成立而君不克終養斯可悲已娶吳氏屯田員外郎祐之之女生二男紹曽紹復皆以廕補官一女嫁王繹寶元二年九月丙午嗣子奉君之喪從葬緱氏原紹曽與豫善狀君閥閲俾志於壙且為之銘曰太師維祖父武功特起肇開厥家膺受繁祉降及禰廟祭以士禮君舊在初乃試於吏既恬乎中亦逺其志晚而益艱終則弗遂緱氏之原祔於先子誰復其始宜君之嗣故太常博士致仕何君墓志銘君諱某字某其先京兆咸陽人祖諱朗左司禦率府率葬河南新安遂為河南人考諱曮周顯德上年進士第二人終著作佐郎集賢校理有名於時贈某官母髙氏追封以縣太君君三嵗而孤養於外氏能自樹立三十始舉進士五上得同進士出身受議州司理參軍再調開封祥符尉遷果東州團練州官又歷鳯翔彭州河中永興四幕最然居以永興軍節度判官兵考除太常博士致仕還洛七年年八十三康定二年六月六日終於家君性慈善談笑喜人和同然持身奉法不為強屈嘗與上官爭辨殺人獄終出之後得劫者衆益伏掌州庾吏襲故迹欲上下通為姦利憚君初至未有以致其賂以乃匿名書求君黜聰明并以金帛投於廨垣君曰是必某吏所為捕送之伏罪君廉益以聞前後薦其行能者數十人至用選部循資格增廩祿而已流輩或驟為時用君聞之更有喜色及退居無分産以自資恬然不以歉其心體強無疾一日呼嗣子命以終制語頗詳悉起居猶平常自是三日而終即以明年四月某日葬於新安縣某鄉某里凡三娶兩李氏早亡向氏侍中拱之女封某縣君一子令孫舉進士禮部嘗奏名孝謹有才稱四女適盧賁李宗孟皆明經宗世賢舉進士王宗諤為三班借職銘曰進而窒性焉益通處而貧心焉自充仁者固得其夀君子不謂之窮以勤為養以禮送終君實有子世其清風故贈祕書丞左君墓志銘康定二年八月日屯田員外郎知華州事河南左君得告於朝來葬其先君於河南緱氏縣唐興鄉解賈里先事告同郡尹某曰豫始孩先君教以經藝寖為辭章夙夜以戒曰汝進於學齒於鄉士其以衣冠名吾家先君既沒三年豫取進士第又五年始有位於朝先君凡再追命為祕書丞自沒距今十受有九年始得用五品禮葬庶幾以卒先志悲乎不及見豫之有成也請豫志其墓君諱某字某其先自河中徙家河南為大族其交結皆當世豪傑貴人及君乃折節厲學所依多賢士大夫信讓寬厚為里中稱譽舉進士一不偶終於家年四十父諱欽母張氏凡三娶二王氏繼以韓氏兩王夫人各以福昌永寧太君告第皆祔於君韓氏夫人今以萬年受封君六子長瑛及第四子未名早亡屯田君名瑋實第二子次珙玘琰孫子六人俱皆幼未名銘曰富而學不及以位子而才不逮其任追命既告朝服以禭養不克兮葬則備方磁刻兮孝子志故金紫光祿大夫檢校右散騎常侍降授右監門衛將軍持節惠州諸軍事惠州刺史兼御史大夫輕車都尉隴西郡開國侯食邑一千七百户李公墓志銘并序公諱渴字師望其先西河人從祖顔郡為周廣順功臣祖勳始家河陽終右監門衛將軍贈左驍衛將軍考遜終北部員外郎贈工部尚書妣杜氏追封馮翊縣太君公少舉進士景德二年中第授許州臨頴縣主簿歷杭州仁和開封府陽武二尉皆以才能稱用知已薦除大理寺丞知華州華隂縣事移蜀州江原遷殿中丞乾興例恩遷太常博士先是河決東郡歷嵗未平公以治河十策為獻曾參知政事魯公宗道奉詔行河即奏同至東郡時言水利害者甚衆魯公獨是公策即換北作坊副使充修河都監樞密院有不快魯公者托公所議與衆不合不復辨曲直罷為鄆州兵馬都監移知憲州又移鳯州階成二州接邊頗有內屬之户故鳯得以戎事制階成猶支郡前此屬户攻陷階州之沙灘寨公至郡馳請其所究治叛狀實司牧都校趙釗者擾知公即譴釗道州諭以恩信酋帥皆欵服修復故壘種落遂定以功遷軍器庫副使知原州事不滿嵗改環州遷香藥庫使公緣治河至是凡十年不得至京師天聖八年召歸奉使契丹始得對便殿陳畫邊事天子材之使還知慶州事明道三年詔近臣舉勇略在邊者公為樞密直學士李公咨所薦尋加惠州刺史益州路兵馬鈐轄是冬改元遷東八作使明年擢為西上閣門使旋改鄜延路兵馬鈐轄鄜延屬亡北他路為最強多寵以右職要官部下恣誅殺敢為不法異時主兵者頗務姑息或利其善焉求取無厭公至凡至饋獻一不納罪者繩以漢刑皆樂公之不擾然畏憚莫得自恣焉秩滿知延州郭公勸美公鎮靜之績奏留再其任又條其勞狀於政肅言甚切至詔就遷東上閣門使旋改四方館使始趙德明內附先帝與之約令其入貢京師道必從鄜延文卷非鄜延不得自是文牒往返如鄰州元昊祈襲爵上公即帥鄜延兵元昊雖桀驁嘗擾環慶戎落落然歸罷别種以為辭公為報不與之辨齊宗矩以慶州之兵敗於節義烽為虜所得公以文諭之虜即以宗矩來還朝廷亦不發其罪寶元元年元昊大將山遇者率其族三十餘人來歸且言元昊不軌狀公與郭公議曰元昊猖獗之志由宗矩敗益彰非待山遇發也自德明納貢四十年其長內附者未嘗納之國家於德明父子撫愛哺養如嬰兒豈有毫髮負者哉今若納其亡人使其取直以為稱是中國大信之子含容之德由吾輩所虧損也即命境上絶之其年冬有郊輸不至年二月遺其黨稱所置偽官以乘公即拘其人於館亟以事聞且閲其表函猶稱臣以冠其名公即與郭公議奏以夷狄僣中國名號誠不順然尚稱臣可漸以禮屈願與大臣熟議天子方命帥臣經略事所奏忤旨前此就移兼領鄜州至是降授尚食使知汝州事數月移磁州明年有上書訟公前絶山遇事者又降為右監門將軍白州兵馬都監久之寢疾語諸子曰吾在西邊十餘年雖以罪去猶願一見上陳當今制虜之宜死且不恨今不幸遂塞而不伸乎以康定二年四月一日終於官年六十有三自公再被黜典皆與郭公同命公既終一月朝廷起郭公知鳯翔府事次子兟因遺奏特授守祕書省校書郎識者悼公之殁焉公初娶張氏封清河縣君繼崔氏封夀安縣君二子長曰兢東州節度推官次即校書皆勤學有才稱一女尚幼即以其年十二月十八日葬於河南府河南縣龍門鄉南五里銘曰自古四夷或侮或順以威以懷世其異論在公之策羈縻示信躓而不復沒有遺恨匪身之謀唯國之徇刻此銘章載其忠憤河南先生文集卷之十五
