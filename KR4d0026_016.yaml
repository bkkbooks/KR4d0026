front:
  text: 河南先生文集卷之十六
  hash: sha256:5e16bfa9af0d9d88e757fb388378b3e122118fb74615db430f6dd92762952877
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_016-1a}
body:
  text: 志銘故朝散大夫尚書兵部郎中知蘄州軍州兼管內勸農事護軍賜紫金魚袋張公墓志銘故大中大夫右諫議大夫上柱國南陽縣開國男食邑三百户賜紫金魚袋贈太傅韓公墓志銘故兩浙轉運使朝奉郎尚書司封員外郎護軍賜紫金魚袋韓公墓志銘故朝奉郎尚書司門員外郎通判河南府西京留守司兼畿內勸農事上輕車都尉賜緋魚袋盧公墓志銘故西京左藏庫使銀青光祿大夫檢校工部尚書使持節晋州諸軍事普州刺史兼御史大夫充廣南東路駐泊兵馬鈐轄兼提舉本路巡檢兵馬賊盜公事上柱國太原縣開國伯食邑九百户王公墓志銘故朝散大夫尚書兵部郎中知蘄州軍州兼管內勸農事護軍賜紫金魚袋張公墓志銘并序公諱弇字漢臣其先魏郡人唐末從祖有官河陽者舉族因遷河陽世服儒衣冠無顯者父用存光祿少卿母某氏封某郡太君公葬光祿河南遂為河南人景德二年再舉進士中第歷宣州寧國開封中牟二縣主簿泉州晉江尉用薦特改著作佐郎遷祕書丞太常博士知并州榆次揚州天長二縣通判杭州事入尚書省歷屯田都官員外郎知文州蔡州事賜五品服提㸃開封府諸縣刑獄公事轉司勳員外郎知明州事就遷祠部郎中召還擢為刑部郎中荆王府翊善賜三品服兼判司農寺寶元二年以疾辭出知徐州事進兵部郎中移蘄州康定元年五月終於郡年六十二公五歲而孤母夫人携以歸其族從師學既冠善屬辭博涉經史河南素多士公晚輩隸然見文采亟與知名者游衆不敢以門寒後公倜儻尚義節居貧以約自守未嘗假所不足於人人有伺顔色而進誠者公審其果善士叧承其意後皆重償之無一不報厚朋友險夷共之人莫能致其間言其人殁雖久有妄評其短者公嫉之終身為著作佐郎葬母或率錢數十萬為助者公曰吾以士葬親於禮無歉者惡用賻為乃謝不受其為政待吏甚察然寬民緩徭不喜刻宰天長尤以治稱有錢蒙吉者作天長善政說以美焉在杭州㑹軍士以三司所給賚物疏惡喧噪趨牙門公即馳往諭之乃定璽書褒美屢平疑獄後得有罪者事登曰佐王府未嘗以柔愈見言色進退必以莊其剛守類皆若此然亦以是卒不顯貴娶陳氏封福昌縣君後公數月而終子彥伯某州某縣主簿慶仲寧州安定主簿慶曆十四年十二月二子奉公及福昌君之喪葬於河南之龍門山之上銘曰嗚呼閲放其通强毅其守行隆州邦信在朋友為政之仁在民則厚考古循良孰我先後匪豐其祿又奪之夀獨兹令名是謂不朽者也故大中大夫右諌議大夫上柱國南陽縣開國男食邑三百户賜紫金魚袋贈太傅韓公墓志銘并序公諱國華字某其先深州博野人世衣冠舊族四代祖又賓當王景崇襲有鎮冀四州佐其府纍官檢校太子左庶子兼御史中丞景崇於河朔諸鎮中輸貢最為恭順由庶子漸劘以德義故以功名始終庶子生四子韞辭慎辭定辭昌辭皆以才名為王鎔賓屬于時鎔府號多賢士定辭嘗以掌書記聘幽州時燕客馬彧名北門舊儒以博給相尚彧大屈伏昌辭終真定府鼓城令即公之曽祖也生廣留府永濟令諱璆避張文禮之難徙趙郡以文知名與李嵩徐台符為友二公交薦其才㑹疾不起徐作詩以為當世朋友無復繼者李卒以兄子歸韓氏實趙郡太夫人永濟生太子中允知康州事諱御名令上始遷相州安陽遂為安陽人屢為藩鎮辟署敏書奏時推其工嘗宰真州清河作條教諭民以不擾能信其言所至以寬良稱公即康州之第四子年十九舉進士太平興國二年天子初御殿覆試上第為大理評事通判瀘州四年代還授太子右贊善大夫旋以例補外幕授安德軍節度判官七年除祕書省著作郎監察州稅雍熙元年遷監察御史三年假太常少卿使高麗還拜右拾遺直史館賜五品服四年充三司開折司推官尋改主判開拆司纍遷左司諫刑兵二部員外郎帖昭文職賜三品服凡三為鹽鐡判官又為左計司判官判户部勾院都判三司勾院至道二年以屯田郎中充京東轉運副使移峽路轉運使真宗聽政遷都官郎中還朝權判大理寺出知河陽咸平四年就遷職方郎中移知潞州景德三年假祕書監使契丹還為江南巡撫使入權開封府判官四年車駕拜陵權領曹州事召歸授太常少卿知泉州事大中祥符元年拜右諫議大夫四年代還道病三月十一日終於建州之傳舍年五十有五公為文章不尚靡放靜違而意不窘進止威嚴目不妄視佐彰德軍年尚少鄉里多識公出觀者夾路或相語得韓公左右顧當具肴酒其重若此雍熙中王師北伐聞髙麗與契丹嘗為仇怨命公諭㫖以分虜勢公至其王治畏虜無報復意公為陳中國威略動以禍福乃承詔然遷延師期公曰兵不即發不如勿奉詔出不及虜境不若勿發兵口語激切又繼以書至十返治憚公堅正知大國不可欺乃命其大相韓光元輔趙杭兵二萬五千以侵虜且俾光等率將校詣公公猶留館須其兵出境乃復命淳化二年契丹大將蕭寧遣人抵雄州請天子疑其詐命公馳往公代州將劉福作書與寧釣致其情得寧答辭前後反覆無所依由是悉見其僞狀在三司更張事凡二十七條其興利使民樂趨而上收其贏其立法使人易守而難犯故所施置通久而少弊臨上黨㑹虜寇河朔上黨與趙魏地最親公辨嚴修訓簡器供餉皆先事區處民以無擾詔書褒美初太宗親擇材臣有由外庭小官不旬歲柄用者公忠力不懈天子深器其能而為見忌者擠排故位不甚進然益任以事留京師凡十年舊三司判官不兼三館職事公為鹽鐡特命直昭文館判官帖館職自公始真宗緣先帝意以名臣待公開封嘗繫囚數百委公決之江外阻饑命公撫之皆以任事稱北方請盟之明年公以使往上諭曰卿昔使髙麗故以選卿又顧同使周漸張若谷曰卿凡事當詢韓某公性既任直無所附合持權者復不為推引更歷中外垂四十年位才諫大夫終時皆歎其滯然公亦不夀故不究其用迹其行事皆得舒發所藴未嘗阻撓又被顧兩朝為縉紳屬目非不遇也公既沒泉人之有知者相與趨建陽拜奠朝夕哭詣浮圖營齊以報公德其寬愛感人至此公間逹有度量與人語言䀆誠無隱非議戎事未嘗及權數自以少孤見祿及親者必憮然感傷篤愛親族姑姊數人孀且老皆迎以歸事之甚謹外兄弟甥姪悉為其婚嫁清約自守家無餘資諸子皆訓以經藝例恩得任子多抑之須其成立然後奏以官及公之終未官者猶三人夫人羅氏諫議大夫延吉之女鄴紹威之孫封宜城縣君子六人球湖州德清尉瑄將作監主簿琚司封員外郎玩河陽司法參將軍􅟛著作佐郎琦右諫議大夫樞密副使一女嫁西上閣門使髙志寧樞密之兄姊今無存者初司封登朝與樞密並贈公吏部尚書慶曆三年樞密追榮三代贈公太傅妣羅氏追封仁壽郡夫人大父贈太子少傅妣李氏封趙郡太夫人曽大父贈太子少保妣張氏封清河郡夫人五年二月日樞密奉公夫人之喪歸葬於相州安陽縣之新安村距祖塋三十里其銘曰韓氏自唐載德以世丁時孔艱秉節愈厲公奮在初才克有試曰州曰邦以功以事豈不較利通久勿僿亦既立法究窮罔斁布威東夷申化南裔維皇之咨宜輔於治若時之贍則協於義年胡弗淑位胡弗至靡人不嗟彼含誰慰在子而昌實公之嗣衮服以章葬則有制豆籩式嘉祭則備器孝于有家傳千百祀故兩浙轉運使朝奉郎尚書司封員外郎護軍賜紫金魚袋韓公墓志銘并序公諱琚字子溫相州安陽人右諌議大夫贈太傅諱國華之第三子幼敏惠太傅愛異諸子凡有撰述令執筆口授之由是䀆得屬辭之體以䕃試將作監主簿調饒州鄱陽尉大中祥符七年求應進士舉郡守江嗣宗素未知名一日召登郡閣出鴻雁來賔賦題以試之公少頃即就格致清麗有唐人之風江大稱賞即時薦送江左有書其賦於屏者其愛重如此明年中第授太常寺奉祀部知河南府永寧縣事時王公嗣宗守河南政尚嚴察束官吏一以法細民或縣訟不勝率走府自直屬官畏縮益煩慮不任事頗以疲軟罷永寧在河南名最劇縣公年少果敢善決斷民吏愛伏王公嘉之遂不奪其治且薦于朝用薦移通判廣信軍事丁內艱服除纍遷光祿丞祕書太常丞歷通判趙祁䖍三州事䖍於江西號難治民喜訟或僞作寃狀悲憤呌呼似若可信者非久於政莫能辨公至㑹守缺代行郡事能究其風俗不為聰明不作條教因事以考其枉直下莫能欺辭伏者自以為不冤召還為群牧判官賜五品服張文節公秉政嘉公文行令以所著篇集上獻且以姓名置佩囊中將薦之㑹薨遂寢初公在趙州官缺奏公補其任曹得罪出通判濠州事轉太常博士尚書屯田都官員外郎知黃州蘄州事京西路提㸃刑獄時西京天宫白馬寺並營浮圖募衆出金錢費且億萬權臣為倡首旁郡承風指塗商里豪更相說導附嚮者惟恐後公抗疏言狀罷之就移福建路又改廣南西京路轉運使安化州蠻叛殺宜州中將王世寧朝廷遣將加兵復詢公制賊利害者也然而公上言蠻負險攻之則竄保雖洞㟽絶不可窮其迹置之則時出侵掠恣為人害師久留屯復多疾病物故為今策莫若盛兵逼其巢穴豫以開納蠻必畏威欵附然後罷遣屯戍增募士兵守其要害宜不能復叛其後卒如公策嶺表久無事兵暴起轉糧糗具器械公處置皆有方不嚴期促辦而軍用以濟朝廷嘉之就遷司封還朝賜三品服判三司都理某人憑田司康定元年夏出為兩浙轉運使次潤州以疾終年五十二公性至清慎動自檢察他人視之以為難常而公持之終身父兄既沒撫養弟姪極其恩意間或文酒相欣門庭之內自為師友有行事不如意者委曲開諭未嘗及以惡辭故皆率教誼兢以樹立焉公之季弟樞密副使使琦以慶曆三年追榮三代故公之曽祖廣晉府永濟令諱璆贈太子少保祖太子中允諱贈太子太傅夫人羅氏追封仁夀郡太夫人公娶李氏封夀春縣君公沒才數月而逝四男景融將作監主簿性和雅善屬文後公五歲卒方彥試祕書省校書郎直彥孝彥並太廟齊郎四女長適著作佐郎葉仲舒次早卒次適左侍禁曹測次適殿中丞范寬之五年二月二十二日樞密奉太傅太夫人及公之喪葬於安陽之新安村李氏祔焉銘曰䖍州之治可以觀公之政文節之知可以觀公之行持清太髙寧或􅏺評篤愛過慈實其資性蹈中弗越秉常以正嗚呼厚其稟而嗇其享焉故朝奉郎尚書司門員外郎通判河南府西京留守司兼畿內勸農事上輕車都尉賜緋魚袋盧公墓志銘并序公諱察字隱之河內人舉進士授復州司士參軍纍調光化軍乾德襄州襄陽二主簿夔州復節令泉州觀察推官遷大理寺丞登朝為太子中舍殿中丞國子博士入尚書省為水部司門員外郎凡歷知河南密江陵公安彭州永昌三縣知蒙州事白波發運判官最後通判河南府寶元二年八月十日以疾終於官年五十五初公景德初以進士貢有名稱吏部薦在髙等有以先相名聞者具曰盧某男不當與科第上亟命以官吏部復持公年未中格遂以間曹授之公既見詆於時益以風節自厲所至朝夕勤事勇於行已不以上官不合易其守前後􅍘疑獄濟饑民發奸吏復逋亡所部監司以其狀為薦者相繼始終以幹理聞能為古文章有集三十卷别著晦書一卷靈感志三卷注孫子三卷雅愛太玄為之注未成臨終命焚之獨留一篇并序且曰後世必有吾繼者善撫宗屬及姊妹子之無依者親為嫁娶凡十人篤尚風義侍御史臧奎於公有舊恩名其次子示不忘臧氏景佑中嘗得召􅍟從容敘及丞相得罪事言已流涕上感動即贈丞相工部尚書夫人蘇氏追封河南郡太夫人初丞相以兵部尚書相太宗後徙朱崖雍熙二年以疾終其九月日公始生公感家世蒙禍居常自傷至是五十年追命常伯卒獲其志世皆異焉蘇夫人漢相禹圭之女當丞相貴封豳國夫人公祖諱億少府監嘗贈太師妣母李氏鄭國太夫人公娶張氏封清河縣君其父文勝為逹州司理參軍遇盜起迫署以官不屈以兵死公之子九人戡臧堿成戣鉞戩戒感堿有文行早世戡成戣戬鉞皆幼亡臧以進士第為河陽尉戒感並學為辭章二女一夭亡一未嫁孫夀康夀寧夀祺尚幼慶曆五年十月辛酉臧奉公及清河之喪葬於河陽某村之西北原銘曰既艱其生又窒其仕匪俗以同兮將永躓公來常兮方以厲道不屈兮文益肆追命其先兮如始志惟此孝心兮德之至能銘其烈兮公之嗣故西京左藏庫使銀青光祿大夫檢校工部尚書使持節晋州諸軍事晋州刺史兼御史大夫充廣南東路駐泊兵馬鈐轄兼提舉本路巡檢兵馬賊盜公事上柱國太原縣開國伯食邑九百户王公墓志銘并序公諱世隆字可久其先自澶淵徙河南今為河南人少舉眀經上第授洪州分寧主簿纍調涇州司法參軍越州山隂縣秦州録事參軍遷大理寺丞歷太子中舍殿中丞國子博士尚書虞比駕三曹員外郎換左藏庫使改左領兵衛大將軍致仕復為左藏庫使領普州刺史由大理寺丞至員外郎凡歷監台州酒稅知河南府夀安縣事徙知雲安軍通判邠秦二州事由左藏庫使知夔州事起致仕知登州事移廣南東路兵馬鈐轄行次南雄州慶曆二年二月二十日無疾終於館年六十七公性通其為吏事雖細微處之極精或事劇體巨他人蓄縮不敢議決之益不疑卒無一毫差失所至以材聞在秦州㑹曹公瑋治兵扞戎命主儲餉曹公表公能辦職雖軍事亦與謀議遂力薦之眀道中歲大饑公為坊州出廩粟以賑民僚吏固曰必待報公曰民方徙溝壑少緩之困將日甚天子至仁必不以加罪縱異此吾任之無恨公始緣曹公薦世多知其有武略王丞相遂典樞密言公策略可試遂領使職及以疾致政還洛而疾平㑹張鄧公以留守入相嘉公精力且惜其材乃復起之公重厚寬愛不務峻利於治獄尤尚平允僚屬有一善孜孜稱道御士卒亦隨其所任不强其不能下亦樂為䀆力劇飲至醉不亂父應之纍贈屯田員外郎母諸葛氏追封永寧縣太君娶董氏封金華縣君二男沂右班殿直炳河南河清主簿兩女皆適士族慶曆五年七月二十五日沂炳奉公之喪葬於河南縣洛苑鄉司徒里河南先生文集卷之十六
