front:
  text: 河南先生文集卷之十八
  hash: sha256:e5b114539612e6aaffdeefb4c6e4c4f6e1a4868498c06455ce5d3792fb88cc39
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_018-1a}
body:
  text: 表疏乞坐范天章貶狀論命令恩寵賜與三事疏論朝政宜務大體疏論朋黨疏進正觀十二事表論城水洛利害表乞坐范天章貶狀朝奉郎守太子中允充館閣校勘騎都尉臣尹某右臣伏覩朝堂榜示范仲淹落天章閣待制知饒州敕辭內有自結朋黨妄有薦引之言臣知慮暗知嘗以其人忠亮有素義兼師友自其被罪朝中口語藉藉多云臣亦被薦論未知虛實仲淹若以他事被譴臣固無預今觀敕意乃以朋比得罪臣與仲淹義分既厚縱不被薦論猶當從坐況如衆論臣則負罪實深雖然國恩寬貸無所指名臣內省於心有靦面目況余靖自來與仲淹蹤跡比臣絶疏今來止因上言獲以朋黨被罪臣不可茍免願從降黜以昭明憲論命令恩寵賜與三事疏至隴州上慶曆二年四月日朝奉郎守太子中允集賢校理新差通判秦州軍州事上騎都尉賜緋魚袋臣尹洙昧死再拜上疏皇帝陛下臣聞漢文帝盛德之主賈誼論當時事勢猶云可為痛哭孝武帝外攘四夷以强主威徐樂嚴安尚以陳勝亡秦六卿篡晋為誠二帝不以危亂滅亡為諱故子孫保天下者十餘世秦二世時關東盜起或以反者聞二世怒下吏或曰逐捕今盡不足憂乃悅隋焬帝時四方兵興左右近臣皆隱賊數不以實聞或言賊多者輒被詰責二帝以危亂滅亡為諱故秦隋之宗社數年為墟陛下視今日天下之治孰與漢文威制四夷孰與漢武國家基本仁德陛下慈孝愛民誠萬萬於秦隋至於西有不臣之虜北有强大之鄰非特閭巷盜賊之勢也自西虜叛命者四年旁塞數擾內地疲逺輸兵久於外而休息無期卒有乘弊而起兵法所謂智者不能善其後當此之時陛下當夙夜憂懼所以慮事變而塞禍源也陛下延訪邊事容納直言前世人主勤勞寬大未有能逺過者也然未知以宗廟為憂危亡為懼此賤臣所以感憤於邑而不已何者今命令數更恩寵過濫賜與不節此三者戒之慎之在陛下所行耳非有難動之勢也陛下因循不革弊壞日甚臣是以謂陛下未以宗廟為憂危亡為懼者以此夫命令者人主所以垂信於天下也異時民間聞朝廷降一令皆竦視之今則不然皆相與竊語以為不久當更既而信然此命令日輕於下也命令輕則朝廷不尊矣又聞羣臣有獻忠謀者陛下始甚聽之後復一人沮之則陛下急移矣忠言者以陛下能終頗自絀其謀以為無益此命令數更之弊也夫爵賞陛下所持之柄也近時外戚內臣以及士人或因緣以求恩澤從中下謂之內降臣聞唐氏衰政或母后專制或妃主擅朝樹恩私黨名為斜封今陛下威柄自出外戚內臣賢而才者當與大臣公議而進之何必襲斜封之弊哉且使大臣從之則壞陛下綱紀不從則沮陛下德音壞綱紀忠臣所不忍為沮德音則威柄日輕臣又聞盡公不阿朝廷所以責大臣今乃自以私昵撓之而欲責大臣之守正不私難矣此恩寵過濫之弊也夫賜與者國家所以勸功也比年以來嬪御史伶官大臣之屬賜與過厚人間傳言內帑金帛皆祖宗纍朝積聚陛下用之不甚愛恤今之所存無幾疏逺之人誠不能詳內府豐匱之數但見取於民者日煩即知畜於帑者不厚臣亦知國家自西方用兵用度寖廣帑藏之積未必皆為賜豫所費然下民不可家至而户曉獨見陛下行事感動耳往歲聞邊將王圭以力戰賜金則無不悅服或見優人所得過厚則往往憤歎人情不可不察此賜豫不節之弊也臣所論三事皆人人所共知近臣從諛而不言以至今日方今非獨夷狄之為患朝政日弊而陛下不寤人心日危而陛下不知故臣願先正於內以正於外然後忠謀漸進綱紀漸舉國用漸足士心漸奮夷狄之患庶乎息矣伏惟陛下深察秦隋惡聞忠言所以亡逺法漢主不諱危亂所以存日親盛德與民更始則非獨賤臣幸甚實亦天下幸甚干犯鈇鉞臣無任戰汗激切俟命之至臣洙昧死再拜上疏論朝政宜務大體疏為進奏院飲㑹事十一月日朝奉郎起居舍人直龍圖閣知潞州軍州事輕車都尉賜緋魚袋借紫臣尹洙昧死再拜上疏皇帝陛下臣聞至治之本在於務大體不在乎任察也漢明帝察唐德宗以察為明皆著􅏺前史非盛德之論然則衆之好惡必察之臣下忠邪必察之非謂究發隱微作為聰明者也臣聞詔獄所治類多然士因醉飽之失發曖昧之罪臣竊以為過矣大抵士君子少長修飭始終如一者皆純固介特之士舉朝論之百不一二至於年位尚輕頗或疏縱及稍貴重始自矯厲而能建事功於世名節之效者不可勝紀此殆常人之情明主所深亮也兹事雖往臣所慮者上下相伺動輒得咎刻薄之風寖以成俗於盛明之卉所損不細非特謂二三子也又比年以來既行之恩尚或中寢既用之法罕䝉開釋豈搏擊之說易以進寬厚之論難為陳哉伏惟陛下采漢臣窺私之誡鑒吳主校事之弊因慶澤之後發寬大之詔明諭凡臣下有纎介之惡非虧損教誼侵害民物者勿復以聞至若暴亂之萌驕僣之原誣罔朋比狥私滅公此王誅之所先願陛下留神聰察無志其細而遺其大則善者聳而惡者戒矣狂瞽之言惟聖明裁擇幸甚臣洙昧死再拜上疏論朋黨疏十一月日朝奉郎起居舍人直龍圖閣知潞州軍州事輕車都尉賜緋魚袋借紫臣尹洙昧死再拜上疏皇帝陛下臣聞知賢而不能任任之而不能終於治國之道其失一也去年朝廷擢歐陽修余靖蔡襄孫甫相次為諫官臣知數子之賢且久一旦樂其見用又慶陛下得賢而任之所慮者任之而不能終爾以陛下知臣之明修等被遇之深豈有任之而不能終哉蓋聞唐魏元成既薨文皇親為撰碑文以賜之後有言其阿黨者遂覆其碑近世君臣相得未有如唐文皇與魏元成者間言一入則存沒之恩不終臣未嘗不感憤歎息而不能已也以是而論則知任之為易終之實難可不慮哉屬聞歐陽修領使河北臣以邊事之重故不復以內外為疑今又聞蔡襄出福州未審襄以親自請為以過斥若以過斥豈當進其官秩若以親請則襄任京師不三四年已再省其親士大夫去逺方而任京師者孰不念其親豈獨襄得遂其私恩哉則襄之不當出明矣陛下優容諫臣在唐文皇上修等之才雖不愧古人然所施為未能少及於魏元成則間毁之言不必待其沒而後發也伏惟念知之之已明任之之已果而終之甚難則天下幸甚然臣愛修等之賢故恤其去朝廷而不盡其才如陛下待修等未易于初則臣有稱道賢者之美如其恩遇已移則臣負朋黨之責矣夫今世所謂朋黨甚易辨也陛下試以意所進用者姓名詢於左右曰某人為某人稱譽必有􅍟者曰此至公之論異日其人或以事見疏又詢於左右曰某人為某人營救必有􅍟者曰此朋黨之言昔之見用此一臣也今之見疏亦此一臣也其所稱譽與營救一也然或謂之公論或謂之朋黨是則公論之與朋黨常繫於上意不繫于忠邪此御臣之大弊也臣既為陛下建忠謀豈復顧朋黨之責但懼名以朋黨則所陳之言不䝉先采此又臣之深慮也惟聖明裁察焉臣洙昧死再拜上疏進正觀十二事表朝奉郎起居舍人直龍圖閣知潞州軍州事輕車都尉賜緋魚袋借紫臣尹洙右臣聞聖人鑒治亂莫如前代然於世易考于事易通則莫若世數之相近者故周書無逸厯陳啇王中宗高宗祖甲之德不及虞夏臣以為方今憲法前古宜在有唐唐治之盛者在於太宗舊史具存爛然可述臣某誠惶誠恐頓首伏惟尊號皇帝陛下詳延經生信尚儒術書契之所傳縉紳之所道無不該綜浹洽窮其淵源固足以順考古先憲章百代者矣竊惟聖心所慕當追三代之盛而諸儒稱頌亦謂比隆唐虞賤臣區區獨以為政教威賞未臻乎正觀之治輒取唐史官吳兢所録正觀時事切于今者得十二事以獻伏望􅊨陛下留神覽觀詳而思之勤而行之則正觀之治不難企及由正觀以復三代繇三代以至唐虞豈逺乎哉在勉於初克於終而已干冒旒扆臣無任瞻天望聖激切屏營之至論城水洛利害表知渭州時朝奉郎行右司諫直集賢院知渭州兼同管勾涇原路經略安撫部署司公事上騎都尉賜緋魚袋臣尹洙右臣得招討司牒奉朝㫖修水洛城事臣前得招討牒見􅊨朝廷罷修此城人人感悅今曽未逾月復此興建無不駭歎今興作之勞費用之先臣且置而不慮者既城之後為害滋大耳臣竊較計利害為國家之害有四而無一利焉自賊昊擾邊王師屢屈非以地不廣大而不能抗者也雖用兵有工拙然大概說者以衆寡之勢不相侔也今涇原一路之兵可以戰可以持重為聲勢者獨狄青所將之兵耳然不滿二萬其他則城寨屯防裁足自守不當更有動移此城既成必分兵戍之緩急賊至則所僃益多所用益寡所謂弱我兵而強敵勢此為害一也山外諸城本無稅籍自西鄙用師大增屯兵今平糴入中數且不足猶令諸郡輸送稅粟僅有歲備單弱之民寖以愁困此城既建須益發近邊之民輸粟以給其用不獨勞苦且虞冦鈔之害倘復發兵援送則所費彌廣所謂重傷民力增損國費以事無用之地此為害二也且朝廷命將出師勞弊天下禦之不能勝緩之不能伏為我之寇讐者賊昊而已西蕃種類與國家本無纎介之隙今無故攘其地而置城寨又前後誅斬首級亦已數百外不足揚威于賊昊內實樹怨於種落非計之得也臣觀古羌夷之為患多矣今西蕃種類居秦渭之間者十餘萬皆以仇怨不相伏屬如一旦破仇合從則內屬之户附漢最深者必先被其擾我必以兵救之我出則彼歸我歸則彼出動之甚易安之甚難縱未能勞我大兵然於疆場侵冦之患是更生一昊也所謂為國生事而無損於冦讐此為害三也賊昊前冦山外獨黨留麻氊部落氣數附虜為虐不聞水洛種族籍虜勢為邊患也今則通賂於虜事已明白此城若建凡此種類必召冦為援為之鄉導當是時少出外兵則不足以應虜多出兵勝敗之勢未決臣恐山外之危亡自兹而始此為害四也然建謀者以通秦渭之救兵為國家之利此又失之矣夫救援之兵驟出不意或可以取勝今既城水洛虜知救兵必出於此當先據便地以待我師且救援之兵不過數千勞逸勢殊豈能與虜較勝負者哉臣以此知水洛既城秦渭之救兵必不從此而進所以謂之無一利者也縱使無前所陳四事城之猶且無益況分兵輸粟生事召寇四者之害較然可驗哉臣聞拓地廣塞鞭笞四夷蓋以弭邊患而强中國未聞竭民力耗國用而以樹兵本兆禍階也臣識慮淺近然在邊纍歲耳剽目睹事頗習熟又幸得以諫名官豈容默默無所開陳伏望聖慈博詢衆謀慎重兹役則不獨邊鄙幸甚亦天下幸甚謹具狀奏聞河南先生文集卷之十八
