front:
  text: 河南先生文集卷之十九
  hash: sha256:a7abf30d7d725f83ed06558baaffd31e9feef9f16bb53b927ce753bc4711a68a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_019-1a}
body:
  text: 劄子乞便殿延􅍟兩府大臣議邊事乞講求開寶以前用兵故事論諸將益兵二首論遣將不當強而使之乞減省寨柵乞計置邉事特出睿􅍘乞帥臣自募傔從乞省寨柵騎軍乞募士兵乞鬻民爵以給募兵之用乞半年一次詣闕奏事二首乞便殿延􅍟兩府大臣議邊事臣伏聞近日軍機令中書與樞密院同共參議此誠陛下慮邊事之深也然臣近再得上殿奏事每見兩府執政奏􅍟不過一兩刻其間或進議除改或可否奏事未必專議邊防臣竊料西虜今秋以至來春必為大舉之勢若更使得至則陜右可憂臣欲乞每五日後殿進呈公事罷别於便殿延􅍟兩府執政大臣參議邊事審料賊勢為守禦之略免使冦兵奄至臨時處置有失便宜如允臣所奏乞詳酌唐延英故事施行康定元年五月日朝奉郎守太子中允新差權僉署涇原秦鳳兩路經略安撫判官公事騎都尉臣尹洙乞講求開寶以前用兵故事臣聞太祖統御邊臣之略輕其秩所以假其敘厚賜所以惜名器代望聖慈延訪大臣講求開寶以前事則西鄙狂悖不足可平又聞陛下頃者多賜近臣飛白書被賜者皆為榮寵今邊臣日有奏請若事體當有更置者望陛下賜手詔數十字以示宸斷則聖神威略千里之外如在目前傳於軍中孰不尽節此兩事乞留中省覽論諸將益兵臣竊見近日所委帥臣大抵以益兵為請朝廷既孰聞之必以為循常之談臣但慮衆說依違未能感悟聖意臣非不知國家兵數有限然事當應急必在枝梧昔秦伐楚王翦請兵六十萬有李信者請止用二十萬故秦帝不從翦言者謂信能任其事也然信果敗而翦終成功今西邉諸將人人皆請益兵亦有自許如李信請以少擊衆也如李信者尚敗事況强而使之此必敗之又一首臣竊以涇原一路俯近賊境然自元昊狂悖未聞深來寇鈔以臣料之必謂朝廷怠於禦僃乘此間隙勢將大舉若所過堡寨委而不攻屯戍之兵止能自守未有以待之也昨葛懷敏與臣言夏竦所將兵在涇州止及二千益以懷敏所請之兵共未及五千人若虜衆大至必當堅守臣所慮者不患其攻城不患其求戰唯患其審我虛實知我利害視涇渭之城為自守之壁引衆前進大為俘掠則猖獗之勢未可輕也臣請益涇州屯兵滿三萬騎五千俟虜之來或應變出奇或分兵據險以逸待勞勝勢多矣縱使戰氣方鋭且堅壁自守賊憚我全軍必未敢南向輕進則進退之勢皆得以制之此事制置貴在速決論遣將不當强而使之臣聞近日所遣邊將其中或應命而往非必尽有決戰却敵之心亦有自求退免朝廷强而使之者以臣所見凡能自陳效用臨事猶或敗衄若其預陳不能其任豈可責以成功欲乞降詔諸路大將責以禦賊之任仍令條上方略其所陳請望盡與應副若自陳不堪其任并所說迂逺者乞移任內也乞減省寨栅臣兩次上殿親聞聖語以減省寨柵聚得兵在大將處最為急務雖聞已命邊臣制置臣尚慮諸將各有所執依違未決轉至遲遲蓋緣賊兵數少其寨柵亦可禦遏若大假兵至即全不濟事又分却大將兵勢以此較量必合減省然邊臣慮見將來小有寇掠必致不識事體之人言其不合去却寨柵致得别無禦遏懼此歸咎遂懷後慮臣欲乞專委近上臣寮往彼相度制置所貴早聚得兵馬在大將處以為禦僃乞計置邊事特出睿斷臣前次上殿敷奏邊事陛下諭臣以減省寨柵申明賞罰及禦賊之備此數事皆臣口所欲言陛下先發德音臣不勝喜忭然賞罰一事近日數已申明其減省寨栅及禦賊之備雖聞詔下帥臣其如至今未見次敘方今虜氣驕盛雖未來寇境料其侵軼之勢不越秋冬正是朝廷計置之時陛下惜分寸之陰深為禦賊之慮況所更置時出睿斷勿令淹久失於後時則天下幸甚乞帥臣自募傔從臣竊見近降詔㫖令舉膽勇武藝之士誠取人之急務也然其中或武藝雖精而未能絶人或諳邊防事宜而不通方略舉其人材未足應詔矣而不録又似遺才臣欲乞令在邊臣僚見總兵要者各許召募人作牙校軍將名目量定人數使其功效粗著即乞朝廷量其所能或授以班行或列於軍校且令本處效用若改授內地應牙校等並令具名聞奏隨才録用即不許帶行仍乞逐歲除公使錢外量有支賜以充膳給臣昨授命西行在西京已有兩人自言材勇乞隨臣同行于邊上效力臣雖不敢帶去以此揆度邊將募人其來必衆況自古將帥皆有部曲為之爪牙伏聞太祖朝所任邊將李漢超郭進李謙浦董遵誨等位序未崇皆自募傔從為其親信先朝賜與既豐或更假之權利此事當載國書伏望聖慈講求故事斷在不疑乞省寨柵騎軍臣竊聞西虜大率騎戰今言兵者皆知中國馬力不能較其馳逐此知其利害而未䀆其說今邊鄙所巿芻秸其價甚重邊人畜馬為國家用者以利所誘必損其馬之所食以鬻於官此不獨虛實國用且又瘦瘠彼土良馬此甚害也又聞將兵者多欲增步卒不願逺發騎軍臣欲乞詔逐路大將其本路合須騎軍具以數聞如是在騎軍已多即揀選駑弱者退還仍每減一騎軍與添步卒二人補之不惟減省邊費更兼益得兵數其沿邊堡寨本為守禦當在險固之地若虜衆大至必不宜與之平地較戰所畜騎軍除合留探報外近為無用亦乞移屯在大將麾下别以步人補其數乞募士兵臣竊見諸路揀選到兵士其間不無驍勇然怯弱者亦多未經訓習或聞使令戍邊恐臨戰退縮更至敗事臣欲乞于涇州别立軍額召募兵衆武勇才力明立科式定作三等第一等便充本軍人員更不刺面第二等充十將將虞侯第三等充承局押營其兵士但取强壯堪任教習者不以身材尺寸為限料錢三百文至五百文為額唯乞優賜例物其節級以上别作等第支給若涇原一路可得萬人以此禦敵軍威必振乞鬻民爵以給募兵之用臣所請涇原一路募軍萬人須至添置營房支給例物其費不少臣請鬻民爵以致之夫鬻爵者參用古義非若賣官之制只以入粟百石五百石為兩等百石為下爵許用銀為飲食器畜女使五百石為上爵許與本部七品官接坐婦女雜飾用珠金皆犯公罪及詿誤聽以贖論其貢舉人曾經州府省試州府吏人至節員京百司補正名以上並准下爵例司封給爵牒空名下諸州其入粟者經所在官司陳牒即時給之除陜西河東河北川峽廣南外其餘諸處其無爵僣有爵下爵僣上爵諸科罪仍許人陳告賞錢百貫以犯事人家財充如允臣所議乞朝廷别定爵名應有條約比類詳定如此行之不益賦于農畝不重斂于富人所取者至輕所致者甚衆今鬻爵之地百餘州至小計之不減五萬當得粟五百萬斛每斛輸錢二百計錢一百五十萬貫如約以近限則數月之內此錢可足臣乞預借錢三千萬貫充涇原募兵候收到入粟錢却依數撥還其有餘數亦乞支充西邊軍州乞半年一次詣闕奏事二首一臣今所授經略判官凡是軍事當得參議其夏竦等如有處置邊事又只飛奏恐朝廷未盡知得彼處事機臣欲乞逐季或半年一次入奏面陳事狀兼彼處城寨要害道路迂直兵衆糧運等臣尚未細知不敢輕有上言俟臣再至闕廷方敢陳奏仍乞降一付身劄子令臣收執如允臣所請乞降聖㫖指揮又一首臣前次上殿乞逐季或半年一次入奏緣臣是經略判官凡是軍機無不參預若得頻至闕廷面陳事狀則邊臣合有更置事宜得以運司及催綱官委曲敷奏若以外臣無例至京則見今發運司及催綱官員皆入奏伏望聖慈特賜允臣所奏河南先生文集卷之十九
