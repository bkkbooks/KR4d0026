front:
  text: 河南先生文集卷之二十
  hash: sha256:be74a6ac95bdd6633ec50b84039fb01b421cf5f5da23cd872652c2beaf70f2b9
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_020-1a}
body:
  text: 奏狀奏軍前事宜狀奏論金明寨狀奏閲習短兵狀奏論户等狀奏為乞令環慶路與涇原路相應廣發兵馬牽制賊勢事奏為近差赴鄜延路行營其兵馬乞移撥往環慶路事奏為已發赴環慶路置行軍次第乞朝廷特降指揮奏為到慶州聞賊馬寇涇原路牒劉政同起發赴鎮戎軍䇿應事奏為擅易慶州兵救援涇原路事奏金湯一帶族帳可取狀奏軍前事宜狀朝奉郎守太子中允簽署陜西經略判官公事騎都尉臣尹洙右臣昨到鄜延體問昨來六月中差撥兵馬往諸寨並不曽得見賊衆當盛夏之際疲困都人馬虛費國家錢物不少臣竊揆遣使之時賊兵尚在境上陛下深憤諸將畏怯不能齊心出師遂使塞門一寨數月嬰城終至陷沒皇情軫惻專降詔㫖其如兵者詭道貴在神速千里制勝恐後事機伏望聖慈今後軍旅進退乞不直降宣命況臨時應變主將之任豈可賊兵冦境更候朝廷指揮若涉逗遛即乞嚴行朝典謹具狀奏聞謹奏奏論金明寨狀右臣今月十三日到金明寨問得添修舊城次第已于九月下手修築新城臣不知新城利害但以功料計之舊城計功二十萬見役兵夫不及五千人須四十餘日方成新城計功五十九萬七千須一百二十餘日方成即今趙振等屯兵馬一萬餘人日夕披帶以備非常加以霖雨自延州轉般糧草凡九次涉水方到金明兵衆暴露惟宜責以近期若或更張必是遷延至冬轉恐不易臣初聞移改新城尋知張存已有奏論臣比不敢更煩聖聽及臣自金明回又知再降劄子兼內臣相次到州切慮依禀聖㫖須至改移伏望聖意詳臣所奏早賜指揮奏閲習短兵狀代延帥作臣竊見諸處馬軍每一都搶手旗頭共十三人其八十餘人並係弓箭手步軍每一都刀手八人槍手一十六人其七十餘人並係弩手其弓弩手更不學槍刀雖各帶劍一口即元不係教習又弓弩每至夏月更不教閲當戰陳之時或遇險隘弓弩施為不得須要短兵相持其弓弩手既不㑹短兵束手受害遂多敗覆臣今往邊上遂處便一靣指揮馬步軍除弓弩外更須精學刀劍及鐡鞭短槍之類所貴施為弓弩不得處便有短兵之利可以取勝又免至夏月廢却教閲更乞早降宣命指揮下逐路部署司依稟仍乞於試中武藝使臣中選十人下都部署司分擘邊上監教貴得早見精熟取指揮奏論户等狀右臣竊見陜西坊郭第一等人户中甚有富强數倍于衆者每至官中科率只一例作一等均酌其近下户等極有不易者今臣欲乞于逐州第一等户中推排上户家産比類次下同等人户家産一倍以上者定作富强户三倍以上者定作高强户五倍以上者定作極高强户今後官中凡有科率其近下户等大假減得數目祇應得前如允臣所奏乞下陜西都轉運司委轉運使司巡厯所到州軍與本處同共定奪無致别有搔擾奏為乞令環慶路與涇原路相應廣發兵馬牽制賊勢事朝奉郎守太子中允充集賢校理僉署陜西經略安撫判官兼參議都部署司軍事騎都尉賜緋魚袋臣尹某右臣近准都部署司牒今赴延州與范仲淹同共計署行軍次第尋于正月六日到延州得其牒曾乞奏留此一路未議攻討已奉聖㫖作臣尋具狀申經略部署司將元計置鄜延路軍須物色并分擘軍馬並那減赴涇原環慶路去訖切緣臣昨與韓琦赴闕進呈夏竦等所定攻守二策奉聖㫖依所定攻䇿施行即鄜延涇原兩路俱進兵深入其環慶路只令淺攻側近族帳不作大舉之計今來鄜延路既别有擘畫切慮涇原路將來出兵側近路分别無許伐次第不足以張聲援欲乞令環慶路准備行軍次第況慶州柔逺東谷等寨所接罪界一帶族帳不少並在一二百里內不至逺涉沙碃若與涇原路相應廣發兵馬足以牽制賊勢又昨來計置鄜延路軍須器械不少如却移撥應副不難辦集臣已具狀申本路經略副使去訖伏望聖慈早降指揮謹具狀奏聞奏為近差赴鄜延路行營其兵馬乞移撥往環慶路事具位准都部署牒赴延州計置行軍次第者右謹具如前臣尋于正月二十六日到延州見范某計議軍須别未有言語次日只與葛懷敏已下啇量出軍次第逐官雖有異議者臣執言所降朝㫖已定遂不敢别有異同兼葛懷敏等革定到行軍圖子一面又至次日范某方言近有劄子奏乞留鄜延一道為進貢之路未行攻討如歲時無效威加未晚奉聖㫖依奏自來為待出軍修復城寨牽制賊勢恐諸將緩于治兵所以未曾說與有此上項聖㫖指揮尋牒臣請詳聖㫖施行至二十九日夜保安軍狀報前寨門寨主高延德自西賊處未乞通和尋已具事狀申奏自後范公與諸將只擘畫禦備給出軍修復城寨不兩量入界次第兼臣未到延州聞范某已奏將元撥定鄜延路驢子只要三千頭臣深慮朝廷以鄜延路既不入界攻討又見減著驢子數目却于元定下軍須兵馬數內一例減省又緣夏某等所定攻䇿鄜延涇原兩路俱合進兵深入其環慶路只令淺攻族帳切慮涇源路將來出兵陜西路分别兄討伐次第不足以張聲援欲令環慶路准備行軍次第及乞將元撥定赴鄜延路兵馬軍須等却移撥赴環慶路所貴與涇源路相應廣發兵馬以分賊勢卑具狀申奏去訖今准都部署經略使司牒緣已奉聖㫖議定攻䇿所乞改差兵馬赴環慶路難便專擅移易者臣又恐日逼若更遷延即鄜延環慶兩路俱不備辦得進兵之次第轉見誤事已具此申都部署經略使司去訖伏望聖慈詳酌臣前奏狀內事理早降指揮謹具狀奏聞奏為已發赴環慶路計置行軍次第乞朝廷特降指揮今准陜西都部署牒劫緣鄜延係先得朝㫖出兵路分今已俯及時日却有異議請一依元降聖㫖於鄜延計置出兵准備起發無致事者臣尋備録申范某請詳都部署牒內事理施行今准范某牒當所前來依安儀利見并依本司攻䇿用三二月入界申奏尋又有一劄子明言别一見乞留此一路未行討伐歲時之間或可招納如歲時無效威皆未晚奉聖㫖依奏況後來尋覔到蕃漢知次第人根問入界道路方見得綏夏以來橫山蕃户多在崖谷深處各有堡子守隘自家兵馬若只行川路即並無所獲如入隘打慮又兵多則難進兵少則易衄所以不敢固執前議却計置出兵于極邊廢寨中擇有利者修復亦足牽制使賊界東路兵馬不敢併力而去所有環慶路若便深入則地少水泉今却問得有側近蕃寨可以攻取兼與涇原相近足為聲援仍乞朝廷指揮諸路穩審進兵先擇要害之地修城寨所責持重不損國威當所又如此擘畫申奏去訖及已得前來聖㫖不敢更有翻覆惟待罪朝廷甘從黜削即堆以依違恐誤大事臣已依此事由申奏并牒夏某韓某去訖者右謹具如前臣看詳上項范某牒內事理更難以催促計置軍行次第又緣諸路出師日逼若且在延州必慮端坐虛占月日況環慶路依元奏攻䇿淺攻側近族帳亦合預先計置行軍次第臣已于二月十五日起離延州赴環慶路計置次第伏乞朝廷特降指揮所貴牽制賊勢不使併兵涇原有誤大計謹具狀奏聞伏候敕㫖奏為到慶州聞賊馬寇涇原路牒劉政同起發赴鎮戎軍䇿應事今月二十二日到慶州據經略使韓某差來指使李貴稱今月十九日賊馬再來侵擾列磻堡見今鎮戎軍主兵官員只有朱觀一員者右謹具如前臣勘㑹鄜延路都監劉政准經略司差權環慶路都監近自延州與臣同到慶州今來鎮戎軍事宜緊切兼又少闕主兵官員已牒劉政乘遞馬與臣同起發赴鎮戎軍䇿應去訖伏乞朝廷更賜指揮謹具狀奏聞伏候敕旨奏為擅易慶州兵救援涇原路事今月二十二日據抽押兵士殿直蔡從狀申稱准經略副使韓某指揮于環慶路抽撥安塞等四指揮兵士赴鎮戎軍數內先次交割得安塞報武兩指揮所有蕃路保捷兩指揮見在西谷柔逺兩寨䝉部署司見去勾抽者右謹具如前勘㑹韓某牒內稱今月二十一日賊馬在劉磻堡未退事宜緊急切要兵士使喚若伺候柔逺西谷抽到上項兵士更須帶三日必慮有誤軍期臣等尋牒環慶路部署司只于在州差撥振武第十三虎翼第六兩指揮充填蕃落兩指揮已差人管押赴鎮戎軍去訖謹具狀奏聞謹奏奏為金湯一帶族帳可取狀臣昨在延州陳金湯一帶族帳可取之狀親到畨官胡誰諤本族及與西路都司巡檢劉政狄青啇量到事狀纍具奏聞乞候到環慶路與本路官員同共商量别具申奏臣尋于二月二十二日到慶州得知山外敗衄兼本路三兵官員多在外寨駐劄臣遂徑來鎮戎軍今來鎮戎軍事宜稍息見發赴永興軍候見夏某子細陳述上件事機乞相度施行次河南先生文集卷之二十
