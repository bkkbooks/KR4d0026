front:
  text: 河南先生文集卷之二十二
  hash: sha256:b10736aa16c48c62165293f34445901a7780c0168b2ca949e72961e7ec309a5e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_022-1a}
body:
  text: 奏狀奉詔分析董士廉奏臣不公事狀覆奏監察御史李京劄子狀軍制鬻爵法獲首級例奉詔分析董士廉奏臣不公事狀具銜臣尹某准中書劄子著作佐郎新差知蔡州確山縣事董士廉奏臣不公事奉聖㫖令臣疾速分析詣實入馬遞聞奏臣今依准劄子內畫一分析如後一韓琦尹某謀入界至好水川因任福妒功耿傳狂指致兵敗折數萬人尹某作閔忠辨誣文誑惑中外令李仲昌刻石掩韓琦惡今來尹某自知虛誑却毁弃刻石碑子臣今詳董士廉所稱韓琦及臣起謀入界欲乞于中書樞密院檢詳陜西經略司先奏攻守二䇿朝廷擇用攻䇿後來曾與未曾入界及好水川接戰因與不因起議入界致得敗衄所有憫忠辨誣二文臣實有此撰述以勸忠義乞檢㑹任福等敗衄事及韓琦先繳進任福下孔目官彭忠所收得耿傳親書署朱觀名誡任福令持重文字與臣所撰二文照驗即知有無虛誑臣元不曽令人刻石今據傳寫刻本是處州判官李師錫刻石即不是李仲昌欲乞㑹問本州因何人立石後來于是何年月何人毁弃即知詣實兼臣見諸處尋求石本候尋詳别繳具連進呈次一尹某在渭州專擅將官錢數百貫入已使用并借官錢與官員還債并支出軍資庫錢落下赤曆都轉運使程戡曾差儀州華亭主簿王資磨勘見得侵欺官錢的實臣勘㑹渭州應係官錢及公使錢各有監主及文曆拘官乞下本州勘㑹及將臣任內公使錢文曆驅磨即見得有無欺隱所有借錢與人還債臣初到任為禮賓副使孫用曾于鄜延路在狄青手下使喚得力本人為自軍職授官在京借却人錢物遂與狄青各借與公使錢會官與料錢內還納所有軍資庫自有通判録事參軍營勾臣即不知落下赤曆因依乞下本處勘㑹轉運司差官磨勘得見何人侵欺後來作何行遣即知詣實右謹具如前所分析並是詣實所有臣先撰憫忠辨誣二文今抄録粘連在前謹具狀奏聞謹奏覆奏監察御史李京劄子狀准河東都轉運使差官准敕取問臣前知渭州日借支過錢糧事并遞到監察御史李京劄子言竊聞韓琦罷樞密副使因董士廉疏論水洛城并處置邊機不當事伏緣韓琦之過自尹洙始今琦已罷柄任某則仍守舊官人言籍籍于理未順雖聞已降指揮令尹某分析人言事與韓琦不殊切慮别有指說遂至紛拏兼聽知魚周詢相慶回日繳奏到邊民被害之家指論尹某文狀事甚明白乞加臣峻典于言事之體皆未為失惟不當慮臣别有指說乞朝廷便行處分且聖明在上若臣實有過犯必不狥先入之言曲加譴責若的有罪狀豈容紛拏洋念茍免況京所言初亦切聞後云聽知則是未能決信于已也未能決信于已而欲決行於朝廷其惑亦甚矣所賴聖慈垂察許臣分析事狀䀆得辨明向若從京之言則賤臣被析固不足論然上損治體亦非細事臣聞歷代用代刑多有過濫列聖臨御未嘗獨任威罰及于一臣先朝建按刑之官凡罪無細大悉以審究三代以還刑罰之慎未有如皇世者也今京欲用偏至之辭塞辨治之實此原或開人無所措臣謂上損國體者以此而言也京又云魚周詢繳奏到邊民被害之家指論臣事臣不知周詢所言邊民緣何被害有無處所去年臣纍奏乞朝廷將臣與狄青廢罷水洛城因依令百官集議及乞下獄􅍟辨未䝉省察緣當時狄青自邊上處置水洛城事回已劉滬董士廉等隨行人傳言被害人數甚多尋取責實處並不見得被害之人其周詢所言被害之家後來朝廷必曽體量安恤及必有居止去處若果緣臣處置乖張致令邊民被害即後來朝廷轉臣起居舍人直龍圖閣此時京已任御史當極言論列朝廷如察臣灼然有過即不當更霑恩命若引董士廉所陳之言不妄不復推較切為過矣且士廉本非言事之臣只緣曾為水洛城事繫獄二十餘日以此挾恨捃托雖忠信淳厚之人其言不免過實京待士廉果為忠信淳厚之人亦當少原其情漸驗虛實今乃欲朝廷䀆從其言尤所未喻京又言所貴與韓琦行罰頗均臣聞本朝機政大臣出入中外自有常制今琦加資政殿學士制蕃復有褒言君臣之恩未為不厚謂之行罷罰理所未安臣又聞言事者主于言而已言之不從繼之可也伏閣請􅍟可也不然解避其職皆為得體若夫刑賞廢置乃朝廷大柄非言事者得專之也今御史既得風聞言事又欲朝廷不辨明而行罰是臣下進退皆懸于御史其權不亦過重哉嘗聞景德初河北轉運使劉德上言供備庫使白守素武勇請正除刺史真宗謂近臣曰將帥有功列狀具聞可也酬勞分秩自有常典綜何與焉監司之居外猶御史之在朝也真宗持賞罰之柄不欲移于群下聖意如此伏望陛下稽法先訓咨詢故典察迎合之言革朋比之風則天下幸甚臣纍䝉進擢班在侍從雖被論疏若已就勒劾即不敢與言事臣寮辨論曲直今既䝉就問不當專為申理以祈恩貸兼復建明事體庶裨聖政伏望聖慈特賜省覽謹具狀奏聞謹奏軍制臣竊見諸路兵馬自來分與諸將則統制不一臨時差撥則兵將不相諳練蓋由節制不分名級末辨是以難于處置臣聞有部分然後有號令有號令然後有賞罰今部分未立號令何由而舉賞罰何由而施以此用兵從古未有以臣愚見必若身之使臂臂之使指然後號令明而賞罰行今略定軍制件折如後逐路大將一人本路兵馬進退戰守皆專制之敗衄則在其責副二一人大將所制之事皆佐之敗衄則從坐列將十人分掌本路之兵步騎相參大率以五千為准不必定其數大將量其才而授之專主所將之軍其進退即禀命于大將一軍之勝負大將上其狀以賞罰之本路處置即皆不預隊將五十人每列將一人各給隊將五人所主隊兵之進退皆禀命于列將右臣所畫部分今略定名級伏乞朝廷講議節制頒下諸路仍乞不作臣寮上言所貴上禀廟略謹具狀奏聞鬻爵法臣前次上殿奏乞召募邊兵其間合要例物及修蓋官房須有所費竊慮三司未能應付臣欲乞朝廷創定鬻爵之法封出空名爵牒散下州郡人入粟授爵今定爵二等第一等爵許畜女使許使渾銀飲食器凡欲授第一等爵者如元係州府縣鎮城郭等第户即入粟一百石如不係户等即入五十石第二等爵許以珠金為婦女服飾如犯公罪許贖凡欲授第二等爵者入粟五百石右入粟每百石令入錢三十貫臣今約計授爵之數可得十萬家通兩等二數當得錢三百萬貫專充召募邊兵乞不别有支用其未有爵之人餘士族别無禁制外舉人曾經鄉貢并州郡牙校職員京百司人吏並與依第一等爵例將來詔下諸州仍乞立近限如不願授爵者即任便變易若限外有陳告並科違制之罪其畜女使及銀器者賞錢三十貫所畜女使從良銀器沒官珠金賞錢百五十貫珠金沒官所賞錢貫以犯事人家財物充內婦人無男夫及男女十五以下即不許人陳告所定爵名并更有合條約事件乞下中書門下參酌施行獲首級例一諸處軍隊或五十人或二十五人或不及二十五人為一隊凡獲賊首一級下准此擒生同依賞格所給管四等賜分與一隊將士如獲級五分以上定不除折數准此並以田戰元數為即前隊並與第五隊轉一管押軍隊人員為竒伏亦以依例皆准此十將以下差管押十人或所管不滿五千人殺獲與輸折相當五級加一等其二十級雖折相等亦第五等所管不滿百人殺獲與折相等獲七等與第四等七級加一等百人已上殺獲與折相當獲十級加一等其獲四十級已上與第五等轉二百人獲十五級加一等三百人已上加一等其獲六十級已上雖輸折相當亦第五等轉一管押軍隊使臣所管十人依此即閣門祇矦已上不滿三百人殺獲與輸折相當十級與第五等轉十級加一等其二十級已上亦第五等所管不過三百人所獲與輸折相當外十五級加一等其獲四十級已上亦第五等轉不滿五百人殺獲與輸折相當外獲二十級加一等其獲六十級已上亦第五等轉一主兵官員所領千人已上千人依此例供奉官所領殺獲與輸折相當外五十級與五等轉五十級加一等一百級已上亦第五等轉所領三千人已上殺與折相當獲一百級加一等亦與第五等轉一使臣軍員親自用命所管將士别無輸折或輸折相等者與五等轉不及所得者只給第四等賜即違主將令取首級者自依軍法餘皆准此一如得主將命專取某人而能殺獲者與我四等轉一殺獲賊中首領者與第五等轉如近上首領即與加等轉若加至第三等即本管人員亦與第五等轉若加至第一等即全隊及本營人員並與五等轉一軍陳所獲一百級須輸折相等已一除計首級令轉人數外别許酬奬得力軍員使臣共三人凡百級加三人上倍此數其十將以一應非軍陳合戰有所斬獲者一級與第五等轉一級加一等員軍陳例所管使臣人河南先生文集卷之二十二
