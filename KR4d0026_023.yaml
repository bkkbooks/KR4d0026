front:
  text: 河南先生文集卷之二十三
  hash: sha256:823bb2dedc6a7eb532159b982cb2ba13d1526a84b65caeced245ae60c15c4ab9
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_023-1a}
body:
  text: 奏議代耿傳作議攻守用屬國按地圖制兵師僃北狄議攻守夫西戎之弗庭久矣自繼廷盜起羗胡覆沒靈夏四州常嚴兵戍寨民困於饋輓然國家以至仁爲念誡乎黷武不􅋢七州之地委以旄鉞之重侯王許其世及金帛豐其歲給恩賞旣厚虜志益驕葢嘗有恭順之心修職貢之事含容豢養四十餘年迄于胡雛遂肆逆節自今春朝廷選命將帥分守邉郡轉輸兵甲修峻城壁三秦之人已聞騷動荷宿兵塞下曠日持久守禦之僃雖嚴供饋之力必屈此則方今自守之害也若興兵度磧虜必遠遁求戰則不可得欲㱕則爲所乘此又蹈至道之師也切計爲元昊之謀者不過中國外叛之人與北方桀黠之虜耳彼知中國重于出師利在守境教元昊以輕騎擾必離然後疏爵賞以招其酋豪舉大軍而覆其巢穴第河湟之黎康復漢唐之封略可計日而得矣若徇悠悠之談以太平旣久兵不可動但執保邉之說使邉城將師擁重兵據堅壘人人爲自固之謀臣恐數年之後財匱力屈恐朝廷之憂不在元昊也謹上用屬國昔漢發羌胡之兵夷郅支之壘唐出廻鶻之師平幽陵之叛前世得夷狄之効者多矣乃者㓙渠旅拒方議問罪而唃厮囉者輸誠欵請加討伐陛下講柔遠之略嘉憬俗之意爰詔有司撫納其使特假將鉞之重委以專征之任金幣溢于穹居官爵延于渠帥此誠得以夷狄攻夷狄之策然西戎貪而無耻不可待以誠信況唃厮囉項在先朝僻處西裔自恃犬羊之衆復信立遵之祇嘗抗章陳請兾復舊號犯我亭障及天水之境自爲曹瑋所敗殺戮過半遂竄跡荒服幾三十載今者砥厲聖德廻首面内當於制馭之道思適權宐之要昨聞專遣使者來告戎㨗率多兵仗之類曾無俘馘之獻舊傳唃厮囉之牙去平夏僅三十里彼嘗與大邦爲讎豈有一朝翻爲朝廷悉力而伐叛哉恐未得其誠効徒市虜以徼利耳爲䇿之要莫若擇朝臣之有材畧曉機事者由吐蕃使于廻鶻察其情僞而與之爲約使其出兵俟有所俘斬然後計級以金帛賞之戎狄之性貪于財利理當奮命凢賊之入冦利在剽掠若敕邉郡險其走集遠其斥候使賊至野無所得城不可及而觀釁蓄銳發機擊之蔑不克矣保塞羌胡亦不減七八萬候塞羌胡謂折李三族及明珠白馬部落之類常若邉臣之侵漁故屢有翻覆宐申敕鎭戎厚加撫馭賜堅甲絮衣利兵勁矢命諸矦監䕶使分路進討彼救左則攻右救右則攻左賊必疲于奔命且彼進無攻刼之利退有牽制之患數年之間兇黨必潰則可係大憨而戮藁街吿成功而薦祖廟矣謹上按地圖昔始皇之謀六國銳求督亢之圖充國之制西羌首上金城之略漢光武每議發兵先按地輿唐賈躭芳爲名相亦以華夷著稱則知圖諜之典歷代爲重國朝自繼迁之叛弃磧西之地年祀已遠圖書亾逸故其道里之迂直山川之險易世人罕有詳悉者元昊七州之地兼黨須之衆計其兵不過十餘萬而僣竊大號敢抗天威必須分兵境上張攻城略地之勢以僃王師之誅討今傳聞㳂邉諸州皆有賊名抄掠且北起天德西䀆儀渭合環十餘郡皆壓賊境賊兵不十萬不能布列諸路則其勢亦分矣朝廷圖任詩書之將調發精銳之卒副以屬國羌胡邉城射士塞上之兵不下二三十萬然而限以流沙之阻山川囘遠莫敢進軍故未能拔朔方之城馘元昊之首使其㳺魂于疆塲之外者幾一年矣近者王文忠潘湜失利皆以不知山川險易爲其邀擊此不按地輿之失非戰士材武之劣也昨聞屯田員外郞劉復曾進西鄙地圖頗亦周僃平夏圖諜祕府及民間當有存者伏望博加求訪命近臣叅較同異形于繪素而頒之于邉將俾其見利則按圖而出師冦出則分兵而守險此禦戎之急務也惟陛下畱意焉謹上制兵師夫制軍詰禁有國之大事忘戰必危聖人之至訓故秦人以極武而喪天下穆宗欲銷兵而失河朔則軍旅之際係強弱之本可不務乎昔在上古井田之賦詳矣降及唐漢亦調民爲兵唐自天寳之亂法制始紊于是四方諸侯皆聚重兵以自封植五代不經粤有黥溫自兹爲兵者不復知農耕之事惟坐而待食仰給縣官因㳂相襲迄今不易國家誕受天命光有萬國太平之運乘將百年然而食廩虛竭無豐羨之畜百姓凋弊有愁歎之聲究索其原皆兵之害計今四方廂禁諸軍殆至百萬其不可用者且半則穴食耗國固可知矣居常無事之際誠難更張今朔方不庭邉鄙聳動且契丹與元昊舅甥之族壤地相制勢同輔車又必連衡朝廷亦當虞北虜之變而預爲之防今禁御重兵䀆戍西鄙若北虜伺隙竊發爲患不細方今之宐莫若于秦晉趙魏齊魯之間置土軍三十萬度州縣版籍下民之數而分其部伍擇里富強武力之人而列爲將校每歲農隙督之講肄舉漢世故事命郡將臨試且農人勤力率皆壯健旣􅊢戎籍服于訓練不日則䀆爲精兵無事則俾之力田有警則發之禦冦縣官無尺帛斗粟之費而享富國強兵之利矣夫聖人不能違時亦不失時今因戎狄之釁而制軍旅之法此其時也在陛下施行而已臣料北虜之計以爲元昊之叛若數年之間兵革不解國家士馬疲于西鄙物力困于中原則必恐擁衆渝盟求逞其欲今若按民籍而科兵當農閑而講事武威震于外財用豐于内雖使冐頓復出結贊載生亦無以施其略若以軍戎之事重于更張則宐分遣使臣䀆選廂軍之伉健者配隷禁旅仍詔郡國罷募此輩茲亦豐財節用之一術也前史有制人之談孫子著伐謀之說在於此耳謹上僃北狄夫戎狄爲患厥惟舊矣自黄虞而降迄于隋唐與時盛衰寇盜中國葢以生知騎射之方俗鍾貪悍之性樂于戰闘不知仁義故弱則降附強則侵叛爲國者審其馭之之術而已馭之得其道則陵犯之謀寢失其道則陸梁之心生秦漢專尚武功生事先外不輟利害交相侵伐戎狄雖衰而中國亦困矣未爲䇿之善也夫善御戎狄者在乎任將帥訓士卒積金穀利器械無事則守有警則戰故守則有威戰則必克無他道也重威嚴僃而已漢宣帝之朝呼韓唐太宗之擒頡利皆俟其政令背錯上下乖亂然後取之未有無事而興兵時安而去僃也太祖皇帝以聖姿承五代之弊僭僞之國棊布天下中州之地纔方千里西疆秦隴南封江漢北不過潞惟東曁于海太祖委任將帥奮揚武德十六年間未嘗有戎狄之憂因元係庸蜀之方開荆衡之域東平建鄴南拓畨禺廓海㝢之伏祲扳皇綱之解紐太宗纘武吴越清吏乃親總六師問罪三晉一戎衣而天下大定于是覽禹貢之舊疆憫幽陵之汙俗屢遣良將喪行有城壁皆以郡縣爲名有民人皆以耕桑爲本雖引弓辮髮未䀆格于漢儀而紀號設官殆有殊于戎俗矣意者豈皇天將使臣屬于我俾自變其俗耶抑其君臣將革其政教謀戕害于我耶且國家自雍熈端拱之後迄于澶淵之盟未嘗得志于北虜今又其俗方改政令作法度竊觀其意似有貪漢之心焉夫北虜者易以威制難以德服其所由來尚矣而今之繼好弭兵逾三十載彼豈知仁義之方保盟誓之重或正以國家太平四方無事又歲貪金帛之厚賜耳合西戎不庭師旅于息不幸年穀凶歉民力虛困則虜必伺隙乘便畱我信使擁其腥羶之衆加以幽薊之師暴犯邉陲必爲㴱患矣夫僃預不虞武之善經也國家得不思爲之僃者乎旣思爲僃則宐講求將帥之材制定兵戎之法銛利器械儲積金穀俟其蔑弃信誓侵盜邊鄙奉辭則我直以戰則我壯是以激士卒之心折醜虜之勢然後皷之以聖德臨之以兵鋒復全燕之舊疆述神宗之先志無易于此矣謹上河南先生文集卷之二十三
