front:
  text: 河南先生文集卷之二十四申狀
  hash: sha256:28a5102d36412562282f3d4dfd9c4627f77ac847a640431ed50060436c346103
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_024-1a}
body:
  text: 申陜西招討司狀申揀選軍馬狀申軍前事宐狀乞招清邉弩手狀申鄕兵教閱狀申鄕兵弓手輪畨教閱狀申和顧人修城狀與延帥論事狀三首秦州申本路招討使狀申㨂選軍馬狀據前益州司戸王緘相示一書藁其書訖宋察推上呈内一事說邉卒年六十以上退在近地似有可采昨日見龎待制言邉芻甚貴弱馬宐令内地飼養酌此二說欲令延州芻馬作三等上等畱禦邉次等鄜州下等河中並且飼養候馬肥却令徃延州候到逐處㨂選内軍人有武萟者别配與馬便令却赴舊處若在延州便令換馬恐人人來換好馬其歩人年六十上便且令在河中駐劄不令在鄜州者慮以鄜州所屯皆精兵騎軍專以馬歩人專以年貴不相礙不拘人數令人員分處管係内此可以分延州大將來兩處事體似允旣有所聞便合陳荅可否乞賜裁酌申軍前事宐狀右某自今月十六日見西路巡檢探報到昊賊事宐賊衆見在大王井長城嶺牛羊柏井䑕寨等處共約十一萬續又探致賊衆于十五日過長城嶺來不知人數尋却囘舊處者某體問到上件地里並屬宿州與保安軍相接本州已牒都監未供僃赴保安軍駐劄十九日已起離去訖切緣今來趙部署在金明張龍圖又不兼本路軍馬公事切慮緩急賊衆侵擾臨時處置事無綂一伏乞速賜詳酌别降指揮乞招清邉弩手狀右某近會問到同州近准樞密院劄子添招本州禁軍支例物錢拾貫文廂軍支例貫文其禁軍别無軍額亦無等伏未曾添招者以某所見本州見今于本城諸軍㨂到清邉弩手准宣命依保㨗請受其保㨗屬侍衞歩軍司續是就糧禁軍卽清邉弩手亦合係歩軍司禁軍名額欲乞下本州依樞密院劄子内所支禁軍例物添招清邉弩手依上京第三等人材五尺二十已上或不以人材尺寸只誡路弩手及兩石以上少壯者招充所有廂軍例物會問到同州旣只支錢四貫文今恐添錢太多只支錢六貫文貴得允當乞賜裁酌指揮仍乞遍下攻西諸州施行伏俟台旨申鄕兵教閱狀一近降指揮内有所管指揮多少及人數不定去處即不拘指揮人數多少各均分爲三畨須管于一季中教遍切慮諸處只就人數均分臨時併合在别指揮或别都分不就本轄將較一處教習難以整肅欲乞三指揮以上並就金指揮教閱只如有四指揮處兩指揮作一畨餘兩指揮各爲一畨指揮更號並依此例其兩指揮處即以一指揮作一畨余一指揮分作兩畨並就金都教閱更不均分人教只有一指揮者亦依此例一月一替一年得三箇月教閱所貴均平或只定作三畨於一年内擇三個月農忙之際免教亦不廢三箇月教閱之實申鄕兵弓手輪畨教閱狀一體問同州第四等第五等人戸多無弓弩當教閱時逐旋借用雖有指揮官中良給錢數又緣只支得五七百文今問得弩一枝錢一貫五百文足弓一張錢七八百文足大率家貧少錢添助其間人材其有少壯者似此教閱恐不精熟某欲乞應係第四等第五等人戸如情願投清邉弩手者與􅊵本戸下弓手其第二等以上不得免放申和顧人修城狀一昨日曾聞欲和顧人夫修築延州外寨某以謂虜衆壓境必無應募者若率富民自募則取庸過多加之預借庸直方有徃者旣徃之後一聞虜衆虛聲必紛然潰散旣無姓名收捕須合富室再募恐奸猾太宰大族重困不若令鄜州和顧人夫或添富室自募旣然遠役則顧直有限兼應募者必衆却那鄜州兵大徃諸寨應役似㴱允當一金明所駐兵士將合請口食之勝半細計到白麫斤半若作麫餅三箇充一日食衆必大便逐日依舊令火頭煎湯俵食即恐磨戸只磨宐麥即白麫大貴也斟量所磨之數官收其半庸久給與麩則磨户元校者以麫數少即令間日或三日一次今請白米其自來軍行非次除日食合散餬數目並依舊例支散即不以此充數或有疑難者乞曉示諸軍兵士情愿請口食白米者亦聽則衆情可知兼今後常作准僃每遇軍行各給與三兩日食􅊵至塗中作飰或聞冦至則不暇食又省得預辦軍儲以致不虞與延帥論事狀三首前日某所論事退私有所未䀆謹具條陳如左一所論保安成主某雖石聞其威名亦未詳其綏御何如耳今虜衆壓境守將非大不善則不當更置且當以材者輔之者輔之者堪其事則代之不爲悅大凢敏于事者使之臨郡縣布威樹化即日而民洽者有之若要審上下之情僞練守禦之要害軍須物數周知其用雖使期月猶恐未䀆今虜之來朝夕不可料恐新者雖材而不暇施爲舊者或練習而不擾也一事所論爲將恩威某謂恩貴于周威則猶一而警百也昧者或反是樹恩以私于人故人有竊議厲威以束其下故洶洶反怒葢任于威而偏于恩也撫循以示恩則衆無不洽號令以申威則犯者獨誅如是法且立而怨何由興哉又聞用刑寧失于重不當失于疑昔張尚書王文康在屬犯盜者多死失于重不害也傳聞曹武穆嘗用人言誅一詢舍者以其誹謗語又近日苑振武重罰優人謂其慢已此三者人或疑其罪武穆至明振武至恕及其以疑而用刑則人皆疑其罪故不若輕罪而加重辟也一事虜聲言取劉懷忠近人率衆過長城嶺却還故處雖候者未必皆實就如此言恐虜勢稍東且保安城堅今承其聲又益以朱吉戍兵三千虜若果來使胡劉二族附保安不與之速戰稍進金明之師以爲聲援則虜未有得也所慮者虜前以數萬攻承平許懷德以數千兵徃投虜不測而遁後知之必咎前䇿秦州申本路招討使狀朝奉郞守太子中允直集賢院通判秦州軍州事上騎都尉賜緋魚袋尹某奉台旨與崔懿同于寨北納五里已來標立堡子今月某日與崔懿將帶手下兵士等到彼中立標竿次不委蕃賊于谷内揚塵挑闘某與崔懿商量令寨戸向前體探其寨戸等被蕃賊趈惹闘敵崔懿慮恐傷折着寨戸尋領手下兵士向前救應亦是被蕃賊趈惹闘敵崔懿尋令人于某處吿急某尋令指使張某量帶兵士徃前策應良久亦是趈惹押退不泳永旱某又慮傷折蓍兵士尋部領手下兵馬向前救應其蕃賊見某兵士向前闘敵即便敗走殺下蕃賊不少遂旋拖拽去斫到人頭若干個搶排旗鼓若干件燒蕩却族帳若干坐所有某等即不元奉招討指揮領兵破蕩作過李宮族帳只是奉招指揮于寨北約五里已來操立堡子不委被蕃賊趈惹又恐傷折着先去寨及續去崔懿手下兵士所以向前救應乗勝趕趂十五餘里指使張某燒蕩却上件族帳所有某手下兵士有虎翼等三十五人傷中謹具狀申聞河南先生文集卷之二十四
