front:
  text: 河南先生文集卷之二十五
  hash: sha256:51c44ef6d6118b5e97ee68e589e4f6c6d3509e0a37cef432ad350196e345518b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_025-1a}
body:
  text: 申狀申宣撫韓樞密乞修安國鎮狀申四路招討司論本路禦賊狀并書分析公使錢狀申四路安撫使范資政乞于乾華州聽候朝旨狀申宣撫韓樞密乞修安國鎮狀右某今相度到瓦亭寨地形窄隘兼本寨四面俱無戰地若駐大兵在彼如賊馬入冦以至却回雖見得可以襲逐又緣地勢難以出兵若賊馬自涇陽谷入來倒把定彈箏岐路則彼處兵馬進退不得兼頭回時或却往涇陽谷云亦無有扼其歸路以此駐劄大兵不為穩便自本寨以西直至師子堡以來䀆在谷道及兩面來路頗多俱非控扼之處今蹈行到安國鎮堡子下而大川內西控瓦亭大路比當涇陽谷口自來太鎮雖有重壁又却在南坡上絶然高峻裡面又無人戶居止其居民皆在城外城下居住去年䀆遭燒蕩今復于上件大川內修建城寨一所將來如遇賊馬入冦即將昨來預議指揮部署下瓦亭兵馬却移在此處即東西北三面俱出將兵馬如未欲出戰即足為諸處聲援堅壁指重遏其奔衝如見得賊勢可以襲逐即自據勝地排布軍馬兼分擘遊兵照管得北原上賊馬來路所有接應鎮戎德順兩處雖比瓦亭遠著四十里其如不拘困却兵勢可以遠作聲援況鎮戎德順壁堅固逐處戰守兵數與舊不同若且令固守即不妨分壁奇兵接次應援設使部署兵在瓦亭駐劄雖與逐處相近亦不可輕出天兵以此利害分明令寫畫到地圖并計科到功科狀一本謹具狀申宣撫使申四路招討司論本路禦賊狀并書一沿邉弓箭手自來每遇賊馬入冦並各潰散蓋緣逐地分各令守把多者不過一二百人當苗稼成熟之際此中鈔劫足能禦拜若遇賊兵大至則須至逃潰況今來已定正月則未能卒破求戰則不與之較既勝負未分必無深入奔衝之理如使弓箭手及巡檢兵士防托守把若非迎戰敗衄則必望風驚潰自然成壘震懼大軍喪氣此亦取敗之一端欲乞更不降指揮諸處于邉壕守把防托所貴不致敗一將來賊馬若的然于秦鳳路冦掠本路除合差那兵馬救援外緣山外與秦隴地里相接本路署將帶兵馬赴德順軍駐劄及差那驍勇將士與山外巡檢劉滬同于靜邉准僃賊兵頭回覓便邀擊却今見令彭陽城駐劄一將軍馬赴瓦亭照應某上覆招討侍郎日近邉報益多慮恐必來入冦某輒有所見軍行利害數事雖與部署諸官熟議皆合緣皆是出戰官員今所議持重不戰即難為連署謹附管內機宜右輅詣節下乞賜詳酌早降處分分析公使錢狀准公文准都轉運司牒准敕據陜西都轉運司體量到洙前知渭州借過軍資庫錢糧等取問洙曾與不曾于省庫內支借著錢銀作何使用自後曾與不曾交還具逐件招承文狀者右具如前洙先於慶曆三年七月內奉敕差知渭州到任後取索到前知渭州王沿已後支用公使錢體例計度每年合使錢數及勘會到本州見管指使使臣及郡虞侯已上共六十餘人主兵官及通判職官參謀等近二十人共八十餘人逐日例破當食納計錢共七貫每月計二百一十貫逐月五次聚食一次張樂共約錢三十貫文每季一次大排管設軍員二百貫非次專使撫問或教場內軍員喫食官員射弓及添助造酒糯米並節辰送物逐季又約一百貫文每一季都計使錢一千貫文依此約度每年合用錢四千貫文王沿在任時支公使錢三十貫後來除依王沿例别給米麥外只支錢二千貫勘算每年合少錢二千貫洙遂訪問勾當官吏等所少錢作何出辦其人等並言自來于諸處回易可以得足洙遂體問到前來張亢在任日並鄰近州郡涇州鄭戩慶州滕宗諒將銀往西川收買羅帛及買上京交鈔並令人解州般鹽計三處回易鄭戩布將銀于西川及秦州收買羅帛並買上京交鈔亦是三處回易即不令人于解州般鹽洙相度得差人解州般鹽委是不便其西川又緣地遠難以差人往彼只可于秦州買物及上京交鈔兩處回易其勾當人兼言將銀入西川則利息甚多若只于兩處回易恐支用不足洙即不曾聽從兼體問得諸處及本州自來並是於軍資庫或隨軍庫支撥係官錢作本回易有此體倒洙以本州除逐季請撥公使錢外别無不係省錢若不于官庫支借即無由得錢回易實曾遂度印押頭子委勾當人于軍資庫支借錢銀往秦州回易及收買上京交鈔並係公用庫赤曆支收知州通判鹽官通桿即不一一記得貫伯兩數及支出月日今看詳陜西都轉運司奏狀稱借出錢二千貫銀五百兩委是洙在任日借出是實兼洙記得只二次令人將銀往秦州收買羅帛一次令人將交鈔上京其秦州羅帛即是洙在任日買到令勾當官員使臣依市價賖買與諸色人共上京鈔交回買到物帛即是洙離任後來有狄青程勘王素相繼知州即不知于何人任內賖散與人兼陜西都轉運司己磨勘到見缺錢人計二百七十九戶即是已見得錢數歸著今乞令渭州勒勾當人錢析洙在任日所借到錢銀回易到物色多少是元借本錢多少是收到利錢若干於洙任內收係若干於後來知州任內收係其軍資庫元供出本錢及銀于是何年月却于本庫送納即見得交還與未曾交還又緣洙于慶曆三年八月內到任九月後便值西界事宜緊切洙與主兵官員逐日隄僃略無暫暇雖纍准朝旨令凡有管設不得減削及許令回易洙只是委管勾當使官員及公人等一面主管回易及支收使用其買到物帛亦不曾親自點檢所有上項分折每年合使用錢數並是小作納算計仍乞取洙離任後逐月所支過公用錢數細定月分與洙所約度到費用數目比類方見使用的數所分析前項事理並皆詣實謹具狀申河東轉運司謹録狀上申四路安撫使范資政乞於乾華州聽侯朝旨狀某昨自潞州赴渭州制勘院照􅍟公事至永興軍經陜西都轉運司陳狀為先曾知渭州涇州將來奏案後若在邉上州軍聽敕切慮於事體不便及邠州永興軍又是前兩府知州亦難以在彼欲乞于乾華州聽候朝旨如該合收禁亦乞依條貫施行自後即未知都轉運司曾與不曾聞奏洙已於六月十日蒙制勘院責保送渭州知在見在館驛內安下比至伺候敕命須是一月以上切緣洙去年方離渭州即今本州官員多是某在任日到任館驛內人有衆官安下常有官員往還事體深屬不便伏望四路安撫資政特賜據狀僃録開奏并詳某前于陜西都轉運司所陳事理早降指揮伏候台旨河南先生文集卷之二十五
