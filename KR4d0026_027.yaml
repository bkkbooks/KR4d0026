front:
  text: 河南先生文集卷之二十七
  hash: sha256:e350441428cb4dedc3b30a496192806f0e7eb12209df190c0fb0d57fb47cd1e4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_027-1a}
body:
  text: 五代春秋後唐末帝清泰元年四月庚午帝即位乙酉改元誅康義誠朱洪昭馮贇丙申葬明宗皇帝于嶽陵八月蜀王知祥薨九月契丹冦雲州二年四月契丹冦新州六月契丹冦應州十月閔王延鈞薨大飢二年五月河東石敬瑭拒命張敬達楊光遠帥師討河東鄴都軍亂逐劉延皓范延光帥師討平之九月契丹救河東張敬達及契丹戰于城下敬達師敗績退師晉安契丹圍晉安戊申帝北征次懷州延州軍亂殺楊漢章閏十一月楊光遠害張敬達以晉安叛降于敬瑭丁丑帝還京師庚辰敬瑭迫京師辛已帝崩于玄武樓晉高祖天福元年十一月帝在太原宮降制改元閏月庚辰帝至京師以幽州及鴈門以北地賂少帝天福七年六月乙丑帝即位於鄴都八月高行周克襄州誅安從進大蝗十一月葬高祖皇帝於顯陵八年二月乙丑帝還東京四月戊申朔日有食之十一月青州楊光遠叛附于契丹契丹入冦大飢開運元年正月契丹陷興州乙酉帝北征次澶州契丹陷博州三月及契丹戰于戚城師敗績甲寅帝還東京六月復樞密院河決滑州七月改元八月閩人朱文進殺其君延義九月庚午朔日有食之十二月丁已楊光遠降赦之癸酉誅楊光遠契丹入冦大飢二年正月帝北征二月次澶州三月契丹陷祁州杜威及契丹戰于陽城契丹敗績四月甲申帝還東京八月甲子朔日有食之大飢三年二月壬戌朔日有食之五月契丹入冦大水十一月杜威帥師討契丹十二月師次中渡杜威叛以師入于契丹皇甫遇沒于師相州張彥澤冦京師彥澤殺桑維翰四年正月帝遜于北郊契丹德光入京師誅張彥澤癸卯帝遜于遼陽漢高祖元年二月帝即位于太原宮稱天福十二年三月契丹德光遁歸死欒城五月丙申帝東幸六月殺郇公從益甲子帝至京師楚王希範薨閏七月鄴都杜威拒命八月越王弘佑薨九月庚辰帝北征十一月杜威降赦之十二月癸已帝至自鄴都乾祐元年正月乙卯改元帝不豫丁丑帝崩于萬歲殿隱帝元年二月辛已帝即位誅杜威三月河中李守正拒命盜以京兆叛附于守正六月戊寅朔日有食之七月王景崇以鳳翔叛附于李守正郭威帥師圍河中越人廢其君倧十一月殺李嵩士申葬高祖皇帝于春陵二年二月丙子黑霧四寒五月京兆降六月癸酉朔日有食之郭威克河中誅李守正十月契丹入冦十二月趙暉克鳳翔誅王景崇三年二月初學樂閏六月癸已大風拔木十一月甲子朔日有食之丙子誅楊邠史弘肇王章鄴都郭威舉兵向京師澶州李弘義滑州宋延渥叛附于郭威甲申慕容彥超帥師及郭威戰于劉子陂帝視帥師敗績侯益焦繼勳叛乙酉帝崩于師郭威入京師軍大掠乙丑皇太后令立子贇馮道往徐州迎贇誅蘇逢吉劉銖契丹入冦十二月郭威帥師北討次澶州還師壬戌威入京師楚人馬布蕚弒其君希廣王峻弒湘陰公于宋州周高祖廣順元年正月丁卯帝即位八月葬漢隱帝楚人殺蕚十月吳滅楚十二月兖州慕容彥超拒命二年四月丙戌朔日有食之五月庚辰帝東征戊辰次兖州城下乙亥克兖州六月戊戌帝至自東征九月契丹入冦朗州劉言逐吳人復楚地也三年正月以戶部田賜民二月誅王峻六月大水十二月誅王殷丙午克之丁卯次楊州吳王以江北地來獻四月壬申帝至自南征六年三月甲戌帝北征五月次瓦橋關寧瀛漠三州來降帝不豫班師六月甲戌帝至自北征癸已帝崩于萬歲殿恭帝顯德六年六月甲午帝即位十一月壬寅葬世宗皇帝于慶陵七年正月甲辰帝遜位于我宋河南先生文集卷之二十七
