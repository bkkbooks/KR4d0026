  - {type: variant, offset: 4, length: 945, content: 河南府請解投贄南北正統論一首攻守策頭問耿傳一首憫忠辯誣兵制退說好惡解二篇河南府請解投贄南北正統論一首論曰天地有常位運曆有常數社稷有常主民人有常奉故夫王者位配於天地數恊于運曆主其社稷庇其民人示天下無如之尊也無二其稱也故易曰大寶史曰神器苟社稷有主而僣其稱號則其名曰盜其位曰竊示萬民可得而誅後世可得而貶千古不易之道也自晉室不綱五胡猾夏元帝艱難否運奄有東南景命未融不失舊物迄於恭帝百有四年宋祖有代德而受外禪復六十年而禪齊齊二十六年而禪梁梁五十年爲侯景所簒梁元帝攘戎狄而簒舊位遷都江陵三年爲西魏所滅則東南之運絶矣始後魏道武以晉太元二十一年即位都代後六代孝文遷都雒陽後復六代孝武遭高歡之難遷都長安是爲西魏西魏三代恭帝二年始平江陵江陵平一年禪于周周二十五年而禪于隋隋三十八年而禪于唐推而言之則東南承襲之運至江陵陷沒當傳于魏魏傳周周傳隋隋傳唐爲得其實而江陵之陷陳霸先立梁元之子方智爲帝復不能輔而代其位是爲陳蕭詧據一州之旅稱帝三世是爲後梁魏孝武之西遷也高歡立清河王子善見爲帝稱東魏旣而高歡子洋簒其位是爲北齊而前史列東魏後梁並簒爲帝號北齊陳氏各有國書逆順不分稱謂紛揉若以蕭詧爲中興之主霸先是曰元兇霸先爲受命之君隋氏當爲叛國昔蜀先主以宗室之胄據有全蜀爲魏所滅遂黜其帝呉孫權以三州之衆傳及四世爲晉所得竟斥其名以義則蕭詧未及漢中以地則霸先豈偕孫氏東魏之立不異于聖公盆子北齊之僣有同乎劉聰石勒但後梁東魏有國之後可正以王名陳氏北齊竊號之臣宐斥爲叛寇或曰子以魏平江陵始爲正統則道武而下亦不可以稱帝列紀邪北齊後周俱承魏禪豈獨帝周而虜齊耶予曰不然夫魏武晉宣未享於皇極陳壽干寶各標其帝號彼爲得理此復何嫌況魏氏孝文已來文物太盛三分天下有其二至于末世竟平江表在昔秦爲列國太史公尚爲立紀者葢以其後世能成帝業也此則恭帝而上不猶愈于莊襄前耶但統而言之平定南土方爲正統非謂道武而下不可稱帝列紀也且孝武避狄于秦安定公披草萊建宫室重延魏祚踰十二紀而受其禪魏傳其壐齊爲其虜梁爲其臣隋承其運非帝而何噫周之呉楚太伯鬻熊之後也怙恃其衆僣號稱王仲尼修春秋而夷狄之聖人之旨垂戒于方來所以亂臣賊子懼也惜哉唐太宗世修五代史葢執筆史官多齊陳之人或其勲列之後是以各夸本國並列正史失之一時誤及千古至使亂臣賊子謂方面可據位號可竊爲下莫得而誅後世莫得而貶不其惑哉不其惑哉, WYG: ''}
