  - {type: variant, offset: 2346, length: 638, content: 兵制今之戎狄地兼燕涼然彊大之勢未過乎前世中國士卒專力武事非若古者籍兵於民農戰兼用者也是中國兵勝於古夷狄不勝於古也古者中國鞭笞四夷而役屬者有之給繒帛以懷來者有之與之戰或勝或負者有之今厚賂以厭其求惟恐不及或與之較未嘗一勝焉其故何哉非夷狄之兵彊非中國之兵弱法制之失也何謂法制之失以吏事而制戎事也爲今而言策之長在戰與守策之失在禦與校廢策之長用策之失所以亟敗也假以虜事言之若聞其將寇我境我之大將不計敵衆寡之勢不論戰遲速之利必分兵禦之禦之不勝制令者曰吾知出兵而已行者曰吾知奮命而已朝廷必薄其責議者亦置其罪苟不禦之雖全其師朝廷誅其逗畱議者稱其畏懦此所以必禦之也若聞一城被圍不計受攻之急緩不論城壘之堅脆必䀆銳救之救之不勝制令者曰吾知救之而已行者曰吾知死之而已朝廷必薄其責議者亦置其罪苟不救之雖城獲全朝廷咎其不進議者言其坐觀此所以必救之也禦與救非將之罪也以吏事制戎事法制之失也或曰禦亦戰也救亦戰也禦與救皆爲失策何謂戰爲長策也夫禦與救非利戰不得已而戰也非我利則敵之利也所謂戰者我利則戰不利則不戰先計而後戰者也先計而後戰鮮不勝矣不幸而不勝者將之罪也然則中國之爲守􅍯久矣何得謂守爲長策而廢不用也所謂守者方面之守非一堡一障之守也非尺寸之地守也今敵入吾地不計衆寡利害而禦之敵圍吾城不計堅脆急緩而救之禦之必敗救之必敗兵潰于外民潰于内失所以爲守矣守方面者異于是使城自守母望救兵之出葢兵不出則勢不分勢不分則有以待之夫待之者不戰則敵疑作戰則敵懼必戰則敵北能守所以辦戰能戰所以濟守明戰守之利而不得志於夷狄者未之有也, WYG: ''}
