  - {type: variant, offset: 3596, length: 0, content: '', WYG: 廬未及對以疾還第即上章求解政事七月授户部侍郎資政殿學士知陜州是冬改元推恩遷吏部二年夏徙知河陽秋再知河南府十一月被召加檢校太傅充樞宻使明年七月加同中書門下平章事未幾痬發于手浸淫以至大病享年七十二公幼得先君所聚書讀之至周官春秋尤極其義故為文章必本制度臨政長於斷事雖天性通悟發為事業迹其源流盖有助焉景徳中天子嘗命近臣修書時楊文公在翰林公止太常属丞制以二公並命論者以材名等夷非復爵位差降也臨益部日會嵗饑衆心頗搖公曰往時蜀擾非有雄豪為倡先特以攘寇不息驅而合之浸大耳今欲制其萌莫若禁盗於是嚴盗法犯者一切皆死出金榖募告者又俾爪牙吏擿其囊橐畫謀者久必就拘或示慘刑蜀人股栗嵗中遂無盗然用它法皆寛平詿誤多貸免嘗有卒夜告其軍将亂公覆状立辨其偽斬之軍士皆感泣蜀舊以季春糴廩米以濟民言利者増其直公抗}
