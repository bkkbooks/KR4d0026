  - {type: variant, offset: 2922, length: 0, content: '', WYG: 欽定四庫全書河南集巻二十二宋尹洙撰奉詔分析董士㢘奏臣不公事狀具衘臣尹某准中書劄子著作佐郎新差知蔡州確山縣事董士㢘奏臣不公事奉聖㫖令臣疾速分析詣實入馬逓聞奏臣今依准劄子内畫一分析如後一韓琦尹洙起謀入界至好水川因任福妬功耿傳狂狷致兵敗折數萬人尹某作閔忠辨誣文誑惑中外令李仲昌刻石掩韓琦惡今來尹某自知虛誑却毁棄刻石碑子臣今詳董士㢘所稱韓琦及臣起謀入界欲乞于中書樞宻院檢詳陜西經畧司先奏攻守二䇿朝廷擇用攻䇿後來曾與未曾入界及好水川接戰因與不因起謀入界致得敗衂所有憫忠辨誣二文臣實有此撰述以勸忠義乞檢㑹任福等敗衂事及韓琦先繳進任福下孔目官彭忠所收得耿傳親書署朱觀名誡任福令持重文字與臣所撰二文照騐即知有無虚誑臣元不曽令人刻石今據傳寫到本是乾州判官李師錫立石即不是李仲昌欲乞㑹同本州因何人立石後來於何年月日何人毁棄即知詣實兼臣見諸處尋求石本候尋得别具繳連進呈次一尹某在渭州專擅將官錢百貫入巳使用并借官錢與官員還債并支出軍資庫錢落下赤厯都轉運司程戡曾差儀州華亭主簿王資磨勘見得侵欺官錢的實臣勘㑹渭州應係官錢及公使錢各有監主及文厯拘管乞下本州勘㑹及將臣任内公使錢文厯磨勘即見得有無欺隠所有借錢與人還債臣初到任為禮賔副使孫用曾于鄜延路在狄青手下使喚得力本人為自軍職授官在京借却人錢物遂與狄青各借與公使錢今本官于料錢内還納所有軍資庫自有通判録事㕘軍管勾臣即不知落下赤厯因依乞下本處勘㑹轉運司差官磨勘得見何人侵欺後來作何發遣即得詣實右謹具如前所分析顯是詣實所有臣先撰憫忠辨誣二文今抄録粘連在前謹具狀奏聞謹奏覆奏監察御史李京劄子狀准河東都轉運司差官准勅取問臣前知渭州日借支過銀錢事并連到監察御史李京劄子言切聞韓琦罷樞宻副使因董士㢘疏論水洛城并處置邊機不當事伏縁韓琦之過自尹洙始今琦已罷柄住洙則仍守舊官人言藉藉于理未順雖聞已降指揮令尹洙分析又縁事與韓琦不殊切慮别有指説遂至紛拿兼聽知魚周詢相度回日繳奏到邊民被害之家指論尹洙文狀事甚明白欲望朝廷檢㑹魚周詢前奏并今來董士㢘所陳其尹洙早賜處分所貴與韓琦行罰頗均方協衆望右謹具如前臣已依應勅命供析前知渭州日依例支錢銀回易應副公用去訖臣切見李京上言雖聞已降指揮令臣分析切慮别有指説遂至紛拏臣切詳故事御史得風聞言事既稱風聞則容有不實是以所言雖虚皆不及坐朝廷若以事狀顯明不須按覆即時裁處自繫聖斷御史所守則有職分若京之所陳雖増臣過惡萬端或}
