  - {type: line-break, offset: 0, content: '', id: KR4d0026_SBCK_022-1a01}
  - {type: variant, offset: 0, length: 832, content: 河南先生文集巻之二十二奏狀奉詔分析董士㢘奏臣不公事狀覆奏監察御史李京劄子狀軍制鬻爵法獲首級例奉詔分析董士廉奏臣不公事狀具衘臣尹某准中書劄子著作佐郎新差知蔡州確山縣事董士廉奏臣不公事奉聖㫖令臣疾速分析詣實入馬逓聞奏臣今依准劄子内畫一分析如後一韓琦尹某謀入界至好水川因任福妒功耿傳狂指致兵敗折數萬人尹某作閔忠辨誣文誑惑中外令李仲昌刻石掩韓琦惡今來尹某自知虛誑却毁弃刻石碑子臣今詳董士㢘所稱韓琦及臣起謀入界欲乞于中書樞宻院檢詳陜西經略司先奏攻守二䇿朝廷擇用攻䇿後來曾與未曾入界及好水川接戰因與不因起議入界致得敗衂所有憫忠辨誣二文臣實有此撰述以勸忠義乞檢㑹任福等敗衂事及韓琦先繳進任福下孔目官彭忠所收得耿傳親書署朱觀名誡任福令持重文字與臣所撰二文照驗即知有無虚誑臣元不曽令人刻石今據傳冩刻本是處州判官李師錫刻石即不是李仲昌欲乞㑹問本州因何人立石後來于是何年月何人毁弃即知詣實兼臣見諸處尋求石本候尋詳别繳具連進呈次一尹某在渭州專擅將官錢數百貫入已使用并借官錢與官員還債并支出軍資庫錢落下赤曆都轉運使程戡曾差儀州華亭主簿王資磨勘見得侵欺官錢的實臣勘㑹渭州應係官錢及公使錢各有監主及文曆拘官乞下本州勘㑹及將臣任内公使錢文曆驅磨即見得有無欺隠所有借錢與人還債臣初到任爲禮賓副使孫用曾于鄜延路在狄青手下使喚得力本人爲自軍職授官在京借却人錢物遂與狄青各借與公使錢會官與料錢内還納所有軍資庫自有通判録事㕘軍營勾臣即不知落下赤曆因依乞下本處勘㑹轉運司差官磨勘得見何人侵欺後來作何行遣即知詣實右謹具如前所分析並是詣實所有臣先撰憫忠辨誣二文今抄録粘連在前謹具狀奏聞謹奏覆奏監察御史李京劄子狀准河東都轉運使差官准敕取問臣前知渭州日借支過錢糧事并逓到監察御史李京劄子言竊聞韓琦罷樞宻副使因董士㢘疏論水洛城并處置邊機不當事伏縁韓琦之過自尹洙始今琦已罷柄任某則仍守舊官人言籍籍于理未順雖聞已降指揮令尹某分析人言事與韓琦不殊切慮别有指説遂至紛拏兼聽知魚周詢相慶囘日繳奏到邊民被害之家指論尹某文狀事甚明白, WYG: ''}
