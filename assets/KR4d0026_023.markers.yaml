  - {type: variant, offset: 1860, length: 696, content: 僃北狄夫戎狄爲患厥惟舊矣自黄虞而降迄于隋唐與時盛衰寇盜中國葢以生知騎射之方俗鍾貪悍之性樂于戰闘不知仁義故弱則降附強則侵叛爲國者審其馭之之術而已馭之得其道則陵犯之謀寢失其道則陸梁之心生秦漢專尚武功生事先外不輟利害交相侵伐戎狄雖衰而中國亦困矣未爲䇿之善也夫善御戎狄者在乎任將帥訓士卒積金穀利器械無事則守有警則戰故守則有威戰則必克無他道也重威嚴僃而已漢宣帝之朝呼韓唐太宗之擒頡利皆俟其政令背錯上下乖亂然後取之未有無事而興兵時安而去僃也太祖皇帝以聖姿承五代之弊僭僞之國棊布天下中州之地纔方千里西疆秦隴南封江漢北不過潞惟東曁于海太祖委任將帥奮揚武德十六年間未嘗有戎狄之憂因元係庸蜀之方開荆衡之域東平建鄴南拓畨禺廓海㝢之伏祲扳皇綱之解紐太宗纘武吴越清吏乃親總六師問罪三晉一戎衣而天下大定于是覽禹貢之舊疆憫幽陵之汙俗屢遣良將喪行有城壁皆以郡縣爲名有民人皆以耕桑爲本雖引弓辮髮未䀆格于漢儀而紀號設官殆有殊于戎俗矣意者豈皇天將使臣屬于我俾自變其俗耶抑其君臣將革其政教謀戕害于我耶且國家自雍熈端拱之後迄于澶淵之盟未嘗得志于北虜今又其俗方改政令作法度竊觀其意似有貪漢之心焉夫北虜者易以威制難以德服其所由來尚矣而今之繼好弭兵逾三十載彼豈知仁義之方保盟誓之重或正以國家太平四方無事又歲貪金帛之厚賜耳合西戎不庭師旅于息不幸年穀凶歉民力虛困則虜必伺隙乘便畱我信使擁其腥羶之衆加以幽薊之師暴犯邉陲必爲㴱患矣夫僃預不虞武之善經也國家得不思爲之僃者乎旣思爲僃則宐講求將帥之材制定兵戎之法銛利器械儲積金穀俟其蔑弃信誓侵盜邊鄙奉辭則我直以戰則我壯是以激士卒之心折醜虜之勢然後皷之以聖德臨之以兵鋒復全燕之舊疆述神宗之先志無易于此矣謹上, WYG: ''}
