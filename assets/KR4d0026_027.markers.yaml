  - {type: variant, offset: 1225, length: 0, content: '', WYG: 欽定四庫全書河南集附録本傳尹洙字師魯河南人天聖二年進士及第絳州正平縣主簿調河南府户曹參軍遷安國軍節度推官知邵武軍光澤縣舉書判拔萃改山南東道節度掌書記知河南府伊陽縣縣民有女幼孤而冐賀氏産鄰人證其非是而藉之後鄰人死女復訴請所籍産乆不能决洙問以若年幾何曰三十二乃按咸平籍二年賀死而賀妻劉為户詰之曰若五年始生安得賀姓邪女遂伏以薦得召試為館閣校勘遷太子中允㑹貶范仲淹牓朝堂洙自言與仲淹有師友之義乃請罪於朝落校勘復為掌書記監唐州酒税時西北乆安洙作叙燕息戍二篇以為武備不可弛於世丁父憂服除復為太子中允知河南府長水縣趙元昊反大將葛懷敏辟為經畧判官後劉平石元孫戰敗朝廷以夏竦為經略安撫使仲淹韓琦副之復以洙為判官又詔竦等議攻守計乃具二策令琦與竦詣闕奏之加集賢校理上命用攻策遂趣延州謀出兵仲淹持不下還至慶州㑹任福已敗於好水川因發慶州部將劉政鋭卒數千趣鎮戎軍赴救未至賊引去夏竦奏洙擅發兵降通判濠州當時言者謂福之敗由隨軍耿傅督戰太急後得傅書乃戒福使持重母輕進者洙以傅文吏無軍責而死行陣被誣作憫忠辨誣二篇未幾轉洙知秦州辟通判州事加直集賢院上疏曰文帝盛徳之主賈誼論當時事勢猶云可為慟哭孝武帝外制四夷以彊主威徐樂嚴安尚以陳勝亡秦六卿簒晉為戒二帝不以危亂滅亡為諱故子孫保天下者十餘世秦二世時關東盜起或以反者聞二世怒下吏或曰逐捕今盡不足憂乃説隋煬帝時四方兵興左右近臣皆隠賊數不以實聞或言賊多者輒被詰責二帝以危亂滅亡為諱故秦隋之宗社數年為墟陛下視今日天下之治孰與漢文威制四夷孰與漢武國家基本仁徳陛下慈孝愛民誠萬萬於秦隋至於西有不臣之虜北有彊大之隣非特閭巷盜賊之勢也自西虜叛命四年旁塞苦數擾内地疲逺輸兵乆於外而休息無期卒有乘弊而起兵法所謂雖有智者不能善其後當此之時陛下當夙夜憂懼所以慮事變而塞禍源也陛下延訪邊事容納直言前世人主勤勞寛大未有能逺過者也然未聞以宗廟為憂危亡為懼此賤臣所以感憤於邑而不已何者今命令數更恩寵過濫賜與不節此三者戒之慎之在陛下所行耳非有難動之勢也而因循不革弊壞日甚臣是以謂陛下未以宗廟為憂危亡為懼者以此夫命令者人主所以垂信於下也異時民間聞朝廷降一命令皆竦視之今則不然皆相與竊語以為不乆當更既而信然此命令日輕於下也命令輕則朝廷不尊矣又聞羣臣有獻忠謀者陛下始甚聽之後復一人沮之則意移矣忠言者以信之不能終頗自絀其謀以為無益此命令數更之弊也夫爵賞陛下所持之柄也近時外戚内臣以及士人或因縁以求恩澤從中降㫖而陛下不知故臣願先正於内以正於外然後忠謀漸進綱紀漸舉國用漸足士心漸奮夷狄之患庶乎息矣伏惟陛下深察秦隋惡聞忠言所以亡逺法漢主不諱危亂所以存日新盛徳與民更始則天下幸甚改太常寺丞知涇州以右司諫知渭州兼領涇原路經畧公事㑹鄭戩為陜西四路都總管遣劉滬董士㢘城水洛以通秦渭援兵洙以為前此屢困于賊者正由城塞多而兵勢分也今又益城不可奏罷之時鄭戩已解四路而奏滬等督役如故洙不平遣人召滬再不至命張忠往代之又不受於是令狄青械滬士㢘下吏戩論奏不已于是徙洙慶州而卒城水洛又徙晉州遷起居舎人直龍圖閣知潞州士㢘詣闕上書訟洙乃遣御史劉湜就問獨不能得洙罪止坐假公用錢與部將孫用及私自貸貶崇信軍節度副使孫用昔本軍校嘗自京師取息錢至官不能償洙與狄青惜其材可用遂假公使錢使償之徙監均州酒税感疾㳂牒至南陽訪醫卒年四十七洙内剛而外和與人言必極辯其是非遇事無難易勇於敢為至前世治亂㳂革之變靡不該實人有疑難不能通洙為指畫講解皆釋然自得尤長於春秋文章自唐宋厯五代氣格卑弱至本朝栁開始為古學天聖初洙與穆脩大振起之有集二十七巻子樸柆其兄源亦以文學名於世終太常博士墓表韓琦公諱洙字師魯其先太原人曾祖誼以道晦亂世不仕祖文化始以材行興其家官至都官郎中贈刑部侍郎父仲宣舉明經累長郡邑㢘恕明决所至以循吏稱終虞部員外郎以公貴贈工部郎中葬其父河南今為河南人公㓜聰明善學無所不通尤長於春秋善議論參質古今開判疑滯問者欣服之天聖二年登進士第授絳州正平縣主簿厯河南府户曹㕘軍邵武軍判官舉書判拔萃遷山南東道節度掌書記知河南府伊陽縣時天下無事軍政闕不講以兵言者為妄人公乃著叙燕息戍論十數篇以斥時弊時人服其有經世之才文康王公知而薦之召試充館閣校勘時夏人冦涇原殺部署任福公時在慶州得涇原求援書即移文慶帥率其部將劉政鋭兵數千人便道走鎮戎未至賊引去夏公奏公為專徙通判濠州又改秦州遷知涇州徙渭州兼管勾涇原路經略部署司事涇原乘葛帥懷敏覆軍之後傷夷殘缺千罅百漏公夙夜撫葺一道以完時宣徽使鄭公為陜西四路帥主静邊寨主劉滬議遣其屬官著作佐郎董士㢘與滬於章州堡南入諸羌中開道二百里修水洛城以通秦渭之援兵公曰賊數犯塞必併兵一道五路帥之戰兵嘗不登二萬人而當賊人舉國之衆吾兵所以屢為賊困者由黄石河路來援雖逺水洛路二日而援師安然以濟今無故奪諸羌田二百里列堡屯師坐耗芻糧不勝計以兾秦援一二日之速則吾兵愈分而邊用不給矣乃奏罷之便詔從之㑹鄭戬已罷改知永興軍乃署前帥牒飭滬等督役如初二人者遂不奉詔興作不已公遣人召滬者再不至乃命瓦亭寨主張忠代滬滬仍不受代部署狄公於是親至順徳軍攝滬士㢘下獄差官按問而鄭比奏本道沮滬等功朝廷卒薄滬等罪徙公慶州而城水洛焉㑹慶帥孫公請終任改知晉州慶厯四年契丹遣使報西伐元昊詔河陜三路要郡皆擇人徙知潞州當范公之在二府也余安道歐陽永叔輩並為諫官天下屬望諸公日竭忠獻納不避權貴而公方勤勞塞上迹逺朝廷暨諸公相繼罷去向天下目之為賢者執政指之為黨皆欲因事斥逐之士㢘者即詣闕上書以水洛事訟公且誣公在渭日盜錢制使承風指按騐百端不能得一毫以汙公有部將孫用者出於軍校嘗自京取民息錢至官貧不能償公與狄公惜其材乃分假公使錢俾償其民而月取其俸償於官逮按問而錢先巳輸官矣坐此貶公崇信軍節度副使徙監均州酒稅得疾㳂牒至南陽訪醫藥疾革對賔客妻子無一慼言整冠帶盥濯怡然隠几而卒時年四十七慶厯七年四月十日也公天性慈仁内剛外和凡事有小而可矜者必惻然不忍發見顔貌及臨大節斷大事則心如金石雖鼎鑊前列不可變也在軍謙節愛士雖悍夫冗列皆降意容接故人人願盡其力所至郡邑修設條教務以實惠及罷去則人思之文章自唐衰厯五代日淪淺俗寖以大敝本朝栁公仲塗始以古道發明之後卒不能振天聖初公獨與穆㕘軍伯長矯時所尚力以古文為主次得歐陽永叔以雄詞鼓動之於是後學大悟文風一變使我宋之文章將踰唐漢而追三代者公之功為最多初朝廷之將用攻策也命葛懷敏出鄜延道勒兵綏宥間攻賊積聚招懷種族奪其要害而保障之賊知朝廷之威必翻然來服則乆而易制公曰是行也不患將卒無勇患應敵寡謀耳乃自請㕘議懷敏行營軍事有詔如請而事中罷今夫文武之士平居議論慷慨自謂忠義勇决世無及者一旦遇急難而試之往往魄喪氣奪百計避脱雖以富貴誘之猶捍臂而不顧余居邊乆閱人多矣如公挺然忘身以為國家者天下知有幾人今以某月日祔葬先塋從吉卜也范公嘗以書謂余曰世之知師魯者莫如公余巳為其集序矣墓有表請公文以信後世余應之曰余實知師魯者又得其進斥本末為最詳其敢以辭既實書其事矣又考性命之説而表於墓曰嗚呼自古聖賢必推性命如公之文武傑立而貫以忠義兮此天之性位不大顯遭讒而跌且不夀兮此天之命雖孔孟不能以兼適兮尚一歸於黙定昧者不思而妄求兮徒自奔於邪徑故公臨禍福生死而曾不少變兮是能安性命而歸正唯大名赫然日月之光兮亘萬古而增瑩吾聞善人者天必報其後兮宜嗣人之䝉慶祭文韓琦維慶厯七年某月某朔某日具官某謹以清酌庶饈之奠致祭於故龍圖舎人尹君師魯之靈嗚呼師魯惟君之生天與英奇如鑑之明無隠不窺如材之美無用不宜仁義之勇過於虎羆疑昧之决審乎蓍龜首倡古文三代是追學者翕從聖道乃夷名重天下無人不知知之深者非余而誰伊昔夏人擾於西陲余忝兵任君實同之周旋塞上余往君隨畫籌夜晝忍睡忍飢星霜矢石勞苦難􅇖凡四五年心憊形羸退而視君志不少衰上嘉君勤進督渭師懷敏之後破壞創痍君能盡力補綴撑持曰兵曰民以治以綏如得父母衆心熙熙保邊務實恥於妄為不合小人乃啟禍基易慶晉路奔命何疲輸忠抗論伺者乘危君前在渭屬防秋時以公廨緡貸其偏禆俾償宿負免干典彜月取其俸送官勿虧且責効命投死無疑職此抵罪竄斥流離衆謂之寃君甘如飴自隨徙均帝方念兹奈何窮山感疾無醫君决不起指鄧而馳范公大賢來記孤遺謂無怛化言色怡怡忽整衣冠盥滌莊祗憑几而逝衆皆歎悲范公之書其説如斯嗚呼哀哉彼蒼𠖇𠖇莫可究推賢者胡惡動與屯奇不肖胡佑坐來福禧以道而屯死為人思以幸而福生為人嗤在君所得何必期頤嗚呼哀哉余之與君義雖朋執情則塤箎葬不執紼奠不捧巵使我大恨痛切肝脾徒憑薄祭一寫哀辭琴不鼓矣嗚呼子期尚饗墓誌歐陽脩師魯河南人姓尹氏諱洙然天下之士識與不識皆稱之曰師魯盖其名重當世而世之知師魯者或推其文學或高其議論或多其材能至其忠義之節處窮達臨禍福無愧於古君子則天下之稱師魯者未必盡知之師魯為文章簡而有法博學彊記通知今古長於春秋其與人言是是非非務窮盡道理乃已不為茍止而妄隨而人亦罕能過也遇事無難易而勇於敢為其所以見稱於世者亦所以取嫉於人故其卒窮以死師魯少舉進士及第為絳州正平縣主簿河南府户曹㕘軍邵武軍判官舉書判拔萃遷山南東道掌書記知伊陽縣王文康公薦其才詔試充館閣校勘遷太子中允天章閣待制范公貶饒州諫官御史不肯言師魯上書言仲淹臣之師友願得俱貶貶監郢州酒税又徙唐州遭父喪服除復得太子中允知河南縣趙元昊反陜西用兵大將葛懷敏奏起為經略判官師魯雖用懷敏辟而尤為經略使韓公所深知其後諸將敗於好水韓公降知秦州師魯亦徙通判濠州乆之韓公奏得通判秦州遷知涇州又知渭州兼涇原路經畧部署坐城水洛與邊臣異議徙知晉州又知潞州為政有惠愛潞州人至今思之累遷官至起居舎人直龍圖閣師魯當天下無事時獨喜論兵為叙燕息戍二篇行於世自西兵起凡五六嵗未嘗不在行間故其論議亦精宻而於西事尤習且詳其為兵制之説述戰守勝敗之要盡當今之利害又欲訓土兵代戍卒以減邊用為禦戎長乆之策皆未及施為而元昊臣伏西兵解嚴師魯亦去而得罪矣然則天下之稱師魯者於其材能亦未必盡知之也初師魯在渭州將吏有違其節度者欲按軍法斬之而不果其後吏至京師上書訟師魯以公使錢貸部將貶崇信軍節度副使徙監均州酒稅得疾無醫藥舁至南陽求醫疾革隠几而坐顧稚子在前無甚憐之色與賓客言終不及其私享年四十有六以卒師魯娶張氏某縣君有兄源字子漸亦以文學知名前一嵗卒師魯凡十年間三貶官喪其父又喪其兄有子四人連喪其三女一適人亦卒而其身終以貶死一子三嵗四女未嫁家無餘貲客其喪於南陽不能歸平生故人無逺邇皆往賻之然後妻子得以其柩歸河南以某年某月某日葬於先塋之次余共師魯兄弟交嘗銘其父之墓矣故不復次其世家焉銘曰藏之深固之宻石可朽銘不滅論尹師魯墓誌歐陽脩誌言天下之人識與不識皆知師魯文學議論材能則文學之長議論之高材能之美不言可知又恐太略故條析其事再述於後述其文則曰簡而有法此一句在孔子六經惟春秋可當之其他經非孔子自作文章故雖有法而不簡也脩於師魯之文不薄矣而世之無識者不考文之輕重但責言之多少云師魯文章不合祗著一句道了既述其文則又述其學曰通知古今此語若必求其可當者惟孔孟也既述其學則又述其論議云是是非非務盡其道理不茍止而妄隨亦非孟子不可當此語既述其學議則又述其材能備言師魯厯貶自兵興使在陜西尤深知西事未及施為而元昊臣師魯得罪使天下之人盡知師魯材能此三者皆君子之極矣然在師魯猶為末事其大節以篤於仁義窮達禍福不媿古人其事不可徧舉故舉其要者一兩事以取信如上書論范公而自請同貶臨死而語不及私則平生忠義可知也其臨窮達禍福不媿古人又可知也既已具言其文學其論議其材能其忠義遂又言其為仇人挾情論告以貶死又言其死後妻子困窮之狀欲使後世知有如此人有如此事廢死至於妻子如此困窮所以深痛死者而切責當世士夫致斯人之及此也春秋之義痛之益至則其辭益深子般卒是也詩人之意責之愈切則其言愈緩君子偕老是也不必號天呌屈然後為師魯稱怨也故於其銘文但云藏之深固之宻石可朽銘不滅意謂舉世無可告語但深藏牢埋此銘使其不朽則後世必有知師魯者其語愈緩其意愈切詩人之義也而世之無識者乃銘云文不合不講徳不得不辨師魯以非罪盖為前言其窮達禍福無媿古人則必不犯法况是仇人所告故不必區區置辨也今止直言所坐自然知非罪矣添之無害故勉徇議者添之若作古文自師魯始則前有穆脩鄭條輩及有大宋先達甚多不敢斷自師魯始也偶儷之文茍合於理未必為非故不是此而非彼也若謂近年古文自師魯始則范公祭文已言之矣可以互見不必重出也皇甫湜韓文公墓誌李翺行狀不必同亦互見之也誌云師魯喜論兵論兵儒者末事言喜無害喜非嬉戯之戯喜者好也君子固有所好矣孔子言回也好學豈是薄顔回乎後生小子未經師友茍恣所見豈足聽哉脩見韓退之與孟郊聯句便似孟郊詩與樊宗師作誌便似樊文慕其如此故師魯之誌用意特深而語簡盖為師魯文簡而意深又思平生作文惟師魯一見展巻疾讀五行俱下便暁人深處因謂死者有知必受此文所以慰吾亡友爾豈恤小子輩哉祭尹師魯文歐陽脩維年月日具官歐陽脩謹以清酌庶羞之奠祭於亡友師魯十二兄之靈曰嗟乎師魯辯足以窮萬物而不能當一獄吏志可以狹四海而無所措其一身窮山之崖野水之濱猿猱之窟麋鹿之羣猶不容於其間兮遂即萬鬼而隣嗟乎師魯世之惡子者之多而未必若愛子者之衆何其窮而至此兮得非命在乎天而不在乎人方其奔顛斥逐困死艱屯舉世皆寃而語言未嘗以自訴以窮至死而妻子不見其悲忻用舎進退屈伸一作出語黙夫何能然乃學之力至其握手為訣隠几待終顔色不變笑言從容死生之間既巳能通於性命死亡之至宜其不累於心胷自子云逝善人宜哀至于窮達予又何悲惟其師友之益平生之舊情之難忘言不可究嗟乎師魯自古有死皆歸無物惟聖與賢雖埋不殁尤於文章焯若星日子之所為後世師法雖嗣子尚㓜未足以付予而世人藏之庶可無於墜失予於衆人最愛子文寓辭千里侑此一罇冀以慰子聞乎不聞尚饗乞與尹構一官狀歐陽脩右臣等伏見故起居舎人直龍圖閣尹洙文學議論為當世所稱忠義剛正有古人之節初䝉朝廷擢在館閣而能不畏權臣力排衆黨以論范仲淹事遂坐貶黜其後元昊僣叛用兵一方當國家有西顧之憂思得材謀之臣以濟多事而洙自㓜出師至於元昊納欵始終常在兵間比一時之人最為宣力而羣邪醜正誣構百端卒陷罪辜流竄以死嚮䝉陛下仁聖恩憐哀其寃枉特賜清雪俾復官資足以感動羣心勸勵忠義今洙孤㓜並在西京家道屢空衣食不給洙止一男構年方十餘嵗􅑏然無依實可嗟惻伏見將來祫享大禮在近羣臣皆得奏蔭子孫伏望聖慈録洙遺忠憫洙不幸特賜其子一官庶霑寸禄以免飢寒則天地之仁幽顯䝉徳臣等忝列侍從愧無獻納茍有所見不敢不言雜見事跡先是渭州西路巡檢劉滬建策以為秦渭兩路有急發兵相援路出隴坻之内回逺恐不及事請募熱户於山外築水洛結公二城以兵戍之緩急以通援兵之路都部署鄭戩以狀聞命滬及董士㢘董其役㑹韓琦宣撫陜西還奏罷四路招討以戩知永興軍又言兩城之旁多生户今奪其地恐城未畢而冦至請罷之戩因極言二城之利不可輒罷詔三司副使魚周詢往視其利害未至尹洙召滬士㢘令還滬士㢘以熱户既集官物無所付請遂城之洙怒以二人違節制命部署狄青往斬之青械繫滬士亷於徳順軍及周詢還是戩議乃徙洙慶州涑水記聞尹師魯謫官均州時范希文知鄧州師魯得疾即擅去官詣鄧州以後事屬希文希文日往視其疾一旦遣人招希文甚遽既至師魯曰洙今日必死矣人言將死者必見神鬼此不可信洙並無所見但覺氣息奄奄就盡隠几坐與希文語乆之謂希文曰公可出洙將逝希文出至㕔事巳聞其家號哭希文竭力送其喪及妻孥歸洛陽涑水記聞知道者茍未脱然隨其所得淺深皆有効騐尹師魯自直龍圖閣謫官過梁下與一佛者談師魯自言以静退為樂其人曰此猶有所繫不若進退兩忘師魯頓若有所得自為文以記其説後移定州是時范文正公守南陽少日師魯忽手書與文正别仍囑以後事文正極訝之時方饌客掌書記朱炎在坐炎老人好學佛文正以師魯書示炎曰師魯遷謫失意遂至乖理殊可怪也宜往見之為致意開譬之無使成疾炎即詣尹而師魯巳沐浴衣冠而坐見炎來道文正意而笑曰何希文猶以生人見待洙死矣與炎談論頃時遂隠几而卒炎急使人馳報文正文正至哭之甚哀師魯忽舉頭曰早已與公别安用復來文正驚問所以師魯笑曰死生常理也希文豈不達此又問其後事尹曰此在公耳乃揖希文復逝俄頃又舉頭顧希文曰亦無鬼神亦無恐怖言訖遂長往師魯所養至此可謂有力矣尚未能脱有無之見何也得非進退兩忘猶存於胷中歟沈存中筆談本朝古文栁開仲塗穆脩伯長首為之唱尹洙師魯兄弟繼其後歐陽文忠公蚤工偶儷之文及官河南始得師魯乃出韓退之文學之盖公與師魯於文雖不同公為古文則居師魯後也如五代史公嘗與師魯約分撰其後師魯死無子今歐陽公五代史頒之學宫盛行於世内果有師魯之文乎抑歐陽公自為之也歐陽公誌師魯墓論其文曰簡而有法且謂人曰在孔子六經中惟春秋可當則歐陽公於師魯不薄矣崇寜間改修神宗正史歐陽公傳乃云同時有尹洙者亦為古文然洙才下不足以望修云蓋史官皆晩學小生不知前輩文章淵源自有次第也聞見録韓魏公曰希文常勸以身安而後國家可保師魯以謂不然直謂臨國家事更不當顧身公雖重希文之説然性之所喜以師魯為愜爾魏公别録師魯集二十七巻承㫖姚公手録本予徃嘗刻師魯文百篇於㑹稽行臺今迺得閲其全集甚慰因復梓行之我朝古文之盛倡自師魯一再傳而後有歐陽氏王氏曽氏然則師魯其師資云淳熙庚戌錫山尤袤延之跋河南集附録}
