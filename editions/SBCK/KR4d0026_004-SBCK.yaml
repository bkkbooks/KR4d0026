  text: 河南先生文集卷之四
  hash: sha256:2316673bac8ae18d60877100c87730c81e4ea12e74a3f90440cfb4e55369bfad
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_004-1a}
body:
  text: 記十二首襄州峴山亭記鞏縣孔子廟記伊闕縣築堤記志古堂記張氏㑹隱園記王氏題名記秦州新築東西城記潞州題名記岳州學記書禹廟碑陰題楊少師書後題祥符縣尉㕔壁襄州峴山亭記至哉仁之施于政其感人㴱切而無竆已也羊公之治襄陽及今幾千載襄陽士人與民之有知者望峴山則緬然而思羊公其仁矣乎自漢而下郡縣吏以循名者雖參用威術以臨其民要其歸皆一於治當其時莫不有聽訟燕息之所于今皆㣲民無足道焉者若是羊公之思惡乎至哉其由不用威術而純乎仁者所夫威者強人以爲治所者使人不見其所以焉治強人者人勿怨則以不見其形以爲治者有見焉則人不思若純乎仁者不必身被其犯後之人聞其風則咨嗟吁欷宐乎思之而不􅁯久之而益彰也燕公之來襄陽時與僚佐㳺峴山山故有亭壞甚公易而新之者所謂墮淚碑者梁劉之遴唐李景讓再易之矣今存唯景讓所易者公命工鐫其字之刓缺者使人可辨議焉嗚呼羊公之仁不係乎山若碑之存然後爲不朽而燕公勤勤遺迹者狥其民之思若周人之􅋢棠樹也然則公之政其仁矣乎未有􅋢其迹而不思其人者也若夫亭之嘉愷與登覽之勝則公嘗賦詩在焉鞏縣孔子廟記宋興八十載天下久承平天子端拱率祖宗法度講禮文登雋賢欲一以聲教格民於太和爲吏者循上化其治大槩務寛平恥以持法刺奸取能名專用厚風俗嚮廉讓爲休故郡府立學校尊先聖廟十六七河南爲天子西都建國子學稱號與東都侔其屬邑曰鞏距府百里据大道之衝河洛所會舟車之饒民以富強先是縣之先聖廟暴爲水壊材亾地行不復興矣凡釋奠行禮寓今署中且十年大理寺丞李君惟章既蒞邑事顧曰地要而民富禮教所宐先今聖廟圯而弗謀亦非所以稱畿縣之劇甚爲鄉老吏民羞其易而新之於是相縣署之西偏以營焉且上其狀于府得民施它祠錢六萬以濟其役募善工購良材堂邃而崇像嚴以尊學有舍齊有次踰時而成邑民休之相與議曰兹廟之興既營既勤皆由吾李君不志不刻無以章君之化遂以文來請某按著令縣皆立先聖廟釋奠以春秋唐韓文公所謂郡縣通祀孔子與社稷者也自五代亂祠官所領在郡邑者頗廢墜不舉間或增祀率滛􅄭不經獨孔子社稷其奠祭􅄊幣莫之能損益真所謂通祀哉今朝廷向儒術西都建學官聚生員爲郡國倡始鞏爲西畿劇縣能尊先聖以厲學者則他邑之興學從善又當自鞏而始且不失著令通祀之典李君之舉其賢而法哉年月日記伊闕縣築堤記寶元元年春伊闕築隄于縣之東延袤五百歩高一丈凡三十日隄成總庸垕障伊水也伊水自縣西南來俯城而東靡迤北下前此一歲夏大雨水暴侵東郛壞民廬己而水循故流知縣事張君承範請于府宐建隄以爲後虞府聽之乃有是役夫捍災不怠令事也今而書之有以嘉焉嘗聞古之爲令者其慮民也㴱教之恤之又興利樹功非以名已能葢審其生殖謹其禍災而已慮民之㴱者若是今之爲令者其慮已也㴱興一物更一政必思曰􅉪與咎將及焉誠不及猶曰吾無改爲尚可俟後人後之人亦視前之政曰吾獨何加焉積日以幸他遷苟自簡而己也其慮已之㴱若是嗚呼爲令者豈當然哉誠能􅁯已之私唯行之宐雖􅉪若咎勇且不顧奚古人之遠哉今伊水既循故流不十數年一大暴張君能預圖而爲之防此慮民之一術也故從而爲之說年月日記志古堂記河南劉伯壽宰新鄭之二年作堂於縣署既成之謂予曰我官事已則休于是早夜以思葢有歎焉歎乎功名之不可期文章之不世傳我思古人力之而後已遂名堂曰志古余嘉其有是志從而爲之辭曰夫古人行事之著者今而稱之曰功名古人立言之著者今而稱之曰文章葢其用也行事澤當時以利後世世傳焉從而爲功名其處也立言矯當時以法後世世傳焉從而爲文章行事立言不與功名文章期而卒與俱焉後之人欲功名之著􅁯其所以爲功名欲文章之傳􅁯其所以爲文章故雖得其欲而戾於道者有焉如有志於古當置所謂文章功名務求古之道可也古之道奚遠哉得諸心而已心無苟焉可以制事心無蔽焉可以立言惟無苟然後能外成敗而自信其守也惟無蔽然後竆見至隱而極乎理也信其守者本乎純極於理者發乎明純與明是乃志古人之所志也志乎志文章功名從焉而不有之也伯壽嘉予言刻之于堂以自儆張氏會隱園記河南張君清臣創園于某坊其兄上黨使君名曰㑹隱清臣固隱矣其曰㑹者使君亦有志于隱歟夫馳世利者心勞而體拘唯隱者能外放而内適故兩得焉有志者雖體未得休而心無他營不猶賢乎哉張氏世卿大夫清臣獨以衣冠爲身汚湔洗奮去目不眡􅀔人洛陽城風物之嘉有以助其趣者必畱連􅁯歸始得民家園治而新之水竹樹石亭閣橋徑屈曲廻䕶髙敞蔭蔚邃極乎奥曠極乎遠無一不稱者日與方外之士傲然其間樂乎哉隱居之勝也予既美清臣能享其樂又嘉使君之有志于是也故爲之作記凡池亭使命以名附之于後云王氏題名記陜郡開元寺建初院有進士登科題名二記在焉其一題云天復四年左丞楊渉下進士二十六人實唐昭宗遷洛改元天祐歲駐蹕于陜楊渉丞相所放進士㮄第十四人王公諱澥之嗣子工部追書也工部諱某開寶二年佐虢幕作文以記其事後十一年工部從子鹽鐵推官守中奉使過陜又誌名于記末其一題云咸平元年翰林學士楊礪下進士五十一人第九人劉公􅻆所刻也劉公父太常卿岳前天復㮄中第十一人劉公甞官于陜故以東都咸平㮄嗣之其第二十三人王公諱某即天復㮄第十四人王公之曾孫累官某官贈某官慶曆元年贈官嗣子書先公贈官職方公按刑陜右觀建初一記則髙祖先公登科二名暨曾祖伯祖眞跡俱存慨然感慕命余次其年世前後嗚呼天祐甲子距今百三十有九年公家四世刻名佛舍公今又繼而書之世德之厚者其將顯乎秦州新築東西城記城武僃之一譬于兵爲􅄊之大者也古聖王捍患底民弓矢甲胄與城郭溝池交相爲用以利後世世人不推究古始以爲王者專任德教不必城守爲固果如是武庫甲兵將安用邪聖人以不教戰爲棄民兵不可得而廢猶城之不可廢嗚呼世人未之思也上之十六年始用西帥邊將増壁壘寢爲守僃又二年虜犯塞震動鄜延之師自潼關以西諸州悉城郡議靡然無復立異者然而事暴起嚴期辦甚者削制度苟謀亟成既而不免改作重傷民力比之平時預爲之圖勞費過半矣秦州自昔爲用武地城壘粗完數十年戎落内屬益衆物貨交會閭井日繁民頗附城而居韓公作鎮之初年籍城外居民暨屯營幾萬家公曰是所以資冦也乃上其事以益城爲請詔從之公擇材吏授之規模東西廣城四千一百歩髙三丈五尺基厚皆稱是以與舊城達勵合爲一城自十月至正月以畢事聞總工三百萬秦人北之是歲䀆冬元善寒杵者聲謙以致其樂焉先是郡有罷谷水自北山而下公導之使西塞故道以致城衆頗爲疑明年夏大雨水循新隄絶不爲城害衆乃報服或者以虜數敵中國今作城祇以自守非制虜術此大不然今之所患邉壘未能䀆固耳果䀆固雖虜至吾兵得專力于外勝􅀔多矣如虜以吾城守既僃息其䦧邉之謀則兵志所謂無智名無勇功善之善者也公忠國􅋢人之心其在兹乎自始事公宴犒慰勞無日不主既成由諸校而上天子文弟其勞加賜焉春秋列國興作皆以書城之四月某得以州事佐公故詳其實而書之凡董役之長暨勤事之吏皆刻名于石陰慶曆二年八月十五日記岳州學記三代何從而治哉其教人一于學而已自漢而下風化日陵政之寛暴民之勞逸皆緣于吏治吏之治大抵尚威罰嚴期會欲人奔走其命令其敺之若是之亟也又安暇先之以教育漸之以德義者乎故號稱循良而能以學校教人者十不一二去聖益遠至有持律令主簿領思慮不出几案以謂爲治之具䀆在于是顧崇儒術本王化者爲闊疎不切于世噫其甚哉滕公凡爲郡必興學見諸生以爲爲政先慶曆四年守巴陵以郡學俯于通道地迫制卑講肆無所容乃度牙城之東得形勝以遷焉會京師倡學詔諸郡置學官廣生員公承詔忭曰天子有意三代之治守臣述上德廣風教宐無大于此庸敢不虔于是大其制度以營之願儀既成乃建閣以聚書闢堂以授經兩序列齊以休諸生掌事司儀差以等制饍㸑澣洗悉嚴其所小學賓次皆列于外大總作室之數爲楹八十有九祭􅄊行具稱于禮資于用㒺有不僃巴陵之服儒者畢登于學公延見必禮奨其勤以勵其㳺尚其能以勉其未至雖新進不率者皆革頑爲恭磨鈍爲良出入里閭務自修飭郡人由是知孝悌禮義皆本于學也公之樹教及人豈不切于近通於久乎先是公領邠寜環慶兵扞戎爲帥臣守巴陵乃下遷凡由大而通小必易其治或隂憤陽惓事弛官廢下不勝弊者有之或慎微慮危脩舊保常無所設施者有之若夫用捨不殊勇其所樹立不以險夷自疑于時如公心之所存非􅋢君之㴱信道之篤烏及是哉今年錄其事來告且曰予嘗守王山呉興安定皆立學其作記必時聞人子其次之某始愧不稱然安定之文伯氏實承公命小子奚敢以辭慶曆六年八月日記書禹廟碑陰唐劉公修禹廟碑題云補闕崔巨􅁧叚季展書巨他文猶見五季展無聞者焉劉公領財賦有大功其所與皆天下善士巨季展必當時之知名者今膳部員外郎周君越嘗爲三門發運判官始以􅇘本傳京師周君以書名于世故季展書大爲人􅋢重四方競購之傳本既多字寖缺落今發運判官屯田員外郎左君瑾命工楷刻于佗石且搆宇以寘舊碑又扃固焉左君嘗謂予言忠州之功巨之文季展之書皆當永其傳不獨其書爲可寶也予嘉左君真好事者錄其言附之新碑之末寶元二年十一月二十日記題楊少師書後周太子少師楊公凝式􅇘蹟多在洛城佛寺中今存者廣􅋢長壽天宫甘露興教凢六處皆題于壁郭仲徴嘉善新居有十餘字甘露致之洛都有兩興教此在延福坊又集賢校理公在洛或與人爲銘記皆不自書公之書無刻于石者論書者以公之筆其馳騁自肆葢得于已意刻之其似可䀆其得意不可䀆豈其然哉予非善書者莫能知已公所題壁距今踰八十年字頗缺落不可辨者十有三四天王院僧繼明慮公之書久遂無傳命僧某擇字之最完者得長壽甘露兩壁總八十七模刻於石寶元二年月日尹某記題祥符縣尉㕔壁夏侯之純爲祥符尉尹某嘗至其治舍觀其決事慮精而氣果凡事可否當在已無細大必行行之未嘗報挫縣治都門外所部多貴臣家尉小官能指置一如志且有治稱難乎哉前世赤縣治京師不以城内外爲限制事廣而􅀔任亦重尉主大盜又于縣爲劇官今京城中禁軍大將領兵徼巡衢市之民不復知有赤縣此乃因循儀制豈前世法哉予既美之純之政且歎其不得䀆其官之所掌故書之于壁
