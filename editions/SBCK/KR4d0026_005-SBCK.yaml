front:
  text: 河南先生文集巻之五
  hash: sha256:b882cdbec0f6dc4801fb7dfe7f6848ab1767caff2fe2826b37993340efb14fde
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_005-1a}
body:
  text: 序十首郢州送路綸寺丞一首幷詩送李侍禁一首送浮圖奉堅一首送王勝之贊善一首浮圖祕演詩集序送隨縣尉李康矦一首送浮圖迥光一首送光化縣尉連庠一首送供奉曹測一首送丘齋郎一首送路綸寺丞序渙之寺丞自郢中有南陽之行治舟之日郡守廣平公張宴白雪樓命賓屬以餞之酒數行爲引商刻羽之曲坐客凄然有離索之嘆友人尹某因道古人送言之意將有以序其行夫古之送言必以已之所得規彼之未得今渙之才美而甚晦内方而外和惟晦與和某當師之方得渙之以自規其敢有獻于渙之哉獨離索之恨不能􅁯已既醉且泣以詩􅁇之感事并傷别平時涙滿巾今朝郢樓上更送北歸人又平生愛問江南事喜見人從江上來今日江頭送歸客葦花深處祖筵開送李侍禁序新秦楊叔武嘗為予言其友人李君之為人篤行君子然樂于佛氏之􅀃予他日得見則以叔武之言􅀃之君曰誠有是非取其所謂報施因果樂其愽愛而已予應之曰是仁之實也古有孟氏書為仁義之説君之樂冝近焉君于儒書為汎通自予言于孟氏益加勤異日大詫曰孟氏説與吾素所向無大異遂主孟氏學予又曰自孟而下千載能尊孟氏者唯唐韓文公君由是復通韓氏文且曰今而後知愽乎愛者在行之冝耳與予㳺二年其言非孟即韓君之性真資于仁者歟始讀佛氏書以其愛之愽也樂之及觀孟氏韓氏書推而廣之則有所至焉幸卒其志則聖人之道無不至者于其别叙其初以勉之送浮圖奉堅一首浮圖奉堅師訪予出所述三昧儀求爲之贊予應之曰師爲浮圖學能廣其所傳以導人欲贊其說當求之㴱其學者不然名公大人其能取信于世者予䝉固未能了師之說且言不足爲世重曷爲求哉而師之請益堅觀師之心是不欲使一人不通其說者若是其固邪噫世之儒者有能自信其傳如師之固歟于其行作序以紀之送王勝之贊善一首天下久安衣冠子弟持身能自修謹或作辭章能僃科試者爲其父母必目之曰令子弟爲其朋友必推之曰良士爲國家擇人必舉之曰美材於是上下交稱其賢賢者若是其已乎河南王勝之宰相子年二十五常日爲文三千言三千言人多能之勝之之文其論經義頗斥遠傳解衆說直究聖人指歸大爲建明使泥文據舊者不能排其言其策時事則貫穿古今㴱切著明于俗易通于時易行參較原覆其說無竆大抵贍而不流則而不窘詞厲而淳氣出而長蔡君謨常稱之曰歐陽永叔之流永叔君謨皆子之所長也君謨未嘗片言假人如是稱之信矣又俶儻宏達服仁畏義眞魁傑人而不屑細故與時疎闊由是􅉪譽交至噫􅉪何爲哉然前所謂持身能自修謹其文章足備科試者語其賢或未至求其􅉪固無有也使其人效勝之試且不能勝之兼取之如其所爲何難乎太平聖朝方以文法治天下願無略予言浮圖祕演詩集序浮圖號文惠師祕演者過我道歐陽永叔爲其作詩序􅂫子美貽之詩永叔悲演老且衰子美有惜哉不櫛被佛縳不爾烜赫爲名卿之句予識演二十年當初見時多與穆伯長㳺伯長明峻人罕能與之合獨喜演演善詩復辨博好論天下事自謂浮圖其服而儒其心若當世有􅀔力者冠衣而振起之必犖犖取奇節今老且竆其爲佛縳詎得已邪伯長小州參軍已􅂮演老浮圖固其分演之再來京師不飲酒不與人劇談頗自持謹與世名浮圖者不甚異演之心豈與年俱衰乎永叔因石曼卿始以知演見其衰而聞其壯所爲是以爲之悲然演始健于詩老而愈壯不知年之衰于聞詩發于中寜相戾邪豈演老益更事且不預世故遂汨汨順流俗其外若衰其中挺然獨于詩乃發之邪演詩既多爲人所重演亦不自􅋢之數客外方頗逸去錄之凡三百餘篇云河南尹某序送隨縣尉李康矦一首自予貶官有見顧者哀予之竆惻然見於色辭其人未必相知特哀吾竆耳予愧其意重其爲人何哉見人之竆惻然而哀之是亦情發乎仁者也李君亦見我惠書幾千言皆張大仁義之說無一語哀予之竆者豈以身之竆不足累於心乎夫自處不卑者期人則㴱予喜李君知我而嘉其自處之髙也重其别姑贈以言送浮圖􅅆光一首予聞廢放之臣病其身之竆乃趨浮圖氏之說齊其身之榮辱竆通然後能平其心吁其惑哉屈原賈生爲放逐之辭皇皇焉切以㴱所不􅁯者君也彼豈以身之榮辱能累其心邪先聖稱顔子簟食瓢飲人不堪其憂回也不改其樂葢夫樂古聖人之道者未始有憂也尚何榮辱竆通之有乎予謪隨之一月光師來相過持其師之說以警予光師明達人也于其行敘吾說以爲别送光化縣尉連痒一首自西師之興金帛糧糗之積凡資于兵者其費益廣鐵革幹羽之用凡須于兵者其取益夥費之廣則吏之聚斂者進焉取之夥則吏之幹力者進焉上任其能下收其功自監司所部及于郡縣由初仕至于久吏宿官莫不以是爲吏之優爲政之先于是吏之強者益肆弱者亦趨甚者不恤困竆不察有無殫利以夸精嚴期以名勤有以治體爲言者必詆之曰方事之艱當求所以富國強兵之要烏體之爲哉故吏益材而民益愁爲吏者寜當然邪連君君子人也其仕五歲矣予質其爲吏之術大㮣本于仁而達下之情其于民也知利之興寛之而已職事無廢也期會無失也考千古之爲吏者當以良稱而于今未得以材名也噫沿古未嘗無兵也國家仁育天下幾百年今一方兵興其資于民役于民者必視其貨力與之約束豈重擾哉而下之愁歎者吏爲之也吏豈喜擾邪亦欲以材自名而利其進也是故奨材吏則士益偸貴良吏則民遂其生惟君子不可以利囘故樂與連君䀆其說送供奉曹測一首予遷武當之一月曹君䕶淮陽戍兵來抵郡下一日見過䀆出淮陽送行詩示予且以詩爲請予自得罪不欲以文辭發聞于人雖朋㳺素厚者未嘗先爲書問非以自􅋢慮爲朋㳺累也今始見君而遽相稱道懼流俗之善訿者幷以毁君矣用是敢辭而君之請益堅噫流俗之毁譽固流俗之所惜也倜儻之士則不然毁也譽也必審於已而已奚流俗之爲哉君生勲德之族少年志學而趨向如此其倜儻之士乎詩不能䀆予意作序以别送丘齋郎一首天子臨軒策賢良之法何爲哉得非質今事考古誼使足施于世邪然未聞某事某所建也某事某所廢也豈朝廷不亟行其言徒試其才識而取異日用邪將爲賢良者務高其說而不切于行邪收其異日之用則今登科者益用于朝爲朝廷言主乎得人猶不係乎樹策之始行與否也如不切于所行務高其說以取重于名者殆非試策之本意丘君仲謀敏贍通古今其才識辨論于賢良無愧異日應諮問使爲國者汲汲于所陳而易於亟行聞其􅍟者惟恐不大施于時兹有望于賢良也寶元二年上元夕洙謹序河南先生文集巻之五
