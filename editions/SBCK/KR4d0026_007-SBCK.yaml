body:
  text: 荅環慶招討使范希文書某自建去門館若非有事陳啟未嘗通記左右近者再來關中伏聞軍政甚治雖欲作短牋胸中了無可說事用是輒罷豈敢􅈈也蒙賜手教至慰至忭兼承益地建柵却敵取勝葢明公䇿慮素定濟之英果不然且爲虜乘矣自國家分命儒臣綂制方面未有親總師律蹈履賊境如明公者誠懦夫所增氣也去并再議與鄜延合進若虜與鄜延兵遇則環慶爲奇兵應之與環慶遇則鄜延兵亦然是乃首尾相應也今新栅既成當使狄青駐德靖爲奇兵以相助亦一術也又慮異日之來不盈二萬之衆亦當有以待之又當使糧道易致卒戍易處援路易通羈屬之户易以安輯然後有萬全之安書中令其暫到邠上去年曾奉教到濠州當以局事自守某㴱佩此訓今到才一月奉大府筦庫簿書尚未省又復走道塗徒以自愧果若軍事期會則不敢辭如其博采論議則某之所陳不過前數事耳幸賜炤亮與范純佑監簿書久不作書想惟榮侍萬福前累得導文書讓官事極善然朝廷必更有教詔猶當委曲上陳自效恐大過況韓公亦讓必别有措置此事某嘗與識者論以内制外其體甚重則廉車之勢不若學士也然韓公受之無疑其亦􅋢其專於國事而􅁯其身之危遂賛而美之某近得旨預聞軍事韓公既當行陣之責某豈能自必無軍行耶是某亦􅋢韓公而􅁯其身之老大凢爲人佐者豈不欲其主人賢且用而預享其利耶某誠愚蔽在儒館幾十年一旦主人爲武帥則從軍之行未易可期豈以此爲利哉其始以徇國不謀其身爲賢故喜韓公之不讓及見尊丈之讓謀身所所以利國家則又喜尊丈之讓尊丈知帥臣當以恭順爲體而不以招討使爲方面之寄此一事某所未論上環慶招討使范希文書近聞綂蕃漠之衆親至涇州關輔人心頓然帖息揆明公始謀擇賊豈自意不與敵遇耶以身許國史册所載雖舊勲宿將百無一二況道德若公忠憤敢決乃至於此甚善甚善定川之役雖速戰可咎然當其未敗時某與韓公料其必敗葢以事勢得之則似不獨主將罪也兵興五年我師之敗數矣能竆我之所敗則知彼之所以勝爲敵所誘而取覆者特一事耳願明公㴱思其已然以爲將來之策特賜音教幸甚幸甚荅秦鳯路招討使韓觀察議討賊利害書適蒙手教并示及慶州書前歲太尉欲爲此計當時慮雖破劉石尚有疑大國心又北患未形國家當專力以天下之勢臨之必要之以盟則伺隙者自寢其謀所謂工遲不如拙速某是以下敢異議今四路分綂以本道言之力役未休新兵未練部分初立蕃落方集以此而揆他路雖不䀆同大槩恐不異此若來歲用之即未爲晚此遲速各有時也然范公欲破其合比之勢此憂國之㴱則不可不熟思公云無大利亦無大害范公此說亦䀆之至於中使來督倉皇入界諸公當共顧大計固守所議豈得稟命爲忠餘俟面啟與儀州曹頴叔殿丞書近者高軒過郡殊􅃜主禮别來未暇作書先辱手誨益認眷顧之厚種落略漢人誠未當以常法繩之然漢人得㱕反以盜罪加以㴱憲此尤可憫落蕃者甚有竊其馬以㱕者豈可罪耶尋白帥府果蒙兩輕之此甚平允賀參政范諫議啟某再拜伏承入參大政天下幸甚叅政諫議居外日久士大夫延頸以竚德車之入今領樞柄不一月遂二宰政聖君之任賢大賢之得君無讓前古士大夫傾耳拭目冀有所聞見然專以聲譽爲所聞事迹爲所見者殆庸者之耳目也必使君道日隆民心日康然後參政諌議之事業與國家同休於無竆識者觀聽實在於此某被命戍邊但修完守具謹奉前降預議從容卒歲幸無他憂然即未知何去虜動果在何遂虜數未嘗以季秋暨仲春又因月盛時旦不甚政城異時來恐或反此何者我嘗逆與之戰今欲以不戰痕之安知其不能就我不戰而爲計􅁘觀今之爲僃不過以故意待之是自許以知變而不知虜之能應變也玆事未易可言唯參政諫議終始畱意參決之暇伏惟爲國自重賀樞密副使富諫議啟再拜伏承入贊機政天下幸甚明公前此兩辭柄任士大夫以國朝以來有二府初拜遠能固讓者啟有竊議何者養高遠權介者之所守經國成務英賢之通識與其追蹤於獨行不若蒙利於當世方今北有驕虜西有叛􅆧王師屢殱士氣不振踈賤之人猶懐感憤況明公得君之㴱致位之尊論議易行謀慮易信當此之際天下不高明公之讓明公豈特以讓爲高哉聖上奮然英􅍘申舉前命四方聞者無不慶忭恭惟聖上倚注之意四方屬望之心将與䕫契周召爲侔豈特房魏姚宋而上哉區區戎夷安足爲患某嘗學舊史願得私紀盛烈以僃國書之闕不任祝頌之至
