front:
  text: 河南先生文集巻之十七
  hash: sha256:91de3fd290f81065258ab5b8eaf3d0a83458a4ee54b0a049f163f75d8bdcc0ae
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_017-1a}
body:
  text: 墓誌祭文故金紫光禄大夫祕書監致仕上柱國清河縣開國子食邑六百户食實封一百户張公墓誌銘故朝奉郎司封員外郎􅀡史館柱國賜緋魚袋張公墓誌銘故朝散大夫尚書司封郎中充祕閣校理知均州軍事兼管内勸農事上柱國李公墓誌銘故將仕郎守瀛州樂壽縣尉任君墓誌銘祭僕射王沂公文祭謝舍人文故金紫光禄大夫祕書監致仕上柱國清河縣開國子食邑六百户食實封一百户張公墓誌銘并序公諱宗誨字某其先曹州宛句人大父諱某避亂徙河南遂爲河南人父諱齊賢以道德名望相太宗真宗贈太師尚書令中書令英國公母崔氏秦國太夫人公以廕爲祕書省正字四遷至太子中舍監騏驥倉西京左藏庫在京左藏金銀庫召試賜進士第累遷祕書省著作郎太常博士尚書屯田都官職方司三員外郎歴監香藥􅅦易院同判國子監判尚書祠郎吏部南曹登聞鼓院出通判河陽知富順監入為開封府判官進祠部郎中判三司度支勾院出京東轉運使徙河北罷知徐州更刑部兵部二郎中太常少卿除檢校工部尚書文州刺史充四方館使知代州徙衛州加果州團練使永興軍兵馬鈐轄移鄜延路鈐轄未至改知邠州抗章請老以祕書致仕慶曆五年又五月一日薨於河南㑹節坊之私第年七十七公未冠從英公鎮代地屬楊繼業初没虜數出擾邊英公敗之城下邀擊時於士墱虜又敗復用奇兵破其數萬衆於繁峙當是時代兵驟勝朝廷倚重英公公朝夕左右預參宻畫或俾按視行列傳布號令公亦善騎射馳突徃􅝭几危者數矣由是以智勇聞太宗嘗遣使代郡諭英公曰善視此兒吾行用之令英公以功入轉㴱抑子弟私恩故前勤不敘公與仲弟宗禮舉進士有文稱復罷之不令與寒士爭訖英公再秉致仕不出筦庫景徳初制以六科取士公上安邊議求以武足安邊科自試不報大中祥符中増前議為三十巻詔學士院召試初英公論符瑞及修官事有大臣之言頗與當時得幸者意異至是公止改署國子監事天禧中河決東郡並河千里輸茭薪完復故道暴吏嚴期民力不能致將以稽違取罪有持金錢自經者公請少緩且損其數章三上言益激至頗采用焉在富順監㑹夷人斗郎春叛群醜寖驅公遣使吏撫之不即從公曰夷恬吾撫安謂吾兵力不制怠甚矣自將州兵攻之夷衆數千來戰公分兵為三皷破之進拔其四柵夷獠遂定監司害其功不即聞及代還朝廷褒之為開封府判官自是數進見所論多邊事常曰虜貪而尚戰國家羈縻二方予厚而僃㢮非乆䇿也然羗必先叛其酋悍而不仁始詞而用其衆西京故地且䀆之矣恃其其武必肆於大國及換使職不三年夏貢不至朝廷思公前議進士領團結往䕶西師亂自􅍟數刻訪以九事一四體二易義余悉兵家奇正之説公敷荅眀審上尉遣之在鄜州范忠獻公鎮延安以舊臣宻訪計議公以虜勢未易輕凡戰闘在戒趨利未幾劉平安石元孫敗沒黄徳和遁還州不納而又走鄜州公曰軍奔將懼而無歸所以取亂也乃納之拘徳和於館撫其傷夷鄜城大而不完公方議新之㑹虜􅀐驟至是時天下久安人不知兵上下惴恐將奔竄至走山谷公舉措不失常度號令齊一嚴外侯謹門防籍入而禁出索材簡􅄊補葺罅漏耆幼疲癃使之各任其力一夕而城守皆具外􅁍姦莫能窺其隙虜知有僃乃去以功有興州之拜且許便宐從事初公在代告老不允㑹興西師遂以疆事力至是朝廷益發屯兵増遣近臣䕶軍公復内陟廼曰吾當得請矣卒如初志公漸英公之訓以愛民恕物為任凢治民必本風俗尚儉節教之殖木藝穀以資其生故民蒙其利而懐其愛其刺舉外部吏屬不職者􅀡其罪不抉隠微數議刑章或引律比者多傳於世故號稱寛平通經術眀治亂隂陽象緯之書蕞詞卒説錯見互出世所難曉者公鈎淵發原貫穿條理無不浹洽尤長於軍志前古用兵皆能辨其所以為勝負施於今若無竆惜其被遇已晩不究其用良可悲已宗族因公官者十餘人其保任不間疎近皆以年為先後故諸孫多未仕者初公以雍􅄉甲申始官秘書局逮康定庚辰凡五十七年以大祕書還第體強力完神清識明康寧夀考時罕其比有文集若干巻别著刻漏記花木編二巻夫人吕氏封馮翊縣君以次子讓例恩追封東平郡君子七人長子臯終司封員外郎中次子文終大理評事次子庚大理寺丞次子定屯田員外郎次不育女三人二早亾一適崇儀副使馬成美慶曆七年二月日刑部及二弟奉公夫人之喪葬於河南某鄉之南其銘曰在昔夏方王貢以共衆恬於安斥兵為凶爲公舊獨議僃兹㓂我戎公守十鄜虜侵其封保無堅壁戰無􅃟鋒公實始至群心未通士民惴恐誰謀之從公一號令其趨如風鼓金其聲旌旗其容虜知我僃莫予敢攻内外安堵繫公之功公識孰先公才孰雄孰艱其位者志弗充於昭太師元台上公公實嗣之嗣顯而未融世徳益茂陽報其豐有子有孫慶流無竆故朝奉郎司封員外郎􅀡史館柱國賜緋魚袋張公墓誌銘并序河南張公諱子臯字叔謨以康定元年七月二日卒於東都道德坊之私第其從父弟子奭狀其行實曰吾兄以文章名於時孝友稱於家識者以爲必能繼乃祖丞相之烈雖吾兄弟亦推之是將復興吾宗不幸始壯被譴邅囘坎壈以至於没得非命歟今年其仲弟子憲以書來求銘將以慶曆七年二月日葬於河南某鄉之某原嗟乎予􅀗見於公固久嘗語予曰吾交天下士多矣然不以通否易意者子也公知予若是不誌其墓曷紓予悲公之先濟隂人曽大父兾公始遷河南祖諱齊賢司命贈尚書令英國公父諱宗誨祕書監母吕氏東平郡君公㓜而才敏景徳四年年甫十八舉進士辭章傑異時輩馳名聲者皆出其下明年取甲科試校書郎知鄭州新鄭縣事遷保平軍節度推官英公奏授校書郎館閣讀書於時朝廷尊瑞命脩禮女從官及儒學之士率獻賦頌以稱上徳其華潤典美布於人誦者葢才一二公雖齒以缺秩卑而常得預焉由是天子知其名擢為著作佐郎諸皆欲出其門下公益自樹立少所附合宼莱公㴱􅄊之令畱守西都奏掌磨勘勾院實主記室莱公移京兆復奏知萬年縣事轉祕書丞館閣校勘召試􅀡史館初公在雄喪配莱公意以女歸之而未成也莱公罷相始婚於㓂氏及其南遷公坐姻戚出監西京監院俄落史職監撫州税降大理寺丞久之代還監西京洛河竹木務天聖四年始遷殿中丞知河南縣治尚寛平獨吏為嚴民有訟者止辨其曲􅀡鮮繩以法故去而見思歴太常博士監西染院進屯田員外郎判吏部南曹明道二年今宮傅李丞相秉政莱公事得雷雪復公史職遷度支員外郎知太常礼院逾年李丞相罷為奉常公亦出知慶成軍徙知陵州以郡入田租素厚求易他郡得邛州未行改通判鄧州州將素貴他時佐郡者多詘禮事之公曰朝廷之儀貴賤有常制苟過之非所以愛國體安不臣也持已必以禮無毫厘過差人以為難轉司封員外郎寶元年還朝命決畿内獄未㡬暴疾數刻而卒年五十有一公生子貴家少年取聞於時論議有風采惟韻格素髙而不自矜負人亦樂與之游初坐莱公事嫉宼者皆嫉之及丞相罷與李異者復擠之然公於人未始有仇也卋所謂朋黨果在此耶在彼耶人不吾辨也公既見擠廢官于洛及得告前後㡬十餘年洛中有英公别墅常與親舊縱游觴詠自適向時榮名擺落殆䀆縉紳有條為時用者公禮之如進在已先循循然不歉于色他人閔公不遇為竆公不自竆也有文集若干巻娶田氏繼宼氏某縣君三子仲武某官仲衮舉進士第今亾仲友某官女適進士李希甫而銘曰吾觀人之情莫不以顯榮為通詘辱為竆然􅂮之曰曽無銖兩之異焉獨善惡之著其人雖没其名猶存必視其鉅細為世之近逺故君子置彼而􅄭此若公者進必由其善絀不自其身於其生猶不自謂之竆況其沒耶然公之才名卒顯于世嗚呼逺哉故朝散大夫尚書司封郎中充祕閣校理知均州軍事兼管内勸農事上柱國李公墓誌銘并序公諱垂字舜工博州聊城人咸平中舉進士初命解州聞喜尉換州司法再調湖州録事參軍召試為崇文院校勘改祕書省著作佐郎遷著作郎祕閣校理歴太常博士尚書祠部度支司封三曹員外郎郎中由校理監裁造院判三司理欠憑由司同修起居注出知亳穎晉絳均五州事年六十九以明道二年六月二十五日疾終于武當公始舉進士上兵制書大要論國家常率丁民為兵而群下搔動由籍不先定故也今莫若覈民數于籍十一而附六十除之二十五十者皆勝兵部伍有等更體有法則三代之制可漸復也又上將制書皆推本仁義節制之説于時號為北州大儒及在祕閣陳導河形勝書言春秋二百四十二年災異畢書獨不書河決者夏禹故道存也今河勢益北因此可遂復故道及天禧後河數決命馳傳行堤公守前議稱勿塞便執政者意異議遂革後既塞復決卒如其策國史取公議以備河渠志焉故事禁中須物黄門署上㫖促辦公在憑由司議令政入諸司驗璽文乃承詔遂為常制丁晉公秉政公掌右史未嘗通私謁丁寖不喜公求治亳州章入命未下已俾代公者領事人或為公憤者公曰吾得請矣終身無一言及丁氏九為郡不煩教條不嚴期㑹所至人安其治有古循吏之風延接士子必譽其長而進其未至其志在奬發如此文章尚典正最明于制度羣書百姓無不通尤邃地里志天聖中頗用舊老典贊書公在儒館徳齒俱先又素望甚髙而以足疾頻求外郡庸非命耶所著文集總三十巻公之祖父皆以隠徳推於州里贈衛尉卿諱筠扶風縣太君耿氏公之考妣也娶劉氏封彭城縣君奉先姑以勤孝事公以柔明御家以慈肅後公十二年以慶曆五年八月二十二日終于寧州官舍五男伯昻知江陵府潜江縣事仲昌大理寺丞監寧州酒税叔旦寧州彭原縣主簿次二子未名早亾二女長嫁鄆州須城主簿范孝孫次嫁將作監主簿崔植孫男二人惟和郊社掌座惟穆業進士孫女五人長適進士張閑次並幼初公守武當道南陽愛其土風遂營居焉彭城君既沒其九月仲昌叔旦䕶其喪自北幽來歸南陽伯昻自武當奉公之喪以其年十二月庚申合葬於鄧州穰縣禮義鄉於保里從先命也銘曰性質而明志勵而堅在儒爲醇在德爲全導河以勢籍民以年議無汙卑辭追古先始葬於禳自公所遷刻此銘章以永其傳故將仕郎守瀛州樂壽縣尉任君墓誌銘序并南陽掾任據告予曰據不幸始生而喪先人養於母氏既有知然後審先人之未葬顧弱且貧力不足以襄事危乎其不得葬也天假其生得吏郡縣月有廩人以遂其初志將以某年某月日葬於汝州郟城之某鄉某原顧寘方石以銘其諱氏予閔掾艱竆奮勵以克有立又嘉其粗能道其先之行實故為之誌云君諱某字某具州清河人治五經盡明其章句大義授經者几數十人工部尚書趙公昌言召館門下趙公倜儻尚義節君不専以經藝取合特以性識敏辨議論感慨故始終禮異加强記絶人趙公嘗令讀道上碑再過則能黙誦咸平初中第補京兆髙陵尉再調瀛州樂夀尉居官頗有薦其能者景徳元年四月十一日以疾終于官年六十娶朱氏生二子長曰希次即掾今為君後銘曰古者士葬以逾月傳載改葬服緦者謂葬不如禮或墓壊而遷非不即葬也近代拘隂陽之説有再世未葬者不其酷哉亦有力不足者如君沒四雖而始葬其嗣非不為葢不能也殆與前所譏者異矣祭僕射王沂公文年月日故吏尹某謹以清酌之奠敢昭告於故資政殿大學士僕射桐國沂公之靈景祐初公臨洛師某在幕府公以才敏見目數被􅄊使議獄處事某或依違其言公必丁寧朂以正道及公再秉大政甞以身事有請門下公莊色厲辭不少恩假某始惧中慊終則大悟嗚呼凡公語言雖因事見誨然公在大位黙不敢傳公今薨謝輒録以自思一言之誣天實鑒之以衰服不獲備故吏之列情禮莫伸嗚呼哀哉祭謝舍人文年月日具位尹某謹以清酌庶羞之奠敢昭告於故副閣舍人陽夏公之靈某仰公徳望固為前輩至于年齒差長七歲耳世路相期在白首故别去不甚為戚戚相逺不數為書問公之聰明宏逹守以仁厚論者咸謂宐貴且夀況復術士言與者頗合益不慮有意外事聞訃之日既駭且疑公體素强不聞有疾且論者與術士言不宐繆異若此豈傳者妄耶乆之自解曰聖人謂仁者夀而顔子短命論者烏能先識哉術士言固不足信雖體强無疾寧必其長年邪審是傳者不妄也嗚呼某與公别五年嘗以書期今年秋往詣郡下前日叔謨來言公于客坐中目某信士期之必至旣而某用家事卒不得徃又不作書以道所不徃意使公言爲無驗此大恨也誠以公方且貴盛如前所稱故不汲汲于一見向知公至是雖數千里猶當一徃況不反千里耶復念在洛日聨公政事辨隠處疑亦有異論公或意悟歡如已出某雖理屈情辭無嫌非公誠䀆孰能使某如是嗚呼公存天下所仰公沒天下所哀以衆人之哀又益以私恩其為鄙心可復道哉臨紙悲塞萬不一伸嗚呼哀哉尚饗河南先生文集巻之十七
