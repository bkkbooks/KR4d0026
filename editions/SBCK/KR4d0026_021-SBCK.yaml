front:
  text: 河南先生文集巻之二十一
  hash: sha256:43d03934ff92106e681c97ab3f9627e7dfdfa1d822e28fe4628c6fb47fa87f98
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_021-1a}
body:
  text: 奏狀奉詔體量本路將佐狀奉詔及四路司指揮分擘本路兵馬弓箭手把截賊馬來路狀論雪部署狄青囘易公使錢狀奉詔令劉滬董士廉却且徃水洛城勾當狀乞與鄭戩下御史臺照􅍟水洛事狀論雪石輅狀奉詔體量本路將佐狀朝奉郎行右司諫直集賢院知渭州同管勾涇原路經略安撫部署司公事上騎都尉賜緋魚袋借紫臣尹某右臣體量本路見今主兵官員或遇西賊入冦若只令主管隊兵至時得人統制號令進退有所禀從即例皆恊力不致有前項敗事若委以兵衆進退許其自便則臣等未敢保其能否兼臣初到亦未盡知其材略或相次體量得實有敗事者即與狄青别具陳奏奉詔及四路司指揮分擘本路兵馬弓箭手把截賊馬來路狀本路經略司累據諸處探報到賊界㸃集事宐􅂃切若于本路入㓂即部署狄青合依先降預議指揮領兵于瓦亭寨駐劄其狄青忠純可信重厚可倚至毎與之講議軍政至于臨敵制變亦合事機臣但慮拘于朝廷法制未䀆其材臣欲乞軍行之後朝廷或降指揮升四路招討司行下文字係干進退兵馬分擘將佐有與軍前事體相妨者許令狄青相度其未便因依聞奏及囘申四路司不得將未便事理一例承禀施行如允臣所奏特降朝㫖庶令狄青有所遵守得以專心戎旅不至敗事謹具狀奏聞伏􅀱敕旨論雪部署狄青囘易公使錢狀右臣准邠州制勘院牒勾取部署司指使劉懷信勒檢齎借銀一千兩文憑赴院尋牒部署司勾取到劉懷信其部署狄青兼令劉懷信自齎公使文曆赴邠州照㑹去訖尋體問得劉懷信是勾當公使庫使臣爲于隨軍庫借過上件銀回易利息以充公用事臣切見自來武臣將所賜公使錢諸雜使用便同已物其狄青于公用錢物即無毫分私用況本路自西事以來所添兵數及主兵臣寮指使使臣等數倍于舊又狄青多與衆官躳親提舉教閲軍中將校每有犒設以此所費益多若不别將錢物囘易即無由充用狄青素來謹畏小心其實武人未曉朝廷憲法自聞推究公用錢物將請制院須來近挕照􅍟臣雖日夕曉譬終是内懷憂惧兼言先在延州初授涇原部署曾告龎籍言不願主領公使錢恐未知次第今來果遭􅇢􅇘詞意感切㴱可軫惻臣以謂朝廷擢青自殿直不三年至刺史委以一路兵柄此必其忠力材智有過于人又欲其奮勵自効以報不次之用今乃以細㣲詿誤令其畏惧如此今邊上日有探到事宐萬一賊兵驟至若須領兵出外似此憂疑之中切慮不能主理軍政别致闕事伏望聖慈垂察特降朝㫖曉諭狄青庶令安心專慮邊事謹具狀奏聞伏􅀱敕旨奉詔令劉滬董士㢘却且徃水洛城勾當狀中書樞宻院司奉聖㫖所有水洛城仰魚周詢徃渭州與本路經略部署司疾速同共支撥軍馬糧草應副早令了畢仍令劉滬董士㢘却且徃彼勾當所有勘到罪狀别聽指揮右謹具如前臣等檢㑹前奏乞罷修水洛城事狀葢慮久逺却為邊患今來患既未至朝廷必行具修則臣等無以自辨更不敢别有陳述伏縁臣等前後行與劉滬指揮並明坐朝旨劉滬所執只是鄭戬文牒其鄭戬文牒並是解罷兵杖後專有行遣今若朝廷却令劉滬依舊勾當却是鄭戬罷任後所行文牒可以衝改得朝廷指揮于理得無不順臣等切慮將來逐路偏裨例各專輒行事不禀本路節制必壞軍法綂兵大臣解罷兵權後尚得處置邊事于國家事體不便欲乞朝廷特降指揮檢㑹臣等前後論奏水洛城一宗文字并本司録白鄭戬罷任後所行文牒及臣等今奏降下臺省百官集議庶得申明國典況臣等所論偏裨違犯節制葢恐壞軍中綱紀所論大臣罷兵後侵撓軍政實繫國家安危非止為本路一時之事願陛下思守邊之逺略念社稷之大計若此日不行威斷則異時必生朝廷之患伏望聖慈持賜省察謹具狀奏聞伏􅀱敕旨乞與鄭戬下御史臺照􅍟水洛事狀右臣准中書劄子奉聖旨候潘帥旦成資方得交割勾當臣已具行闕去處聞奏訖臣切見自來諫官御史應授差遣少有於諸處待闕者臣到慶州未十日因孫沔陳乞疾患不赴涇原路却還舊任就移臣知晉明其潘師旦在平州已一年餘九箇月却令臣待闕事體之間㴱有可疑臣之私心實懷憂惧伏念臣自忝涇原一路寄委近及一年凢干戎事並與狄青商量處置未嘗有毫分差失亦不敢將近鄙細務頻有陳請煩凟聖聽其合奏公事前後多䝉俞允臣與狄青雖出處本異面忠義一心但專爲枝梧昊賊不敢邀功生事庶幾外禦冦讐上副寄委尺自水洛城奉聖旨罷修已來鄭戬及劉滬朋黨造作謗言傳于道路其間多不詳其本末今且以衆所傳聞者兩事明之一言劉滬所帶枷重四十餘斤且狄青在順德軍枷送劉滬下所司當補攝之初事頗嚴宻及呼問之際衆謂必行軍法豈可預造大枷有同兒戲若本軍從來有此大枷即都轉運司合因此别作行遣以此搆謗不近人情一言涇原路經略司令人把定邠州院門遂致劉滬疾患此時臣雖在式假後來體問得都無此事且邠州係是環慶路綂制於涇原本不相轄況劉滬是朝足送下本州寄禁若涇原路差人把門豈得不晝時申都轉運司及具聞奏據此二事只欲朝廷知涇原路經略司要致劉滬獄􅂮以快私憤都無公心觀此用意實可驚駭又衆言鄭戬罷四路後别授朝廷與修水洛城所以劉滬得免專輒之罪臣勘㑹於三月九日本司准樞宻院三月二日劄子云據鄭戬奏水洛城並是當司一靣興修若便中止實恐生熟蕃部逓相讐殺却為邊患貼黄又言或且令臣戬在涇州州月日候許迁等軍馬囘即起發赴任又水洛城降指揮令涇原路一靣相度指揮去訖所有許迁等又已别移住使其兵士等亦繫分擘徃逐路替援年滿及權駐泊人數奉聖旨令鄭戬一依所授宣敕指揮疾速將許迁手下兵馬差使臣管押徃指定路分訖起發赴任鄭戬既承准士件朝㫖明知水洛城本路得一靣指揮如委實興脩有利只令論奏别聽朝廷指揮豈可尚與劉滬文牒一靣督促及稱專奉朝㫖遂致劉滬託此為名故違本路節制勘院既不收堅取勘法寺又無較止以此鄭戬所稱專奉朝㫖臣實難以暁㑹臣與狄青只據本司所授到樞宻院劄子内聖㫖施行豈敢曲附鄭戬上違朝命然群謗之起亦有所因鄭戬與麥知微交結情􅆻至㴱昨令許迁等軍馬興修水洛城其麥知微係是本路走馬承受却作都大名因綂管兵馬以至修城指使工匠皆望修了遷轉及近邊細民又得弓箭手把土劉滬不惜財貨招致小人所以罷修之後謗議紛然臣與狄青都不采聽所恃者朝廷公道所賴者陛下聖明是以前後所上章奏惟論國家利害不與戬輩爭辨是非至於京師書問亦皆斷絶即不知戬輩謗臣更有何事朝廷聞臣更有何過􅀡至今來臣未得赴任方始自疑兼臣昨於本司備録到水洛城始末一宗文字欲乞令臣暫乗逓馬赴闕面奏事狀及乞將鄭戬等所奏臣事降下許臣分析臣若曽上違聖㫖矯稱朝命專擅生事誣謗陷人如鄭戬之罪百分有一即乞伏刑都市以勵邊臣儻以事體未明須合證辨即乞與鄭戬一處下獄照􅍟以明國典況臣十年之中三次左降至于榮進本不繫心非為降着差遣方此論列只縁臣當聖明之朝被此誣謗若不陳述臣雖瞑目自衘恨九泉伏望陛下察臣忠憤閔臣寃枉特賜早降指揮干冐宸嚴臣無任戰越俟命之至謹具狀奏聞伏候敕㫖慶曆四年六月日朝奉郞行右司諫􅀡集賢院新差知晉州軍州事上騎都尉賜緋魚袋借紫臣尹洙伏奏論雪石輅狀右臣昨在涇原路竊見著作佐郎管勾本路機宐文字石輅為因于張亢初到任時曽言母在濮州欲求一京東差遣因便寧親其時張亢不曽允許後經隔數月因本路發遣年滿兵㱕亢遂差輅及駐泊都監同天監祇應人等各押兵士㱕京及令輅因便催促京東州軍兵士衣賜輅因得徃濮州寧親䝉朝廷差官勘罪法等以私罪定斷罰銅降究京西監當是時臣以方移差遣不敢為輅有所陳雪原輅所招情􅅃只是從初於張亢處欲求差遣因便省母張亢即不曽允許後來經隔數月方令管押兵士輅是文臣尺有不合承受押兵之罪初定私罪即不曽㑹問到張亢狄青其時輅有無請囑之言若輅于管押兵士之時實有寧親之請于孝治之朝尚冀寛貸況追治舊日語言坐以私罪情實可矜今遇郊禮慶澤之後伏望聖慈特移輅一京東親民差遣及乞改從公罪定斷臣與輅共事將及一年輅之操履臣所具悉如䝉朝廷移輅差遣及改定罪名後輅犯贓私罪臣並甘同罪不辭謹具狀奏聞伏􅀱敕旨河南先生文集巻之二十一
