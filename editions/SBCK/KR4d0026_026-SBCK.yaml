front:
  text: 河南先生文集卷之二十六
  hash: sha256:7a7e5e77c13a45f6180af9e324b8493a64d039ac6711ad1f2fd6b27094f8923f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4d0026_SBCK_026-1a}
body:
  text: 五代春秋梁太祖開平元年四月甲子帝即位于汴州戊辰改元建汴州爲東都改京師爲西都五月李思安帥師及晉人戰于潞城思安師敗績二年正月晉王克用薨三月壬申帝幸東都征潞州丁丑次澤州晉人還師四月丙午帝還東都五月晉人救潞州破夾城遂攻澤州六月戊申淮南張灝弑其君偓呉人誅張灝秦人來冦雍州同州劉知俊敗秦師于莫谷八月晉人來侵晉州九月丁丑帝西征次夾州十月丁已帝還東都楚人克朗州殺雷彥恭三年正月甲戌帝幸西都辛卯帝祀上帝于圓丘三月甲戌帝幸河中四月同州劉知俊伐秦克鄜坊丹延四州五月已卯帝還西都殺雍州王仲師六月同州劉知俊叛附于秦辛亥帝西征次陜州劉知俊奔秦幽州劉守光伐滄州執其兄守文以歸七月晉人來攻晉州乙亥帝還西都八月楊師厚帥師接晉州晉人還師十一月甲午帝告謝于圓丘秦人來侵灵州陜州康懷英侵秦克寧慶衍三州秦人來襲懷英師敗于昇平四年正月燕王守光克滄州五月鄴王紹威薨八月晉人秦人來侵夏州庚寅帝西征次陜州九月已丑帝還西都十一月趙王鎔定州王處􅀡附于晉王景仁帥師北討次于柏鄕乾化元年正月丙戌朔日有食之王景仁及晉王趙人定人戰于柏鄕景仁師敗績晉師圍邢州二月晉帥侵魏州楊師厚帥師援邢州晉人還師五月改元南海王􅀮薨六月晉人來侵湯陰九月帝北征次魏縣十月延州高方興克鹽州十一月壬辰帝西都復位二年二月甲子帝北征次貝州侵趙克􅀥強進次蓚縣圍之晉人救蓨帝還師滄州張方進以地來㱕四月已丑帝遂幸東都帝不豫五月甲申還西都薛貽矩薨六月戊寅皇子友珪弑逆帝崩于寢殿殺友文八月河中朱友謙附于晉康懷英帥師攻河中晉王救河中西都晉人來取楊劉四年正月晉人來侵鄆州已卯帝還東都謝彥章帥師侵晉攻楊劉晉王救楊劉彥章及晉王戰彥章師敗績十二月賀環殺謝彥章賀環及晉王戰于胡柳陂晉師敗績是夕再戰環師敗績晉人取濮陽邠州李保衡以地來㱕五年正月晉人城德勝夾河爲柵三月兖州張守進叛附于晉四月賀環帥師攻德勝南城不克八月王瓚帥師侵晉十月劉鄩克兖州誅張守進十二月王瓚及晉王戰于河瓚師敗績六年春河中朱友謙襲陷同州六月劉鄩帥師圍同州九月晉李嗣昭救同州劉鄩及晉李嗣昭戰鄩師敗績龍德元年二月趙人張文禮弑其君鎔四月陳州友能反師圍陳州七月友能降赦之八月晉閻寳帥師討張文禮十月戴思遠帥師侵晉攻德勝北城晉王救德勝思遠及晉王戰於戚城思遠師敗績定州王處􅀡爲其子都所廢二年正月戴思遠侵晉取成安遂攻德勝北城晉王敗契丹于新城二月晉王救德勝思遠退師八月叚凝帥師攻晉衞州克之晉李存審克鎭州誅張文禮三年三月潞州李繼韜以地來附四月晉人來取鄆州五月王彥章輩帥師侵晉攻德勝南城克之晉帥弃德勝北城保楊劉王彥章困楊劉不克八月叚凝帥師侵晉十月辛未朔日有食之晉王來襲中都王彥章師敗于中都彥章沒于師晉師迫京師戊寅帝崩于建國樓下後唐莊宗神閔皇帝同光元年四月已已帝即位于鄴都十月戊寅滅梁已卯帝至汴州誅敬翔李振十二月庚午帝至京師誅潞州李繼韜二年正月契丹來冦幽州庚申帝幸河陽辛酉帝迎皇太后至京師二月己已帝祀上帝于圜丘四月秦王茂正薨盜據潞州五月克之十一月癸卯帝畋于伊闕丙午帝還京師十二月庚午帝及皇后劉氏幸張全義第三年正月帝在汴州四月定州王都拒命王晏球帥師討定州七月契丹救定州王晏球敗契丹于唐河幽州趙德鈞敗契丹于府西九月誅溫韜叚凝四年正月帝在汴州二月王晏球克定州誅王都崔協薨三月庚午帝還京師四月契丹來冦雲州七月誅毛璋荆南高季與順命赦長興元年二月乙卯祀上帝于圜丘改元九月東川董璋拒命石敬瑭帥師討璋十二月楚王殷薨鄴國公仁矩薨二年正月契丹突欲率衆來歸五月誅安重誨十一月甲申朔日有食之三年六月河決衞州西川孟知祥克東州誅董璋京師大水七月越王鏐薨八月湖南馬希聲薨四年四月夏州李􅃔超拒命安從進帥師討夏州不克八月皇子從榮爲兵馬元帥十月赦李􅃔超十一月戊子帝不豫壬午誅從榮戊戌帝崩于雍和殿愍皇帝長興四年十二月癸卯朔帝即位應順元年正月改元西川孟知祥拒命盜殺安州符彥超二月鳳翔從珂拒命王恩同帥㱕攻鳳翔不克從珂舉兵向京師康義誠帥師討從珂河中安彥滅陜州康思立叛王思同沒于師康義誠以師叛戊辰帝遜于衞州四月壬申從珂入京師戊寅帝崩于衞州河南先生文集卷之二十六
