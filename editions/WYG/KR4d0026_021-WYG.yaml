front:
  text: 右臣體量本路見今主兵官員或遇西賊入冦若只令主管隊兵臨時得人統制號令進退有所禀從即人皆協力不致有前項敗事若委以兵衆進退許其自便則臣等未敢保其能否兼臣初到亦未盡知其材畧或相次體量得實有敗事者即與狄青别具陳奏
  hash: sha256:d1e51985aa9904becd4b5d7eacb3ccb1a2b3c7e4ac3641f9d5c5d401aea64112
  markers:
  - {type: page-break, offset: 84, content: '', id: KR4d0026_WYG_021-1b, image: WYG1090/WYG1090-0118d.png}
body:
  text: 奉詔及四路司指揮分擘本路兵馬弓箭手把截賊馬來路狀本路經畧司累據諸處探報到賊界㸃集事宜緊切若於本路入冦即部署狄青合依先降預議指揮領兵于瓦亭寨駐劄其狄青忠純可信厚重可倚臣毎與之講議軍政至于臨敵制變亦合事機臣但慮拘于朝廷法制未盡其才臣欲乞軍行之後朝廷或降指揮并四路招討司行下文字係干進退兵馬分擘將佐有與軍前事體相妨者許令狄青相度其未便因依開奏及回申四路司不得將未便事理一例承禀施行如允臣所奏特降聖㫖庶令狄青有所遵守得以專心戎旅不致敗事論雪部署狄青回易公使錢狀右臣准邠州制勘院牒勾取部署司指揮劉懷信勒檢齎借銀一千兩文憑赴院尋牒部署司勾職到劉懷信其部署狄青兼令劉懷信自齎公使文厯赴邠州照㑹去訖尋體問得劉懷信是勾當公使庫使臣為于隨軍庫借過上件銀回易利息以充公用事臣切見自來武臣將所賜公使錢諸襍使用便同已物其狄青于公用使物即無分毫私用况本路自西事以來所添兵數及主兵將臣寮指使使臣等數倍于舊又狄青多與衆官躬親提舉校閲軍中將校毎有犒設以此所費益多若不别將錢物回易即無由充用狄青素來謹畏小心其實武人未曉朝廷憲法自聞推究公用錢物將謂制院須來追攝照對臣雖日夕曉譬終是内懷憂懼兼言先在延州初授經原部署曾告龎籍言不願主領公使錢恐未知次第今來果遭􅇢罣詞意感切深可軫惻臣以為朝廷擢青自殿直不三年至刺史委以一路兵柄此必其忠力才智有過于人又欲其奮勵自効以報不次之用今乃以細㣲詿誤令其畏懼如此今邊上日有探到事宜萬一賊兵驟至若須領兵出外似此憂疑之中切慮不能主理軍政别致闕事伏望聖慈垂察將降朝㫖曉諭狄青庶令安心專慮邊事奉詔令劉滬董士㢘却且往水洛城勾當狀中書樞宻院同奉聖㫖所有水洛城仰魚周詢往渭州與本路經畧部署司疾速同共支撥軍馬粮草應副早令事畢仍令劉滬董士㢘却且往彼勾當所有勘到罪狀别聽指揮右臣等檢㑹前奏乞罷修水洛城事狀盖慮乆逺却為邊患今來患既未至朝廷必行興修則臣等無以自辨更不敢别有陳述伏縁臣等前後行與劉滬指揮並明坐朝旨劉滬所執乃是鄭戬文牒其鄭戬文牒並是解罷兵權後專有行遣今若朝廷却令劉滬依舊勾當却是鄭戬罷任後所行文牒可以衝改得朝廷指揮于理深為不順臣等切慮將來逐路偏裨例各專輓行事不禀本路節制必壞軍法統兵大臣解罷兵權後尚得處置邊事於國家事體不便欲乞朝廷特降指揮檢㑹臣等前後論奏水洛城一宗文字并本司録白鄭戬罷任後所行文牒及臣等今奏降下臺省百官集議庶得申明國典况臣等所奏偏裨違犯節制盖恐壞軍中綱紀所論大臣罷兵後侵撓軍政實係國家安危非止為本路一時之事願陛下思守邊之逺畧念社稷之大計若此日不行威斷則異時必生朝廷之患伏望聖慈特賜省察乞與鄭戬下御史臺對照水洛城事狀右臣准中書劄子奉聖旨候潘師旦成資方得交割勾當臣已具待闕去處聞奏訖臣切見自來諫官御史應授差遣少有于諸處待闕者臣到慶州未十日因孫沔陳乞患疾不赴涇原路却還舊任就移臣知晉州其潘師旦在晉州已一年餘九個月却令臣待闕事體之間深有可疑臣之私心實懷憂懼伏念臣自忝涇原一路寄委及近一年近于戎事並與狄青商量處置未嘗有分毫差失亦不敢將邊鄙細務頻有陳請煩凟聖聽其合奏公事前後多䝉俞允臣與狄青雖出處異而忠義一心但專為枝梧昊賊不敢邀功生事庶幾外禦冦讎上副寄委只是水洛城奉聖旨罷修巳來鄭戬及劉滬朋黨造作謗言傳于道路其間多不詳其本末今且以衆所傳聞者兩事明之一言劉滬所帶枷重四十餘斤且狄青在徳順軍枷送劉滬下所司當捕攝之初事頗嚴宻及呼問之際衆謂必行軍法豈可預進大枷有同兒戲若本軍從來有此大枷即都轉運司合因此别作行遣似此搆謗不近人情一言涇原路經畧司令人把定邠州州院門遂致劉滬患疾此時臣雖在假後來體問得都無此事且邠州係是環慶路統制于涇原本不相轄况劉滬是朝廷送下本州寄禁若涇原路差人把門豈得不畫時申都轉運司及具聞奏據此二事只欲朝廷知涇原路經畧司要致劉滬獄死以快私憤都無公心觀此用意實為驚駭又衆言鄭戬罷四路後别授朝㫖興修水洛城所以劉滬得免專輒之罪臣勘㑹于三月九日本司准樞宻院三月二日劄子云據鄭戬奏水洛城並是當司一靣興修若便中止實恐生熟蕃部遞相讎殺却為邊患貼黄又言或且令臣戬在涇州半月日候許遷等軍馬回即起發赴任又水洛城已降指揮令涇原路一靣相度指揮去訖所有許遷等又已别移住使其兵士等亦係分擘住逐路年滿替換又權駐泊人數奉聖旨令鄭戬一依所授宣勅指揮疾速將許遷手下兵馬差使臣管押往指定路分訖起發赴任鄭戬既承准上件朝㫖明知水洛城本路得一靣指揮如委實興修有利只合論奏别聽朝廷指揮豈可尚與劉滬文牒一靣督促及稱專奉朝㫖遂致劉滬託此為名故違本路節制制勘院既不收監取勘法寺又無較正以此鄭戬所稱專奉朝㫖臣實難以暁㑹臣與狄青只據本司所授到樞宻院劄子内聖㫖施行豈敢曲附鄭戬上違朝命然羣謗之起亦有所因鄭戬與麥知㣲交結情契至深昨令許遷等軍馬興修水洛城其麥知㣲係是本路走馬承受却作都大名目統管兵馬以至修城指使工匠皆望修了遷轉及近邊細民又得弓箭手地土劉滬不惜財貨致招小人所以罷修之後謗議紛然臣與狄青都不采聽所恃者朝廷公道所頼者陛下聖明是以前後所上章奏惟論國家利害不與戬輩争辨是非至于京師書問亦皆斷絶即不知戬輩謗臣更有何事朝廷聞臣更有何過直至今來臣未得赴任方始自疑兼臣昨于本司備録到水洛城始末一宗文字欲乞令臣暫乗逓馬赴闕面奏事狀及乞將鄭戬等所奏臣事降下許臣分析臣若曽上違聖㫖矯稱朝命專擅生事誣謗陷人如鄭戬之罪百分有一即乞伏刑都市以勵邊臣倘以事體未明須合證辨即乞與鄭戬一處下獄照對以明國典况臣十年之中三次左降至于榮進本不繫心非為降着差遣方立此論只縁臣當聖明之朝被此誣謗若不陳述雖瞑目衘恨九泉伏望陛下察臣忠憤憫臣寃枉特賜蚤降指揮干冐宸嚴臣無任戰越俟命之至謹具狀奏聞伏候勅㫖論雪石輅狀右臣昨在涇原路竊見著作佐郎管勾本路機宜文字石輅為因於張亢初到任時曽言母在濮州欲求一京東差遣因便寧親其時張亢不曽允許後經隔數月因本路發遣年滿兵歸京遂差輅及駐泊都監司天監祗應人等各押兵士歸京及令輅因便催促京東州軍兵士衣賜輅因得往濮州寧親䝉朝廷差官勘罪法寺以私罪定斷罰銅降充京西監當是時臣以方移差遣不敢為輅有所陳雪原輅所招情欵只是從初于張亢處欲求差遣因便省母張亢不即曽允許後來經隔數月方令管押兵士輅是文臣只有不合承受押兵之罪所定私罪即不曽㑹問到張亢狄青其時輅有無請屬之言若輅于管押兵士之時實有寧親之請於孝治之朝尚兾寛貸况追治舊日語言坐以私罪情實可矜今遇郊禮慶澤之後伏望聖慈特移輅一京東親民差遣及乞改從公罪定斷臣與輅共事一年輅之操履臣所具悉如䝉朝廷移輅差遣及改定罪名後輅犯賍私罪臣並甘同罪不辭謹具狀奏河南集巻二十一欽定四庫全書河南集巻二十二宋尹洙撰奉詔分析董士㢘奏臣不公事狀具衘臣尹某准中書劄子著作佐郎新差知蔡州確山縣事董士㢘奏臣不公事奉聖㫖令臣疾速分析詣實入馬逓聞奏臣今依准劄子内畫一分析如後一韓琦尹洙起謀入界至好水川因任福妬功耿傳狂狷致兵敗折數萬人尹某作閔忠辨誣文誑惑中外令李仲昌刻石掩韓琦惡今來尹某自知虛誑却毁棄刻石碑子臣今詳董士㢘所稱韓琦及臣起謀入界欲乞于中書樞宻院檢詳陜西經畧司先奏攻守二䇿朝廷擇用攻䇿後來曾與未曾入界及好水川接戰因與不因起謀入界致得敗衂所有憫忠辨誣二文臣實有此撰述以勸忠義乞檢㑹任福等敗衂事及韓琦先繳進任福下孔目官彭忠所收得耿傳親書署朱觀名誡任福令持重文字與臣所撰二文照騐即知有無虚誑臣元不曽令人刻石今據傳寫到本是乾州判官李師錫立石即不是李仲昌欲乞㑹同本州因何人立石後來於何年月日何人毁棄即知詣實兼臣見諸處尋求石本候尋得别具繳連進呈次一尹某在渭州專擅將官錢百貫入巳使用并借官錢與官員還債并支出軍資庫錢落下赤厯都轉運司程戡曾差儀州華亭主簿王資磨勘見得侵欺官錢的實臣勘㑹渭州應係官錢及公使錢各有監主及文厯拘管乞下本州勘㑹及將臣任内公使錢文厯磨勘即見得有無欺隠所有借錢與人還債臣初到任為禮賔副使孫用曾于鄜延路在狄青手下使喚得力本人為自軍職授官在京借却人錢物遂與狄青各借與公使錢今本官于料錢内還納所有軍資庫自有通判録事㕘軍管勾臣即不知落下赤厯因依乞下本處勘㑹轉運司差官磨勘得見何人侵欺後來作何發遣即得詣實右謹具如前所分析顯是詣實所有臣先撰憫忠辨誣二文今抄録粘連在前謹具狀奏聞謹奏覆奏監察御史李京劄子狀准河東都轉運司差官准勅取問臣前知渭州日借支過銀錢事并連到監察御史李京劄子言切聞韓琦罷樞宻副使因董士㢘疏論水洛城并處置邊機不當事伏縁韓琦之過自尹洙始今琦已罷柄住洙則仍守舊官人言藉藉于理未順雖聞已降指揮令尹洙分析又縁事與韓琦不殊切慮别有指説遂至紛拿兼聽知魚周詢相度回日繳奏到邊民被害之家指論尹洙文狀事甚明白欲望朝廷檢㑹魚周詢前奏并今來董士㢘所陳其尹洙早賜處分所貴與韓琦行罰頗均方協衆望右謹具如前臣已依應勅命供析前知渭州日依例支錢銀回易應副公用去訖臣切見李京上言雖聞已降指揮令臣分析切慮别有指説遂至紛拏臣切詳故事御史得風聞言事既稱風聞則容有不實是以所言雖虚皆不及坐朝廷若以事狀顯明不須按覆即時裁處自繫聖斷御史所守則有職分若京之所陳雖増臣過惡萬端或
