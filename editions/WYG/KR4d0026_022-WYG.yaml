seq: 22
body:
  text: 乞加臣峻典于言事之體皆未為失唯不當慮臣别有指説乞朝廷便行處分且聖明在上若臣實有過犯必不徇先入之言曲加譴謫若的有罪狀豈容紛拏得令茍免况京所言初云切聞後云聽知則是未能决信于已也未能决信于已而欲决行于朝廷其惑亦甚矣所頼聖慈垂察許臣分析事狀盡得辨明向若從京之言則賤臣被抑固不足論然上損治體亦非細事臣聞厯代用刑多有過濫列聖臨御未嘗獨任威罰及于一臣先朝建按刑之官凡罪無粗細悉以審究三代以還刑罰之慎未有如皇世者也今京欲用偏至之詞塞辨治之實此原或開人無所措臣謂上損國體者以此而言也京又云魚周詢繳奏到邊民被害之家指論臣事臣不知周詢所言邊民縁何被害有無處所去年臣累奏乞朝廷將臣與狄青廢罷水洛城因依令百官集議及乞下獄對辨未䝉省察縁當時狄青自邊上處置水洛城事回已有劉滬董士㢘等隨行人傳言被害人數甚多尋取責逐處並不見得放害之人其周詢所言被害之家後來朝廷必曽體量安恤及必有居止去處若果縁臣處置乖方致令邊民被害即後來轉臣起居舎人直龍圖閣此時京巳任御史當極言論列朝廷如察臣灼然有過即不當更霑恩命若引董士㢘所陳之言不復推較切為過矣且士㢘本非言事之臣只縁曾為水洛城事繫獄二十餘日以此挟恨掎摭雖忠信淳厚之人其言不免過實京待士㢘果為忠厚之人亦當少原其情漸騐虚實乃欲朝廷盡從其言尤所未論京又言所貴與韓琦行罰頗均臣聞本朝執政大臣出入中外自有常制今琦加資政殿學士制書復有褒言君臣之恩未為不厚謂之行罰理所未安臣又聞言事者主于言而已言之不從繼言之可也伏閤請對可也不然解避其職皆為得體若夫刑賞廢置乃朝廷大柄非言事者得專之也今御史既得風聞言事又欲朝廷不辨明而行罰是臣下進退皆繫于御史其權不亦過重哉嘗聞景徳初河北轉運使劉綜上言供備庫使白守素武勇請正除刺史真宗謂近臣曰將帥有功烈狀以聞可也疇勞命秩自有常典綜何預焉監司之居外猶御史之在朝也真宗持賞罰之柄不欲移于羣下聖意如此伏望陛下稽法先訓諮詢故典察迎合之言革朋比之風則天下幸甚臣累䝉進擢班在侍從雖被論疏若已就鞠劾即不敢與言事臣寮辨論曲直今䝉就問不當專為申理以祈恩貸兼復建明事體庶禆聖政伏望聖慈特賜省覧謹具狀奏軍制臣竊見諸路兵馬自來分與諸將則統制不一臨時差撥則兵將不相諳練盖由節制不分名級未辨是以難于處置臣聞有部分然後有號令有號令然後有賞罰今部分未立號令何由而起賞罰何由而施以此用兵從古未有以臣愚見必若身之使臂臂之使指然後號令行而賞罰明今略定軍制件析如後逐路大將一人本路兵馬進退戰守皆專制之敗衂則任其責副貳一人大將所制之事皆佐之敗衂則從坐列將十人分掌本路之兵步騎相㕘大率以五千為准不必定其數大將量其才而授之任所主之兵其進退即禀命于大將一軍之勝負大將上其狀而賞罰之本路處置即皆不預隊將五十人每列將一人各給隊將五人所主隊兵之進退皆禀命于列將右臣所畫部分今畧定名級伏乞朝廷講議節制頒下諸路仍乞不許臣寮上言所貴上禀廟畧謹具狀奏聞鬻爵法臣前次上殿奏乞召募邊兵其間令要例物及修葢營房須有所費竊慮三司未能應副臣欲乞朝廷創定鬻爵之法司封出空名爵牒散下州郡人入粟授爵今定爵二等第一等爵許畜女使許使渾銀飲食器凡欲授第一等爵者如元係州府縣鎮城郭等户即入粟一百石如不係户等即入粟五十石第二等爵許以金珠為婦女服飾如犯公罪許贖凡欲授第二等爵者入粟五百石右入粟每百石令入錢三十貫今臣約計授爵之數可得十萬家通两等之數當得錢三百萬貫專充召募邊兵乞不别有支用其未有爵之人除士族别無禁制外舉人曾經鄉貢并州郡牙校職員京百司人吏並與依第一等爵例將來諸州仍乞立近限如不願授爵者即任便變易若限外有陳告並違科制之例其畜女使及銀器者賞錢三十貫所畜女使放從良銀器沒官所賞錢並以犯事人家財充内婦人無男夫及男子十五以下即不許人陳告所定爵名并更有合條約事件乞下中書門下参酌施行獲首級例一諸處軍隊或五十人或一十五人或不及二十五人為一隊共獲賊首一級擒生同下皆准此依賞格所給第四等賜分與一隊將士如獲級五分以上並以田戰元數為定不除輸折數下皆准此即全隊並與第五等轉一管押軍隊人員十將以下差管押十人已上並同即游儌或為竒兵亦依軍隊例下皆准此不滿五十人殺獲與輸折相當外獲五級與第五等轉五級加一等其獲二十級雖輸折相等亦第五等轉所管不滿百人殺獲與輸折相當外獲七級與第四等轉七級加一等其獲三十級已上雖輸折相等亦與第五等轉百人已上殺獲與輸折相當外獲十級與第五等轉十級加一等其獲四十級已上雖輸折相當與第五等轉二百人已上殺獲與輸折相當外獲十五級與第五等轉十五級加一等其獲五十級已上雖輸折相等亦第五等轉二百人已上殺獲與輸折相當外獲二十級與第五等轉二十級加一等其獲六十級已上雖輸折相等亦第五等轉一管押軍隊使臣即閤門祗候已上如所管不滿千人並依此所管不滿三百人殺獲與輸折相當外獲十級與五等轉十級加一等其獲三十級已上雖輸折相當亦第五等轉所管不滿三百人殺獲與輸折相當外獲十五級與第五等轉十五級加一等其獲四十級已上雖輸折相當亦第五等轉不滿五百人殺獲與輸折相當外獲二十級與第五等轉二十級加一等其獲五十級已上雖輸折相等亦第五等轉不滿千人殺獲與輸折相當外獲三十級與第五等轉三十級加一等其獲六十級已上雖輸折相等亦第五等轉一主兵官員所領千人已上供奉官已下所管千人已上依此例殺獲與輸折相當外獲五十級與五等轉五十級加一等其獲一百級已上雖輸折相等亦第五等轉所領三千人已上殺獲與輸折相當外獲一百級與第五等轉一百級加一等其獲二百級已上雖輸折相等亦五等轉一使臣軍員親自用命有所斬獲所管將士别無輸折或輸折相等者與第五等轉如有輸折不及所得者只給第四等轉即違主將令取首級者自依軍法餘皆准此一如得主將命專取某人而能殺獲者與第四等轉一殺獲賊中首領者與第五等轉如近上首級即與加等轉若加至第三等即本管人員亦與第五等轉若加至第一等即全隊及本管人員使臣並與第五等轉一軍陣所獲一百級須轉折相等已上除計首級合轉人數外别許酬奬得力軍員使臣共三人凡百級加三人其十将已下倍此數一應非軍陣合戰有所斬獲者一級與第五等轉一級加一等所管使臣人員依軍陣例河南集卷二十二欽定四庫全書河南集巻二十三宋尹洙撰
